<!-- Les Joutes a changé d'adresse le 11/11/2026 : le jeu est publié sur https://lesjoutes.fr/ (version 102).
     Cette page ne fait que renvoyer vers la nouvelle adresse, en gardant ?… et #… (le code d'une table) et en envoyant les données du jeu
     (profil, records, clé du joueur, amis) à la nouvelle adresse, qui les range (voir migrate.html là-bas). Ne pas y remettre le jeu.
     L'origine patrickmorvan21.github.io est partagée avec d'autres pages : seules les clés du jeu partent (ddl-, jt-maison, farmtd-, gemtd-, gemmes-v1-). -->
<title>Les Joutes</title>
<meta name="referrer" content="origin">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://lesjoutes.fr/">
<meta name="theme-color" content="#1b2b34">
<meta name="description" content="Rejoins ma table ! Line Towers, Gem TD et Fusion TD : jusqu'à 6 joueurs, dans le navigateur, sans compte.">

<meta property="og:site_name" content="Les Joutes">

<style>html,body{margin:0;height:100%;background:#1b2b34;color:#e0e5e6;font:16px/1.4 system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center;padding:0 16px;text-align:center}a{color:#e8c66a}</style>
</head>
<body>
<p>Les Joutes a changé d'adresse : <a href="https://lesjoutes.fr/" id="go">lesjoutes.fr</a></p>
<script>
(function () {
  var NEW = 'https://lesjoutes.fr/';
  var KEEP = /^(ddl-|jt-maison$|farmtd-|gemtd-|gemmes-v1-)/, SKIP = /-test$/;
  var q = location.search, h = location.hash;
  function link() { try { document.getElementById('go').href = NEW + q + h; } catch (e) {} }
  link();
  var ls = {}, size = 0, LIMIT = 48000;
  var FIRST = ['ddl-rkey', 'ddl-rpid', 'ddl-pid', 'ddl-nick', 'jt-maison', 'ddl-col', 'ddl-meta', 'ddl-best', 'ddl-rec-meta'];
  try {
    var ks = [];
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (KEEP.test(k) && !SKIP.test(k)) ks.push(k); }
    ks.sort(function (a, b) {
      var pa = FIRST.indexOf(a), pb = FIRST.indexOf(b);
      pa = pa < 0 ? 99 : pa; pb = pb < 0 ? 99 : pb;
      return pa - pb || localStorage.getItem(a).length - localStorage.getItem(b).length;
    });
    ks.forEach(function (k) {
      var v = localStorage.getItem(k);
      if (typeof v !== 'string') return;
      if (size + k.length + v.length > LIMIT && FIRST.indexOf(k) < 0) return;     // too big for an address: the identity first, the rest as it fits
      ls[k] = v; size += k.length + v.length;
    });
  } catch (e) {}
  var msg = { v: 1, ls: ls, q: q, h: h };
  var b = '';
  try { b = btoa(unescape(encodeURIComponent(JSON.stringify(msg)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); } catch (e) {}
  var url = NEW + 'migrate.html' + (b ? '#' + b : '');
  try { location.replace(url); } catch (e) { location.href = NEW + q + h; }
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://lesjoutes.fr/"></noscript>
</body>
</html>
