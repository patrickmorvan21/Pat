<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PACTUM — Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --charbon:#1c1a16;
    --orange:#e0632a;
    --blanc:#ffffff;
    --blanc-50:rgba(255,255,255,.5);
    --blanc-20:rgba(255,255,255,.2);
    --rouge:#a4001b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--charbon);color:var(--blanc);font-family:'Roboto Mono',monospace;font-size:13px;overflow:hidden}

  /* ============ barre haute ============ */
  #top{
    position:fixed;top:0;left:0;right:0;height:58px;z-index:30;
    background:var(--charbon);border-bottom:1px solid var(--blanc-20);
    display:flex;align-items:center;gap:18px;padding:0 18px;
  }
  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:21px;letter-spacing:2px;line-height:1;white-space:nowrap}
  #fil{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--blanc-50);flex:1 1 auto;min-width:0}
  #fil b{color:var(--blanc);font-weight:400}
  #fil button{background:none;border:none;color:var(--blanc-50);font-family:inherit;font-size:11px;
    cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
  .tbtn{
    background:none;border:1px solid var(--blanc-20);color:var(--blanc-50);
    font-family:inherit;font-size:10px;letter-spacing:1px;text-transform:uppercase;
    padding:7px 11px;cursor:pointer;white-space:nowrap;
  }
  .tbtn:hover{border-color:var(--blanc-50);color:var(--blanc)}
  .tbtn.act{border-color:var(--orange);color:var(--orange)}
  .tbtn.act.on{background:var(--orange);color:var(--charbon)}
  #dirty{font-size:10px;color:var(--orange);white-space:nowrap}

  /* ============ vue carte ============ */
  #carte{position:absolute;top:58px;left:0;right:0;bottom:0;overflow:auto;display:none}
  #carte.on{display:block}
  /* La TOILE porte la taille réelle (donc les barres de défilement) ; la
     couche intérieure porte le zoom. Mettre le transform sur l'élément qui
     défile donnerait des barres fausses : elles suivraient la taille avant
     zoom, et la moitié de la carte deviendrait inatteignable. */
  #carteToile{position:relative}
  #carteInner{position:relative;transform-origin:0 0;width:1500px;height:1300px}
  #zoomCarte{position:fixed;left:16px;bottom:14px;display:flex;gap:6px;z-index:20}
  #zoomCarte button{background:var(--charbon);border:1px solid var(--blanc-20);
    color:var(--blanc-50);font:inherit;font-size:11px;letter-spacing:1px;
    padding:5px 9px;cursor:pointer;min-width:30px}
  #zoomCarte button:hover{border-color:var(--orange);color:var(--orange)}
  #zTaux{min-width:56px}
  .lieuCard{position:absolute;width:212px;background:var(--charbon);border:2px solid var(--orange);cursor:pointer}
  .lieuCard.pb{border-color:var(--rouge)}
  .lieuCard .th{position:relative;width:100%;height:108px;overflow:hidden;background:#141310}
  .lieuCard img,.lieuCard canvas{width:100%;height:100%;object-fit:cover;display:block}
  .lieuCard .bd{padding:8px 10px 10px}
  .lieuCard .nm{font-size:12.5px;line-height:1.3}
  .lieuCard .sb{font-size:10px;color:var(--blanc-50);margin-top:4px}
  .lieuCard .al{font-size:10px;color:var(--orange);margin-top:4px}

  /* ============ vue graphe ============ */
  #graphe{position:absolute;top:58px;left:0;right:0;bottom:0;overflow:hidden;display:none;cursor:grab}
  #graphe.on{display:block}
  #graphe.drag{cursor:grabbing}
  #scene{position:absolute;transform-origin:0 0;will-change:transform}
  #edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  .node{
    position:absolute;width:210px;background:var(--charbon);
    border:2px solid var(--blanc-20);cursor:pointer;user-select:none;
  }
  .node.lieu{border-color:var(--orange)}
  .node.arrivee{border-color:var(--orange)}
  .node.moment{border-color:var(--blanc)}
  .node.observe{border-color:var(--blanc-20);border-style:dashed}
  .node.pb{border-color:var(--rouge)}
  /* « À modifier » : une image CÂBLÉE mais jugée mauvaise. Distinct de
     « pb » (image manquante) par la FORME autant que par la couleur —
     un bandeau, jamais un simple changement de bordure, pour qu'on ne
     confonde jamais « il n'y a rien » et « ce qui est là ne va pas ». */
  .node .mk{position:absolute;left:0;right:0;bottom:0;background:var(--orange);
    color:var(--charbon);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;
    text-align:center;padding:2px 0}
  .node.mod{border-color:var(--orange)}
  .lieuCard .mk{position:absolute;left:0;right:0;bottom:0;background:var(--orange);
    color:var(--charbon);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;
    text-align:center;padding:2px 0}
  .tbtn.mod.on{background:var(--orange);color:var(--charbon);border-color:var(--orange)}
  .modnote{font-size:10px;color:var(--orange);margin-top:6px;line-height:1.4}
  .node.sel{outline:2px solid var(--orange);outline-offset:3px}
  .node .th{position:relative;width:100%;height:86px;overflow:hidden;background:#141310}
  .node img,.node .ph{width:100%;height:100%;object-fit:cover;display:block}
  .node .bd{padding:7px 9px 9px}
  .node .kd{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--blanc-50)}
  .node .nm{font-size:12px;line-height:1.35;margin-top:3px}
  .node .al{font-size:9px;color:var(--orange);margin-top:4px}
  .node .al.r{color:var(--rouge)}

  /* ============ volet de fiche ============ */
  #fiche{
    position:fixed;top:58px;right:0;bottom:0;width:min(720px,60vw);z-index:40;
    background:var(--charbon);border-left:1px solid var(--blanc-20);
    transform:translateX(101%);display:flex;flex-direction:column;
  }
  #fiche.on{transform:translateX(0)}
  #fh{padding:16px 22px 12px;border-bottom:1px solid var(--blanc-20);position:relative;flex:0 0 auto}
  #fh h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:24px;line-height:1.15;padding-right:44px}
  #fh .mt{font-size:10px;color:var(--blanc-50);margin-top:6px;letter-spacing:1px;text-transform:uppercase}
  #fclose{position:absolute;top:16px;right:20px;width:28px;height:28px;background:none;
    border:2px solid var(--blanc);color:var(--blanc);font-family:inherit;font-size:12px;
    cursor:pointer;transform:rotate(45deg)}
  #fclose span{display:block;transform:rotate(-45deg);line-height:24px}
  #fb{flex:1 1 auto;overflow-y:auto;padding:18px 22px 40px}

  .lab{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--blanc-50);margin-bottom:7px}
  .fld{margin-bottom:20px}
  textarea,input[type=text]{
    width:100%;background:#141310;border:1px solid var(--blanc-20);color:var(--blanc);
    font-family:inherit;font-size:13px;line-height:1.6;padding:10px 12px;resize:vertical;
  }
  textarea:focus,input:focus{outline:none;border-color:var(--orange)}
  textarea.mono{font-size:11.5px;line-height:1.55}
  .imgbox{display:flex;gap:16px;align-items:flex-start}
  .imgbox .big{flex:0 0 240px}
  .imgbox .big .fr{width:240px;aspect-ratio:1/1;background:#141310;border:1px solid var(--blanc-20);overflow:hidden}
  .imgbox .big .fr.pb{border-color:var(--rouge)}
  .imgbox .big img,.imgbox .big .ph{width:100%;height:100%;object-fit:cover;display:block}
  .imgbox .side{flex:1 1 auto;min-width:0}
  .fname{font-size:10px;color:var(--blanc-50);margin-top:7px;word-break:break-all}
  .warn{font-size:10px;color:var(--orange);margin-top:5px}
  .warn.r{color:var(--rouge)}
  select{width:100%;background:#141310;color:var(--blanc);border:1px solid var(--blanc-20);
    font-family:inherit;font-size:11px;padding:8px}
  .drop{margin-top:9px;border:1px dashed var(--blanc-20);color:var(--blanc-50);
    font-size:10px;letter-spacing:1px;text-align:center;padding:14px 8px;cursor:pointer}
  .drop.on{border-color:var(--orange);color:var(--orange)}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .liens{display:flex;flex-wrap:wrap;gap:7px}
  .lien{background:none;border:1px solid var(--blanc-20);color:var(--blanc);font-family:inherit;
    font-size:11px;padding:6px 10px;cursor:pointer}
  .lien:hover{border-color:var(--orange);color:var(--orange)}
  .lien.up{color:var(--blanc-50)}
  canvas.rule{display:block;width:100%;height:2px;image-rendering:pixelated;margin:6px 0 18px}

  /* ============ journal des écritures ============ */
  #journal{
    /* Remonté au-dessus de la commande de zoom, qui occupe le coin. */
    position:fixed;left:16px;bottom:56px;z-index:35;width:330px;max-height:34vh;overflow-y:auto;
    background:var(--charbon);border:1px solid var(--blanc-20);padding:10px 12px;display:none;
  }
  #journal.on{display:block}
  #journal .hd{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--blanc-50);margin-bottom:8px}
  #journal div.l{font-size:10px;color:var(--blanc-50);line-height:1.5;margin-bottom:5px}
  #journal b{color:var(--orange);font-weight:400}

  #hint{position:fixed;right:16px;bottom:16px;z-index:25;font-size:10px;color:var(--blanc-20);letter-spacing:1px}

  /* ============ brief pour Claude Code ============ */
  #brief{position:fixed;inset:0;z-index:60;background:rgba(12,11,9,.96);display:none;
    flex-direction:column;padding:26px 30px 22px}
  #brief.on{display:flex}
  #brief .bh{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:6px}
  #brief h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:26px;letter-spacing:1px}
  #brief .bc{font-size:11px;color:var(--blanc-50)}
  #brief .bc b{color:var(--orange);font-weight:400}
  #brief .tabs{display:flex;gap:7px;margin:12px 0 10px}
  #brief .tabs button{background:none;border:1px solid var(--blanc-20);color:var(--blanc-50);
    font-family:inherit;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:7px 12px;cursor:pointer}
  #brief .tabs button.on{background:var(--orange);border-color:var(--orange);color:var(--charbon)}
  #brief textarea{flex:1 1 auto;font-size:11.5px;line-height:1.55;min-height:0}
  #brief .ba{display:flex;gap:9px;margin-top:12px;align-items:center}
  #brief .note{font-size:10px;color:var(--blanc-50);margin-left:auto}

/* ── CARTE — les lieux sont POSÉS, pas empilés ────────────────────────────
   Chaque lieu porte un x/y dans data/zones/<zone>.json. Une région (le
   Hameau) n'a pas de position propre : son cadre est le rectangle qui
   ENGLOBE ses lieux, recalculé à chaque rendu — comme ça, déplacer un lieu
   du village déforme le cadre au lieu de le laisser mentir. */
#carteInner{cursor:grab}
#carteInner.pan{cursor:grabbing}
.lieuCard{position:absolute;user-select:none}
.lieuCard.drag{cursor:grabbing;z-index:9;box-shadow:0 0 0 1px var(--blanc)}
.regionBox{position:absolute;border:1px dashed var(--blanc-20);pointer-events:none;z-index:0}
.regTitre{position:absolute;top:-11px;left:14px;background:var(--charbon);
  padding:0 8px;font-size:12px;letter-spacing:1px;white-space:nowrap;
  display:flex;align-items:baseline;gap:10px}
.regSub{font-size:10px;color:var(--blanc-50);letter-spacing:1px;text-transform:uppercase}
.regTete{border-color:var(--orange)!important}
</style>
<script>window.__ZONE_DATA__={"zone": {"id": "landes", "nom": "Les Landes", "acte": 1, "statut": "gelee", "heure_figee": "crépuscule éternel", "particularites": ["Le Serment : imposé à l'entrée du hameau par les Renonçants (ils exigent, ne proposent pas). Contrainte tenue jusqu'à la sortie de zone = récompense ; rompue = le Geôlier s'en souvient."], "bruit_ecrit": "quelque part, une corde grince", "motif_cache": "le sceau du Bailli dissimulé dans chaque illustration de la zone", "sortie": {"id": "la_descente", "nom": "La Descente →", "note": "sortie de zone (Acte II)"}}, "lieux": [{"id": "colline_aux_gibets", "nom": "La Colline aux Gibets", "note": "lieu-signature · le Gibet Vide", "lieu_attache": null, "histoire_bailli": true, "rarete": "commune", "textes": {"decouverte": "La colline monte seule au milieu de la lande, couronnée de gibets. Tous occupés, tous immobiles — sauf un. Au centre, le plus grand est vide ; sa corde pend, usée en son milieu.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/scene_colline_aux_gibets_c.png", "portrait_requis": false, "x": 900, "y": 80}, {"id": "champ_des_fixes", "nom": "Le Champ des Fixés", "note": "cimetière des pendus", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Des rangées de poteaux à perte de vue, chacun son pendu, chacun son écriteau. Un cimetière debout. On n'enterre pas, ici : on fixe. Les morts tiennent mieux le sol que les vivants.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/scene_champ_des_fixes_b.png", "portrait_requis": false, "x": 1790, "y": 430}, {"id": "moulin_sans_ailes", "nom": "Le Moulin sans Ailes", "note": "refuge supposé de la Fille", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "À l'écart du hameau, un moulin sans ailes tient debout par habitude. Dedans, un lit de bruyère tassée — plusieurs fois refait, jamais brûlé. Un refuge qui sert, donc un refuge qui marche.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/scene_moulin_sans_ailes_d_d.png", "portrait_requis": false, "x": 300, "y": 1160}, {"id": "mare_aux_regards", "nom": "La Mare aux Regards", "note": "le reflet en retard", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": "assets/scene_mare_aux_regards_a.png", "portrait_requis": false, "x": 320, "y": 150}, {"id": "hameau_des_renoncants", "nom": "Le Hameau des Renonçants", "note": "région englobante (cadre pointillé) : contient la Chapelle des Cordes, la Maison du Bailli, le Petit Tribunal, le Puits Condamné, le Marché Muet et la Tour de Guet effondrée · le Serment s'impose à son entrée", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Des murets de pierre sèche, des toits bas, pas une flamme. Ici, on renonce : chacun laisse une chose au muret — son nom, sa hâte, sa lame ou sa langue — et jure de tenir jusqu'à la sortie des Landes. Ce n'est pas une proposition.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/scene_hameau_dense2_b.png", "portrait_requis": false, "region": true, "contient": ["tour_de_guet_effondree", "marche_muet", "petit_tribunal", "puits_condamne", "maison_du_bailli", "chapelle_des_cordes"], "x": 660, "y": 470}, {"id": "chapelle_des_cordes", "nom": "La Chapelle des Cordes", "note": "reliques des fixations", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Ni croix ni autel. Aux murs, des dizaines de cordes clouées en boucles soigneuses, chacune sous un nom gravé — les reliques des Fixations réussies. Certaines bougent doucement, sans courant d'air.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/scene_chapelle_des_cordes_d.png", "portrait_requis": false, "dans": "hameau_des_renoncants", "x": 900, "y": 470}, {"id": "maison_du_bailli", "nom": "La Maison du Bailli", "note": "murée de l'intérieur", "lieu_attache": null, "histoire_bailli": true, "rarete": "commune", "textes": {"decouverte": "La plus grande maison du hameau est murée — de l'intérieur. Chaque fenêtre bouchée de pierres posées depuis dedans, par quelqu'un qui s'enfermait plus qu'il ne se protégeait.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/scene_maison_du_bailli_c.png", "portrait_requis": false, "dans": "hameau_des_renoncants", "x": 1380, "y": 470}, {"id": "petit_tribunal", "nom": "Le Petit Tribunal", "note": "la Fixation y est jugée", "lieu_attache": null, "histoire_bailli": true, "rarete": "commune", "textes": {"decouverte": "Une seule pièce : trois bancs, une chaire, et le froid des endroits où l'on a beaucoup décidé. C'est ici que la Fixation se jugeait — le Bailli en chaire, la corde en sentence unique.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/scene_petit_tribunal_a.png", "portrait_requis": false, "dans": "hameau_des_renoncants", "x": 1140, "y": 470}, {"id": "puits_condamne", "nom": "Le Puits Condamné", "note": "planches et chaînes", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Un puits condamné de frais : planches neuves, chaînes croisées, cadenas encore gras. Tout le hameau tombe en ruine douce, mais ça, on l'entretient. Et dessous, ça cogne. Trois coups, une pause. Trois coups.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/scene_puits_condamne_c.png", "portrait_requis": false, "dans": "hameau_des_renoncants", "x": 660, "y": 740}, {"id": "marche_muet", "nom": "Le Marché Muet", "note": "troc sans paroles · Colporteur", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Un marché sans un cri, au cœur du hameau. Des étals de trois fois rien, des marchands qui négocient par gestes, paumes et hochements. Renoncer à la parole est le renoncement le plus courant. Le moins cher.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/scene_marche_muet_c.png", "portrait_requis": false, "dans": "hameau_des_renoncants", "x": 900, "y": 740}, {"id": "tour_de_guet_effondree", "nom": "La Tour de Guet effondrée", "note": "elle surveillait l'intérieur", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": "assets/scene_tour_de_guet_a.png", "portrait_requis": false, "dans": "hameau_des_renoncants", "x": 1140, "y": 740}, {"id": "verger_noir", "nom": "Le Verger Noir", "note": "fruits de cendre", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": "assets/scene_verger_noir_d.png", "portrait_requis": false, "x": 70, "y": 480}, {"id": "chemin_creux", "nom": "Le Chemin Creux", "note": "vu sans voir", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Le chemin s'enfonce entre deux talus plus hauts qu'un homme. On y marche vu sans voir : la lande entière vous regarde passer, et vous ne voyez que de la terre.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/scene_chemin_creux_c.png", "portrait_requis": false, "x": 110, "y": 860}, {"id": "borne_frontiere", "nom": "La Borne Frontière", "note": "limite des Renonçants", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Au bord du chemin, une borne de pierre penche sous les offrandes : bouts de pain durci, rubans, clous tordus. On paie ici pour entrer. Ou pour qu'on vous laisse ressortir.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/scene_borne_frontiere_a_c.png", "portrait_requis": false, "x": 1560, "y": 70}, {"id": "palissade_sud", "nom": "La Palissade Sud", "note": "le mur côté Profondeurs", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Une palissade de troncs noircis barre l'horizon d'est en ouest. Les étais sont de ce côté-ci : elle n'empêche pas d'entrer. Au centre, une porte à double battant — et derrière, un chemin qui descend, où l'air coule comme une eau froide.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/scene_palissade_sud_a_a.png", "portrait_requis": false, "x": 1160, "y": 1130}], "rencontres": [{"id": "pendu_qui_parle", "nom": "Le Pendu qui parle", "note": "gardien-jalon de la zone — le Bailli lui-même, pendu à hauteur d'homme près du Gibet Vide", "lieu_attache": "colline_aux_gibets", "histoire_bailli": true, "rarete": "commune", "gardien": true, "etats": ["intact", "balafre", "rompu"], "textes": {"decouverte": "Un gibet bas, à hauteur d'homme. Le pendu qui s'y balance ouvre les yeux quand on approche : chaîne de fonction au cou, sceau au poing. Le Bailli des Landes — pendu le dernier, à la place d'honneur. Tout ce qui entre dans ses Landes passe en jugement.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_pendu_qui_parle_a.png", "portrait_requis": false}, {"id": "fossoyeur_des_poteaux", "nom": "Le Fossoyeur des Poteaux", "note": null, "lieu_attache": "champ_des_fixes", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Entre les rangs du Champ, un vieil homme redresse les poteaux qui penchent, avec des gestes de jardinier. « Ils dorment mal quand ça penche. » Son carnet tient le plan des rangs — et une croix là où il ne faut jamais passer.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_fossoyeur_poteaux_a.png", "portrait_requis": false}, {"id": "petite_fixee", "nom": "La Petite Fixée", "note": null, "lieu_attache": "champ_des_fixes", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Au bout d'une corde trop courte, une petite fille pend sans se balancer. Les autres fixés regardent tous droit devant. Pas elle : elle vous suit des yeux.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_petite_fixee_c.png", "portrait_requis": false}, {"id": "fille", "nom": "La Fille", "note": "la fille du Bailli — la seule pendue qui se soit relevée ; elle erre encore", "lieu_attache": "moulin_sans_ailes", "histoire_bailli": true, "rarete": "rare", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": null, "portrait_requis": false}, {"id": "veuve_aux_cordes", "nom": "La Veuve aux Cordes", "note": null, "lieu_attache": "chapelle_des_cordes", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Une femme en noir, au pied du mur de la chapelle, qui refait sans fin le même nœud. Le nœud qu'elle apprend n'attache rien — il retient quelqu'un de partir dans sa tête.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_veuve_cordes_a.png", "portrait_requis": false}, {"id": "deserteur_du_tribunal", "nom": "Le Déserteur du Tribunal", "note": null, "lieu_attache": "petit_tribunal", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": null, "portrait_requis": false}, {"id": "ecrivain_public", "nom": "L'Écrivain public", "note": null, "lieu_attache": "petit_tribunal", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Un petit homme sec, plume en main, qui copie le Registre des Pendaisons sans lever les yeux. Il désigne le Registre du bout de sa plume : votre page est prête.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_ecrivain_public_d.png", "portrait_requis": false}, {"id": "colporteur", "nom": "Le Colporteur", "note": "PNJ récurrent transverse — se souvient des runs précédentes, troc par souvenirs et Jours", "lieu_attache": "marche_muet", "histoire_bailli": false, "rarete": "commune", "recurrent": true, "textes": {"decouverte": "Au bout du Marché Muet, un étal différent : bric-à-brac d'ailleurs, objets qui n'ont rien à faire dans une lande. Le Colporteur vous regarde venir de loin — et vous reconnaît. C'est impossible. Il vous fait signe quand même.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_colporteur_b.png", "portrait_requis": false}, {"id": "rebouteux", "nom": "Le Rebouteux", "note": null, "lieu_attache": "marche_muet", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Des mains dures et savantes, qui palpent une blessure comme on lit une lettre. Il remet en place ce qui peut l'être, refuse ce qui le dépasse — et ce qu'il sent parfois sous la peau, il ne le soigne pas. Il le salue.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_rebouteux_a.png", "portrait_requis": false}, {"id": "doyenne", "nom": "La Doyenne", "note": null, "lieu_attache": "hameau_des_renoncants", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Sur le seuil du premier muret, une vieille femme barre le passage, paumes ouvertes — pas en accueil. En douane. C'est elle qui exige le Serment, et le hameau entier attend derrière elle, aux fenêtres sans lumière.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_doyenne_b.png", "portrait_requis": false}, {"id": "femme_au_seuil", "nom": "La Femme au Seuil", "note": null, "lieu_attache": "hameau_des_renoncants", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_femme_au_seuil_b.png", "portrait_requis": false}, {"id": "gamin_des_murets", "nom": "Le Gamin des Murets", "note": null, "lieu_attache": "hameau_des_renoncants", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": null, "portrait_requis": false}, {"id": "sonneur_sans_cloche", "nom": "Le Sonneur sans Cloche", "note": null, "lieu_attache": "hameau_des_renoncants", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_sonneur_sans_cloche_d.png", "portrait_requis": false}, {"id": "epoux_du_verger", "nom": "Les Époux du Verger", "note": null, "lieu_attache": "verger_noir", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_epoux_verger_a.png", "portrait_requis": false}, {"id": "marcheur_a_rebours", "nom": "Le Marcheur à rebours", "note": null, "lieu_attache": "chemin_creux", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Il vient en sens inverse — à reculons. Il marche vite, sûr de ses pas, les yeux fixés sur ce qu'il fuit. Il ne s'arrête pour personne, mais il parle en passant : « Ça suit ceux qui suivent le chemin. »", "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_marcheur_a_rebours_d.png", "portrait_requis": false}, {"id": "hesitant", "nom": "L'Hésitant", "note": "avant l'Appelé — il entend la voix et lutte encore", "lieu_attache": "borne_frontiere", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_hesitant_b.png", "portrait_requis": false}, {"id": "veilleur_de_la_palissade", "nom": "Le Veilleur de la Palissade", "note": null, "lieu_attache": "palissade_sud", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Sur le chemin de ronde, un vieux soldat regarde vers le sud. Trente ans qu'il guette une relève qui ne vient pas. « On ne rattrape pas les Appelés. On les compte. »", "familiarite": null, "recontextualisation": null}, "illustration": null, "portrait_requis": false}], "creatures": [{"id": "juge_de_cendre", "nom": "Le Juge de Cendre", "note": null, "lieu_attache": "colline_aux_gibets", "histoire_bailli": false, "rarete": "evenement", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_juge_de_cendre_c.png", "portrait_requis": true}, {"id": "fiancee_du_gibet", "nom": "La Fiancée du Gibet", "note": null, "lieu_attache": "colline_aux_gibets", "histoire_bailli": false, "rarete": "evenement", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_fiancee_du_gibet_b.png", "portrait_requis": true}, {"id": "ombre_du_grand_gibet", "nom": "L'Ombre du Grand Gibet", "note": "phénomène — l'ombre du Gibet Vide, sans corps pour la porter", "lieu_attache": "colline_aux_gibets", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "L'ombre du Gibet Vide s'étale au sol sans que rien ne la porte. Le gibet est vide ; son ombre, non.", "familiarite": null, "recontextualisation": null}, "illustration": null, "portrait_requis": false}, {"id": "corbeaux_du_compte", "nom": "Les Corbeaux du Compte", "note": "nuée — ils comptent, comme le Registre", "lieu_attache": "colline_aux_gibets", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Sur les potences de la colline, des corbeaux. Ils ne crient pas. Ils comptent — à l'arrivée d'un vivant, toutes les têtes se tournent d'un cran. Quarante-neuf perchoirs occupés. Le cinquantième est vide, juste au-dessus du Gibet Vide.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_corbeaux_du_compte_b.png", "portrait_requis": false}, {"id": "pendu_mal_fixe", "nom": "Le Pendu Mal Fixé", "note": null, "lieu_attache": "champ_des_fixes", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Un poteau casse, et le pendu qui le quittait touche terre sur ses pieds, corde encore nouée au cou. Une Fixation ratée : ni mort ni tenu. Ce qui reste de son visage n'exprime qu'une envie — échanger sa place.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_pendu_mal_fixe_a.png", "portrait_requis": true}, {"id": "corde_vive", "nom": "La Corde Vive", "note": null, "lieu_attache": "chapelle_des_cordes", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Dans la Chapelle des Cordes, certaines reliques bougent doucement, sans courant d'air. L'une d'elles ne fait pas que bouger : elle se tend vers ce qui passe. La Fixation est un métier de patience.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_corde_vive_c.png", "portrait_requis": false}, {"id": "chien_du_bailli", "nom": "Le Chien du Bailli", "note": null, "lieu_attache": "maison_du_bailli", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Il se lève du seuil sans aboyer. Gris, trop grand, le poil usé aux endroits d'un harnais qu'il ne porte plus. Son maître pend à la colline — mais l'ordre, lui, n'a jamais été levé. Personne n'entre.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_chien_du_bailli_b.png", "portrait_requis": true}, {"id": "mains_du_puits", "nom": "Les Mains du Puits", "note": "surgissement local — jamais un corps entier", "lieu_attache": "puits_condamne", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Des mains passent entre les planches du puits. Des mains seulement : grises, patientes, par dizaines, qui palpent l'air et les chaînes. Jamais un corps. Elles ne sortent pas — elles cherchent quelque chose à faire entrer.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_mains_du_puits_a.png", "portrait_requis": false}, {"id": "bete_des_chemins_creux", "nom": "La Bête des Chemins Creux", "note": null, "lieu_attache": "chemin_creux", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "L'odeur arrive avant la chose : suint, terre retournée, vieux cuir. Une masse longue et basse, taillée pour courir exactement entre deux murs de terre. Elle ne chasse que dans le creux — c'est son couloir, son terrier, sa table. Et elle ne monte jamais sur les talus.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_bete_chemins_creux_a.png", "portrait_requis": true}, {"id": "meute_grise", "nom": "La Meute Grise", "note": "errante — chip isolée dans la lande, sans lieu", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "On ne les voit que quand l'encerclement est fini. Six silhouettes couleur de bruyère morte, immobiles aux six points d'un cercle qui se resserre d'un pas par tour. Pas des chiens : trop patients. Pas des loups : trop organisés. La Meute Grise ne tue presque jamais. Elle évalue.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_meute_grise_c.png", "portrait_requis": true}, {"id": "recousu", "nom": "Le Recousu", "note": "errant — chip isolée dans la lande, sans lieu", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_recousu_c.png", "portrait_requis": true}, {"id": "epouvantail_tourne", "nom": "L'Épouvantail Tourné", "note": "phénomène — il ne bouge jamais, mais il s'est tourné", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": null, "portrait_requis": false}, {"id": "voix_basses", "nom": "Les Voix Basses", "note": "phénomène (marqué tel quel sur la carte)", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Sous le vent, des voix — basses, à ras de bruyère, qui se passent le mot des arrivées. Elles ne menacent pas. Elles préviennent quelqu'un.", "familiarite": null, "recontextualisation": null}, "illustration": null, "portrait_requis": false}, {"id": "troupeau_sans_berger", "nom": "Le Troupeau sans Berger", "note": "phénomène d'ambiance — il paît encore, personne ne le mène", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": "assets/monstre_troupeau_sans_berger_a.png", "portrait_requis": false}, {"id": "appele", "nom": "L'Appelé", "note": "vers le sud — un Renonçant repris qui descend, toujours vu de dos", "lieu_attache": "palissade_sud", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Un homme descend le chemin de la Descente d'un pas égal, sans bagage, sans se retourner. Le pas de quelqu'un qui n'obéit pas à ses jambes. Juste avant le tournant, il s'arrête une seconde — comme si, tout au fond, quelque chose en lui se débattait encore. Toujours vu de dos.", "familiarite": null, "recontextualisation": null}, "illustration": null, "portrait_requis": false}], "objets": [{"id": "echarde_du_grand_gibet", "nom": "L'Écharde du Grand Gibet", "note": null, "lieu_attache": "colline_aux_gibets", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Une écharde longue, prélevée au montant du Gibet Vide. Le bois est doux, poli par des mains — combien de mains ? Elle reste tiède dans la paume.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/objet_echarde_grand_gibet_b.png", "portrait_requis": false}, {"id": "carnet_du_fossoyeur", "nom": "Le Carnet du Fossoyeur", "note": null, "lieu_attache": "champ_des_fixes", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Le plan des rangs du Champ des Fixés, tenu au crayon gras par le Fossoyeur. Des annotations sur le sommeil de chacun — et une croix, quelque part, là où il ne faut jamais passer.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/objet_carnet_fossoyeur_d.png", "portrait_requis": false}, {"id": "jouet_de_la_petite_fixee", "nom": "Le Jouet de la Petite Fixée", "note": null, "lieu_attache": "champ_des_fixes", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Un petit cheval de bois, usé au poli, à demi enterré au pied d'un poteau du troisième rang. Elle ne peut pas le montrer autrement qu'en le regardant.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/objet_jouet_petite_fixee_a.png", "portrait_requis": false}, {"id": "miroir_de_poche_fele", "nom": "Le Miroir de Poche Fêlé", "note": null, "lieu_attache": "mare_aux_regards", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": "assets/objet_miroir_poche_fele_c.png", "portrait_requis": false}, {"id": "brin_de_chanvre_beni", "nom": "Le Brin de Chanvre Béni", "note": null, "lieu_attache": "chapelle_des_cordes", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": "assets/objet_brin_chanvre_beni_b.png", "portrait_requis": false}, {"id": "corde_coupee_de_la_fille", "nom": "La Corde Coupée de la Fille", "note": "la corde qui n'a pas fixé la seule pendue relevée", "lieu_attache": "chapelle_des_cordes", "histoire_bailli": true, "rarete": "commune", "textes": {"decouverte": "Dans une niche à part de la chapelle, sous verre : une corde coupée net, sans nom. La seule de toutes les reliques qui n'a pas tenu. Elle ne pèse rien — tout ce qu'elle devait retenir s'est relevé et marche encore.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/objet_corde_coupee_fille_a.png", "portrait_requis": false}, {"id": "sceau_du_bailli", "nom": "Le Sceau du Bailli", "note": "le motif caché de la zone, en objet", "lieu_attache": "maison_du_bailli", "histoi tion": "assets/objet_battant_cloche_c.png", "portrait_requis": false}, {"id": "fruit_de_cendre", "nom": "Le Fruit de Cendre", "note": null, "lieu_attache": "verger_noir", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": "assets/objet_fruit_cendre_a.png", "portrait_requis": false}, {"id": "dent_de_la_meute", "nom": "La Dent de la Meute", "note": "liée à la Meute Grise (errante) — pas de lieu", "lieu_attache": null, "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": "assets/objet_dent_meute_d.png", "portrait_requis": false}, {"id": "grelot_du_charretier", "nom": "Le Grelot du Charretier", "note": null, "lieu_attache": "chemin_creux", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Un grelot de charretier, à terre dans le Chemin Creux. Sans charrette nulle part. Il lui arrive de sonner tout seul — trois coups clairs, comme un signal convenu.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/objet_grelot_charretier_a.png", "portrait_requis": false}, {"id": "offrandes_de_la_borne", "nom": "Les Offrandes de la Borne", "note": null, "lieu_attache": "borne_frontiere", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Bouts de pain durci, rubans, clous tordus, mèches de cheveux, empilés contre la pierre de la borne. On n'offre pas par foi, ici. On offre par peur.", "familiarite": null, "recontextualisation": null}, "illustration": "assets/objet_offrandes_borne_c.png", "portrait_requis": false}, {"id": "pierre_de_retour", "nom": "La Pierre de Retour", "note": null, "lieu_attache": "borne_frontiere", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": "Une pierre plate gravée d'un pas, enfouie sous les offrandes de la borne. Ceux qui la déposent reviennent, dit-on. Celle-ci n'a jamais été réclamée.", "familiarite": null, "recontextualisation": null}, "illustration": null, "portrait_requis": false}, {"id": "lanterne_du_veilleur", "nom": "La Lanterne du Veilleur", "note": null, "lieu_attache": "palissade_sud", "histoire_bailli": false, "rarete": "commune", "textes": {"decouverte": null, "familiarite": null, "recontextualisation": null}, "illustration": "assets/objet_lanterne_rouillee.png", "portrait_requis": false}], "scenes": [{"id": "borne-frontiere", "type": "arrivee", "nom": "La Borne Frontière", "lieu": "borne_frontiere", "parent": null, "mene_a": [], "texte": ["La lande s'ouvre sous un crépuscule qui ne tombe pas. La lumière reste prise entre chien et loup, comme un souffle retenu. Quelque part, une corde grince.", "La pierre est seule au milieu du plateau, dressée là où tous les murets renoncent. Haute comme un homme, grise comme le reste — et pourtant l'œil ne voit qu'elle. À son pied, un tas d'offrandes. Au-delà, le sud, nu. Et à trois pas de la borne, un homme immobile, face au sud."], "description": "Entrée de zone, tout premier écran du jeu. La borne-frontière dressée seule sur le plateau, ses faces gravées, les offrandes à son pied, et le chemin qui s'enfonce au sud dans le noir.", "prompt_image": "single tall standing stone in the middle of an empty moor plateau, carved marks on its faces, small pile of humble offerings at its base, path vanishing south into darkness, dark fantasy vintage engraving style, grainy etching texture, very high contrast, dark vignette edges, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere", "illustration": "scene_borne_frontiere_a_c.png"}, {"id": "gravures-borne", "type": "observe", "nom": "Les gravures de la pierre", "lieu": "borne_frontiere", "parent": "borne-frontiere", "mene_a": [], "texte": ["Tu fais le tour de la pierre lentement, la main à plat sur le granit. Il est froid d'une froideur qui ne vient pas du vent."], "description": null, "prompt_image": "weathered granite boundary stone surface covered in shallow crowded carvings, names scratched over older names, a flat human hand resting against the stone. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_borne_gravures_a_d.png"}, {"id": "eclat-descelle", "type": "observe", "nom": "Un angle cassé, au ras du sol", "lieu": "borne_frontiere", "parent": "borne-frontiere", "mene_a": [], "texte": ["Un angle de la borne manque. Tu t'accroupis : la cassure est nette, faite au burin, patiemment. Quelqu'un a voulu emporter un morceau de la limite avec lui."], "description": null, "prompt_image": "broken-off corner of a granite boundary stone at ground level, the fracture clean and chisel-cut, the raw pale inner stone against the weathered outer face. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_borne_eclat_a_b.png"}, {"id": "homme-immobile", "type": "observe", "nom": "L'homme qui regarde le sud", "lieu": "borne_frontiere", "parent": "borne-frontiere", "mene_a": ["hesitant-1"], "texte": ["Tu quittes la borne et tu marches vers lui, sans te presser, en faisant sonner tes pas — on n'arrive pas dans le dos de quelqu'un, ici."], "description": null, "prompt_image": "man standing alone facing south on open moor, back to the viewer, not turning round though he has heard the footsteps. pitch-black background, subject emerging from darkness, one single light source, this is the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_hesitant_b.png"}, {"id": "hesitant-1", "type": "moment", "nom": "L'Hésitant", "lieu": "borne_frontiere", "parent": null, "mene_a": ["hesitant-2"], "texte": ["Il ne se retourne pas. Il t'a entendu, pourtant — ses épaules l'ont dit.", "— « Tu l'entends fort, toi ? » Sa voix est calme, épuisée d'être calme. « Moi, c'est encore bas. Comme des gens qui parlent dans la maison d'à côté. On comprend pas les mots. On comprend juste... qu'on parle de nous. »"], "description": "Un homme immobile face au sud, dos au hameau, planté depuis si longtemps que l'herbe s'est couchée sous lui. La borne dressée à côté de lui.", "prompt_image": "man standing alone facing south on open moor, back to the viewer, not turning round though he has heard the footsteps. pitch-black background, subject emerging from darkness, one single light source, this is the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_hesitant_b.png"}, {"id": "hesitant-2", "type": "moment", "nom": "L'Hésitant — beat 2", "lieu": "borne_frontiere", "parent": null, "mene_a": ["hesitant-3"], "texte": ["— « Je calcule. » Il montre la borne du menton, sans la regarder. « Si je rentre, ils me liront sur la figure et je finirai au bout d'une corde qui ne retient rien. Si je passe la pierre, je finis comme ceux qui passent la pierre. »", "Un temps. « Tu descends. Tu vas voir ce qu'on devient. Alors dis-moi ce que tu choisirais. »"], "description": "Il parle enfin : tourné de trois-quarts, il désigne la borne du menton sans la regarder. CHANGE : il n'est plus figé face au sud — tête tournée, menton qui pointe la pierre.", "prompt_image": "a man's chin lifted toward a boundary stone he refuses to look at, seen from the side, cropped at the jaw. tight crop on the gesture only — hands, arms, or the back of the figure — the head out of frame, the face never visible, so nothing has to match another image, one single light source raking across the gesture, everything behind it falling away to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_hesitant_b.png"}, {"id": "hesitant-3", "type": "moment", "nom": "L'Hésitant — beat 3", "lieu": "borne_frontiere", "parent": null, "mene_a": [], "texte": ["Il te laisse partir le premier. C'est important pour lui : que tu ne le voies pas décider.", "Au bout de vingt pas tu te retournes quand même. La borne est seule au milieu du plateau. Il n'y a plus personne à côté — et rien, sur la bruyère couchée, ne dit dans quel sens il est parti."], "description": "La borne seule au milieu du plateau, la bruyère couchée à son pied, et rien qui dise dans quel sens il est parti. CHANGE : l'homme a DISPARU du cadre — même pierre, vide.", "prompt_image": "a boundary stone standing alone in the middle of an empty plateau, nobody beside it, the moor running flat to the horizon. wide shot, the subject small in the frame, seen from a distance, extreme backlight, one single light source, near-black silhouettes against a glowing orange sky, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_hesitant_b.png"}, {"id": "chemin-creux", "type": "arrivee", "nom": "Le Chemin Creux", "lieu": "chemin_creux", "parent": null, "mene_a": ["chemin-creux-2"], "texte": ["Le chemin s'enfonce entre deux talus plus hauts que toi ; le ciel devient un ruban. C'est le plus court chemin des Landes, et le seul où l'on ne voit pas venir.", "Une charrette penche au premier coude. Les talus, au-dessus, sont meubles. Plus loin, le chemin tourne et la terre mange la vue. Et dans le creux, quelqu'un vient vers toi — de dos."], "description": "Arrivée au Chemin Creux. Une route encaissée entre deux hauts talus de terre, un ruban de ciel étroit au-dessus, des racines tordues qui sortent des parois.", "prompt_image": "sunken road between two high earthen banks, narrow ribbon of sky above, twisted roots protruding from the banks, deep shadows, dark fantasy vintage engraving style, grainy etching texture, very high contrast, dark vignette edges, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere", "illustration": "scene_chemin_creux_c.png"}, {"id": "charrette-embourbee", "type": "observe", "nom": "La charrette embourbée", "lieu": "chemin_creux", "parent": "chemin-creux", "mene_a": [], "texte": ["Elle penche dans l'ornière depuis si longtemps que le bois a pris racine — des pousses sortent du moyeu. Tu contournes, la main sur le ridelle."], "description": null, "prompt_image": "wheel hub and axle of a cart long sunk in a rut, green shoots growing out of the wood of the hub, the side rail worn smooth by hands. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_chemin_charrette_a_c.png"}, {"id": "talus-empreintes", "type": "observe", "nom": "Le haut des talus", "lieu": "chemin_creux", "parent": "chemin-creux", "mene_a": [], "texte": ["Tu montes de trois pas dans la pente, juste assez pour voir la crête sans t'exposer entièrement. La terre y est meuble, retournée."], "description": null, "prompt_image": "loose turned earth on a steep bank, a line of bare footprints pressed into it going the wrong way, grass torn at the edges. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_chemin_talus_a_c.png"}, {"id": "marcheur-rebours", "type": "observe", "nom": "L'homme qui marche à reculons", "lieu": "chemin_creux", "parent": "chemin-creux", "mene_a": ["marcheur-1"], "texte": ["Tu ralentis pour le laisser venir. Il marche à reculons d'un pas sûr, les talons trouvant le sol comme des yeux."], "description": null, "prompt_image": "man walking backwards along a sunken lane with a sure step, heels finding the ground like eyes, body turned away from his direction of travel. pitch-black background, subject emerging from darkness, one single light source, this is the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_marcheur_a_rebours_d.png"}, {"id": "chemin-creux-2", "type": "moment", "nom": "Le Chemin Creux — beat 2", "lieu": "chemin_creux", "parent": null, "mene_a": [], "texte": ["Le chemin tourne, et le talus mange la vue d'un coup. Passé le coude : rien. C'est-à-dire l'endroit exact où il devrait y avoir quelque chose, et il n'y a rien.", "Le silence y est plus épais d'un cran, comme après un bruit que tu aurais raté d'une seconde."], "description": "Événement du Chemin Creux : le coude aveugle. Le talus mange la vue d'un coup — l'endroit exact où il devrait y avoir quelque chose, et où il n'y a rien.", "prompt_image": "blind bend of a sunken road between high earthen banks, the path disappearing around the curve, nothing visible beyond, very deep shadow at the turn, dark fantasy vintage engraving style, grainy etching texture, very high contrast, dark vignette edges, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere", "illustration": "scene_chemin_creux_c.png"}, {"id": "marcheur-1", "type": "moment", "nom": "Marcheur 1", "lieu": "chemin_creux", "parent": null, "mene_a": ["marcheur-2"], "texte": ["Il ne s'arrête pas à ta hauteur. Il ralentit, c'est tout — et te parle en te dépassant, le regard toujours fixé sur le chemin derrière toi.", "— « Marche pas côté nord du creux. » Pas de bonjour. Ici, les conseils sont les politesses. « Elle longe la crête nord. Toujours. Les empreintes du sud, c'est les vieilles. »"], "description": "Le Marcheur à rebours avance en marche arrière dans le chemin creux, le regard fixé derrière lui : trente ans qu'il ne montre son dos à rien.", "prompt_image": "man walking backwards along a sunken lane with a sure step, heels finding the ground like eyes, body turned away from his direction of travel. pitch-black background, subject emerging from darkness, one single light source, this is the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_marcheur_a_rebours_d.png"}, {"id": "marcheur-2", "type": "moment", "nom": "Marcheur 2 — beat 2", "lieu": "chemin_creux", "parent": null, "mene_a": ["marcheur-3"], "texte": ["— « Tu veux traverser entier ? » Il est déjà trois pas plus loin. « Alors fais comme moi jusqu'au coude. Après le coude, elle suit plus. Personne sait pourquoi. On va pas lui demander. »"], "description": "Il s'éloigne à reculons, déjà trois pas plus loin, et te parle par-dessus son épaule ; les talus se resserrent. CHANGE : il n'est plus devant toi, il recule dans la profondeur du chemin.", "prompt_image": "a pair of heels finding the ground behind their owner, boots walking backwards along a sunken lane, legs only. tight crop on the gesture only — hands, arms, or the back of the figure — the head out of frame, the face never visible, so nothing has to match another image, one single light source raking across the gesture, everything behind it falling away to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_marcheur_a_rebours_d.png"}, {"id": "marcheur-3", "type": "moment", "nom": "Marcheur 3 — beat 3", "lieu": "chemin_creux", "parent": null, "mene_a": ["chemin-creux-2"], "texte": ["Au coude, il pivote enfin — face au nord, dos au sud — et s'éloigne à reculons vers là d'où tu viens.", "Juste avant que le talus ne le mange, il lève deux doigts vers toi. Pas un adieu. Un décompte : deux yeux. Il te rappelle d'en garder autant derrière la tête."], "description": "Au coude du chemin il pivote face au nord et lève deux doigts vers toi, juste avant que le talus ne l'avale. CHANGE : vu de dos, et le geste des deux doigts levés.", "prompt_image": "two fingers raised toward the viewer at the mouth of a sunken lane, the arm half swallowed by the earth bank, a count rather than a farewell. tight crop on the gesture only — hands, arms, or the back of the figure — the head out of frame, the face never visible, so nothing has to match another image, one single light source raking across the gesture, everything behind it falling away to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_marcheur_a_rebours_d.png"}, {"id": "bete-chemins-creux", "type": "arrivee", "nom": "Bete chemins creux", "lieu": "chemin_creux", "parent": null, "mene_a": [], "texte": ["Le creux tourne — et l'odeur arrive avant la chose : suint, terre retournée, vieux cuir. Une masse se décolle du talus, longue, basse, taillée pour courir exactement entre deux murs de terre.", "Pas de gueule visible. Juste une avancée du corps qui s'ouvre. La Bête ne chasse que dans le creux — c'est son couloir, son terrier, sa table. Et tu es dessus."], "description": "Combat, une scène. La Bête des Chemins Creux, qui longe la crête nord au même pas que ce qui marche en bas. On ne la voit qu'en silhouette, au-dessus.", "prompt_image": "long low beast built to run between two earth walls, no visible jaw, only a forward mass of matted hide, half detached from the bank of a sunken lane. pitch-black background, subject emerging from darkness, one single light source, this is the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_bete_chemins_creux_a.png"}, {"id": "colline-aux-gibets", "type": "arrivee", "nom": "La Colline aux Gibets", "lieu": "colline_aux_gibets", "parent": null, "mene_a": ["colline-aux-gibets-2"], "texte": ["La pente est douce et n'en finit pas — la Colline se mérite à pas comptés. Au sommet, le cercle : neuf potences ordinaires, plantées comme les heures d'un cadran. Et au centre, l'autre. La grande. Sa corde est la seule chose neuve à dix lieues.", "À gauche du cercle, un poteau isolé porte encore son occupant. À droite, les potences vides alignent leurs noms gravés."], "description": "Arrivée à la Colline aux Gibets, lieu-signature de la zone. Le cercle de potences sur la crête nue, vu d'en bas en contre-plongée, les cordes qui balancent.", "prompt_image": "circle of nine wooden gallows on a bare hilltop seen from below, low angle, ropes swaying, crows on the crossbeams, stormy sky, dark fantasy vintage engraving style, grainy etching texture, very high contrast, dark vignette edges, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere", "illustration": "scene_colline_aux_gibets_c.png"}, {"id": "corbeaux-compte", "type": "observe", "nom": "Les corbeaux, sur la traverse", "lieu": "colline_aux_gibets", "parent": "colline-aux-gibets", "mene_a": [], "texte": ["Ils sont sur la traverse du grand gibet, immobiles, et ils ne bougent pas quand tu approches — ce qui n'est pas un comportement d'oiseau. Aucun ne te regarde. Ils regardent la corde."], "description": null, "prompt_image": "row of crows perched shoulder to shoulder along a gallows crossbeam, none of them looking at the viewer, all of them looking down at the rope. pitch-black background, subject emerging from darkness, one single light source, this is the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_corbeaux_du_compte_b.png"}, {"id": "potences-cercle", "type": "observe", "nom": "Les pote are composition, no text, no lettering, no watermark", "illustration": "monstre_pendu_qui_parle_a.png"}, {"id": "champ-des-fixes", "type": "arrivee", "nom": "Le Champ des Fixés", "lieu": "champ_des_fixes", "parent": null, "mene_a": ["champ-des-fixes-2"], "texte": ["Pas de tombes — des poteaux. Des rangées de poteaux plantés droit, un nom sur chaque, alignés face au nord. Dos au sud. Même morts, surtout morts, on ne les laisse pas regarder par là.", "Au fond, des poteaux vierges attendent, déjà plantés. Près de l'entrée, la cabane du Fossoyeur."], "description": "Arrivée au Champ des Fixés. Des rangées de poteaux plantés dans la lande morte, un écriteau clouté sur chacun, certains encore occupés.", "prompt_image": "rows of wooden posts planted across dead moorland, a small nailed sign on each, some posts still bearing hanged figures in the far distance, receding perspective, dark fantasy vintage engraving style, grainy etching texture, very high contrast, dark vignette edges, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere", "illustration": "scene_champ_des_fixes_b.png"}, {"id": "les-rangees", "type": "observe", "nom": "Les rangées et leurs noms", "lieu": "champ_des_fixes", "parent": "champ-des-fixes", "mene_a": [], "texte": ["Tu marches entre deux rangs. Le sol est tassé par des allées et venues régulières — on entretient ce champ comme un jardin, et c'est ça qui serre le ventre."], "description": null, "prompt_image": "packed earth path between two rows of stakes, the ground trodden smooth by regular tending, the foot of a stake and its bindings close in the frame. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim ition, no text, no lettering, no watermark", "illustration": "scene_champ_tombe_manquante_a_c.png"}, {"id": "champ-des-fixes-2", "type": "moment", "nom": "Le Champ des Fixés — beat 2", "lieu": "champ_des_fixes", "parent": null, "mene_a": [], "texte": ["Entre les rangs, un vieil homme redresse un poteau qui penche, avec des gestes de jardinier. Il t'a vu venir de loin — les vivants font un bruit particulier, ici. Il ne s'interrompt pas : il t'attend au travail, comme on attend un outil."], "description": "Événement du Champ : le Fossoyeur aux poteaux, qui grave d'avance les noms « dont c'est sûr ».", "prompt_image": "old gravedigger straightening a leaning stake with a gardener's care, not interrupting his work, a mallet hanging from his hand. pitch-black background, subject emerging from darkness, one single light source, this is the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_fossoyeur_poteaux_a.png"}, {"id": "pendu-mal-fixe", "type": "arrivee", "nom": "Le Pendu Mal Fixé", "lieu": "champ_des_fixes", "parent": null, "mene_a": [], "texte": ["Un craquement sec dans les rangs — un poteau vient de casser. Le pendu qui le quittait touche terre sur ses pieds, comme s'il n'attendait que ça depuis des années. Sa corde traîne derrière lui, encore nouée au cou.", "Il avance par à-coups, tiré par des ficelles que personne ne tient. Une Fixation ratée : ni mort ni tenu. Ce qui reste de son visage n'exprime qu'une chose — l'envie féroce d'échanger sa place. Contre la tienne."], "description": "Combat, une scène. Le Pendu Mal Fixé : un bras tendu figé en plein geste d'agrippement, la corde trop longue qui laisse les pieds toucher le sol.", "prompt_image": "hanged man standing upright on his own feet, his rope still knotted at his neck and tr
