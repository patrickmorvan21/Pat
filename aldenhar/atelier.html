s the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_femme_au_seuil_b.png"}, {"id": "femme-seuil-1", "type": "moment", "nom": "Femme seuil 1", "lieu": "hameau_des_renoncants", "parent": null, "mene_a": ["femme-seuil-2"], "texte": ["Quand tu arrives à sa hauteur, elle tressaille. Une seconde — moins — son visage s'ouvre, et tu vois ce qu'elle était avant : quelqu'un qui attendait quelqu'un.", "Puis ça se referme. « Non. Tu marches pas comme lui. »", "Elle resserre son châle. « Mon fils est parti par là. » Elle ne montre pas la direction — personne ici ne montre le sud avec la main. « Il entendait plus ce que je disais, à la fin. Il entendait autre chose. »"], "description": "Une femme sur le seuil d'une maison basse, châle serré, une croix à la craie sur sa porte. Elle regarde le sud.", "prompt_image": "woman standing motionless in a doorway, not taking the air but standing guard, arms at her sides. pitch-black background, subject emerging from darkness, one single light source, this is the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_femme_au_seuil_b.png"}, {"id": "femme-seuil-2", "type": "moment", "nom": "Femme seuil 2 — beat 2", "lieu": "hameau_des_renoncants", "parent": null, "mene_a": ["femme-seuil-3"], "texte": ["« Tu descends, toi aussi. Ça se voit. Vous avez tous le même pas. » Elle fouille sous son châle et en tire quelque chose qu'elle tient serré.", "« Si tu le croises. S'il reste quelque chose à croiser. »", "Une mèche de cheveux, nouée d'un fil. « Tu lui donnes. Il saura. »"], "description": "Elle a sorti la main de sous son châle et tend une mèche de cheveux nouée d'un fil, bras à moitié tendu, sur le même seuil. CHANGE : le bras tendu et l'objet offert dans sa main.", "prompt_image": "a woman's hands drawing something small and closed out from under a shawl, held tight, offered without opening. tight crop on the gesture only — hands, arms, or the back of the figure — the head out of frame, the face never visible, so nothing has to match another image, one single light source raking across the gesture, everything behind it falling away to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_femme_au_seuil_b.png"}, {"id": "femme-seuil-3", "type": "moment", "nom": "Femme seuil 3 — beat 3", "lieu": "hameau_des_renoncants", "parent": null, "mene_a": ["hameau-entree-3"], "texte": ["Elle a déjà repris sa place sur le seuil quand tu repars. De la rue, on ne voit pas qu'elle a parlé à quelqu'un. On ne voit qu'une femme qui regarde le sud.", "Ce que tu emportes ne pèse rien. C'est la promesse qui pèse."], "description": "Elle a repris sa place sur le seuil, mains vides, et regarde le sud — de la rue, rien ne dit qu'elle a parlé à quelqu'un. CHANGE : de nouveau immobile et les mains vides.", "prompt_image": "a woman back in place on her doorstep at the end of a village street, seen from far down the road, looking south, nothing about her showing that she spoke to anyone. wide shot, the subject small in the frame, seen from a distance, extreme backlight, one single light source, near-black silhouettes against a glowing orange sky, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_femme_au_seuil_b.png"}, {"id": "hameau-entree-3", "type": "moment", "nom": "Hameau entree 3 — beat 3", "lieu": "hameau_des_renoncants", "parent": null, "mene_a": ["hameau-entree-4"], "texte": ["Ils sont trois à t'attendre au milieu de la rue. Pas armés — un bâton de marche, une fourche posée contre un mur, à portée sans être brandie.", "Celui du centre est vieux, sec comme un piquet. C'est lui qui parle, et sa voix ne tremble pas. Ses mains, si.", "— « On ne te chasse pas. » Il le dit d'abord, comme une formule apprise. « Personne n'est chassé, ici. Mais tu descends. Ça se voit à ton pas. Et ceux qui descendent... » Il ne finit pas. Derrière lui, une femme tire un enfant à l'intérieur, sans un mot."], "description": "Trois hommes en travers de la rue, pas armés : un bâton de marche à la main, une fourche posée contre le mur, à portée sans être brandie.", "prompt_image": "three villagers standing across a lane, unarmed — a walking staff, a pitchfork leaning on a wall within reach — the eldest at the centre doing the talking. pitch-black background, subject emerging from darkness, one single light source, this is the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_juge_de_cendre_c.png"}, {"id": "hameau-entree-4", "type": "arrivee", "nom": "Hameau entree 4 — beat 4", "lieu": "hameau_des_renoncants", "parent": null, "mene_a": ["hameau-entree-5"], "texte": ["Le vieux tend la main, paume ouverte. Pas pour serrer la tienne — pour que tu la regardes. Elle est vide. C'est le geste d'ici : on jure sur rien, parce qu'il ne reste rien.", "— « Trois choses, et tu dors sous un toit. Tu ne parles pas aux pendus. Tu ne regardes pas le sud plus qu'il ne faut. Et tu pars avant la troisième aube. »"], "description": "La paume ouverte et vide du vieux, tendue à hauteur de poitrine pour qu'on la regarde — on jure sur rien.", "prompt_image": "an old open palm held out flat and empty, offered to be looked at rather than shaken. tight crop on the gesture only — hands, arms, or the back of the figure — the head out of frame, the face never visible, so nothing has to match another image, one single light source raking across the gesture, everything behind it falling away to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_doyenne_b.png"}, {"id": "pourquoi-trois-aubes", "type": "observe", "nom": "Demander pourquoi trois aubes", "lieu": "hameau_des_renoncants", "parent": "hameau-entree-4", "mene_a": [], "texte": ["Tu ne réponds pas tout de suite. Tu poses la question, et le barrage entier attend sa réponse avec toi — comme si personne n'avait jamais osé la poser."], "description": null, "prompt_image": null, "illustration": null, "sans_image": true}, {"id": "hameau-entree-5", "type": "moment", "nom": "Hameau entree 5 — beat 5", "lieu": "hameau_des_renoncants", "parent": null, "mene_a": [], "texte": ["Ils s'écartent. Pas beaucoup — juste assez pour que tu passes sans toucher personne, et tu comprends que c'est calculé.", "La rue s'ouvre devant toi. Des volets se ferment à mesure, un par un, un peu en avance sur ton pas. Quelque part, une corde grince.", "Tu es entré. Personne ne t'a souhaité la bienvenue, et pourtant tous savaient déjà que tu venais."], "description": "La rue qui s'ouvre devant toi, et les volets qui se ferment un par un, un peu en avance sur ton pas.", "prompt_image": "narrow village lane of low stone houses, every shutter closed, no one in the street, chalk cross on the first door. wide shot, the subject small in the frame, seen from a distance, extreme backlight, one single light source, near-black silhouettes against a glowing orange sky, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_landes_hameau_ruelle_b.png"}, {"id": "hameau-halte-1", "type": "moment", "nom": "Hameau halte 1", "lieu": "hameau_des_renoncants", "parent": null, "mene_a": ["hameau-halte-2"], "texte": ["Le vieux te trouve avant que tu ne le cherches. C'est comme ça, ici : on sait toujours où tu es.", "— « Tu pars demain. » Ce n'est pas une question. « Personne ne marche vers le sud de nuit. Même toi. »", "Il ne t'invite pas chez lui. Personne n'invite personne. Il te mène à la grange, au bout de la rue — la seule porte du hameau qui n'a pas de marque à la craie. Pas encore."], "description": "Le vieux t'a trouvé dans la ruelle et se tient à deux pas, calme, sans barrer le passage.", "prompt_image": "narrow village lane of low stone houses, every shutter closed, no one in the street, chalk cross on the first door. wide shot, the subject small in the frame, seen from a distance, extreme backlight, one single light source, near-black silhouettes against a glowing orange sky, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_landes_hameau_ruelle_b.png"}, {"id": "hameau-halte-2", "type": "arrivee", "nom": "Hameau halte 2 — beat 2", "lieu": "hameau_des_renoncants", "parent": null, "mene_a": ["hameau-halte-3"], "texte": ["De la paille propre, une couverture qui a servi, une lampe qu'on te laisse — la mèche est courte, calculée pour s'éteindre seule.", "— « On te rouvre à l'aube. » Le vieux pose la main sur la porte. « C'est pas contre toi. »", "La porte se ferme. Puis le bruit que tu attendais sans le savoir : une barre qu'on pose. Dehors."], "description": "Intérieur de grange, la nuit : une lanterne posée au sol, la paille, la barre de porte posée DEHORS, des bâtons de comptage sur les poutres.", "prompt_image": "clean straw and a used blanket laid on a barn floor, a short-wicked lamp set down beside them, the barn door shut in the background. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_landes_hameau_grange_a.png"}, {"id": "examiner-grange", "type": "observe", "nom": "Examiner la grange", "lieu": "hameau_des_renoncants", "parent": "hameau-halte-2", "mene_a": [], "texte": ["Tu prends la lampe et tu fais le tour, lentement, en te tenant loin des murs — le vieux réflexe de qui ne veut pas être une silhouette derrière des planches."], "description": null, "prompt_image": "underside of barn roof beams seen by lamplight from below, rows of tally notches cut along one beam, the wood black with age. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_hameau_grange_poutres_a_d.png"}, {"id": "hameau-halte-3", "type": "moment", "nom": "Hameau halte 3 — beat 3", "lieu": "hameau_des_renoncants", "parent": null, "mene_a": ["hameau-halte-4"], "texte": ["Le hameau ne dort pas comme un village. Pas de rires, pas de disputes, pas d'enfant qui pleure. Juste des pas, parfois, qui font une ronde que personne n'a annoncée."], "description": "La grange dans le noir, vue depuis la paille : sous la porte fermée, une bande de lumière que des pieds coupent en passant. CHANGE : la lanterne est éteinte, il ne reste que la fente sous la porte.", "prompt_image": "clean straw and a used blanket laid on a barn floor, a short-wicked lamp set down beside them, the barn door shut in the background. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_landes_hameau_grange_a.png"}, {"id": "hameau-halte-4", "type": "moment", "nom": "Hameau halte 4 — beat 4", "lieu": "hameau_des_renoncants", "parent": null, "mene_a": ["hameau-halte-5"], "texte": ["La barre se soulève au premier gris. Le vieux, seul. Il te tend un quignon dur et ne dit rien pendant que tu manges.", "— « Aujourd'hui, on fixe personne. » Il regarde ailleurs. « Alors pars pendant que c'est vrai. »"], "description": "L'aube grise, la porte relevée : le vieux seul, un quignon de pain dur tendu vers toi, le regard ailleurs. CHANGE : lumière de petit matin, la barre est levée, il tend quelque chose.", "prompt_image": "an old open palm held out flat and empty, offered to be looked at rather than shaken. tight crop on the gesture only — hands, arms, or the back of the figure — the head out of frame, the face never visible, so nothing has to match another image, one single light source raking across the gesture, everything behind it falling away to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_doyenne_b.png"}, {"id": "hameau-halte-5", "type": "moment", "nom": "Hameau halte 5 — beat 5", "lieu": "hameau_des_renoncants", "parent": null, "mene_a": [], "texte": ["Ils sont deux à marcher avec toi jusqu'à la Palissade. Pas devant, pas derrière : à côté, à un pas de distance — l'escorte de quelqu'un qu'on ne touche pas.", "Au portillon sud, le plus jeune ouvre. Le vieux reste en arrière. C'est lui qui parle, pourtant, au moment où tu passes :", "— « Si tu l'entends... » Il cherche ses mots. Il les trouve : « Réponds pas. C'est tout ce qu'on sait. C'est tout ce qu'on a jamais su. »"], "description": "Le portillon sud, ouvert par le plus jeune. Les deux escortes marchent à un pas de distance de chaque côté ; le vieux reste en arrière. CHANGE : on est dehors, au portillon — plus dans la grange.", "prompt_image": "village seen from its southern gate at dawn, roofs packed low behind a stone wall, the gate standing open. wide shot, the subject small in the frame, seen from a distance, extreme backlight, one single light source, near-black silhouettes against a glowing orange sky, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_hameau_dense_b.png"}, {"id": "hameau-halte-dehors", "type": "arrivee", "nom": "Hameau halte dehors", "lieu": "hameau_des_renoncants", "parent": null, "mene_a": [], "texte": ["Aucune porte, aucune grange. Tu dors contre un muret, côté nord — d'instinct.", "La nuit des Landes n'attaque pas. Elle compte. Chaque heure a son bruit : la corde, les pas, le chant du sud. Au matin, tu n'es pas reposé — tu es inventorié."], "description": "Variante de Halte pour qui a refusé le Serment : la nuit dehors, contre un muret, aucune porte ouverte.", "prompt_image": "low stone field wall on open moor at night, a bedroll pressed against its north side, no shelter of any kind. wide shot, the subject small in the frame, seen from a distance, extreme backlight, one single light source, near-black silhouettes against a glowing orange sky, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_hameau_dense_c.png"}, {"id": "tour-de-guet", "type": "arrivee", "nom": "Tour de guet", "lieu": "tour_de_guet_effondree", "parent": null, "mene_a": ["tour-de-guet-2"], "texte": ["La tour n'a plus de sommet. Elle s'arrête net à mi-hauteur, sur une bouche de pierres arrachées, et le reste est en tas autour du pied — pas éboulé, EMPILÉ. Quelqu'un a rangé les décombres.", "L'escalier intérieur tient encore sur trois volées. Au-delà, il monte vers rien."], "description": "Arrivée à la Tour de Guet effondrée, à l'intérieur du hameau. Une tour tronquée net à mi-hauteur, ses pierres empilées en tas régulier au pied.", "prompt_image": "ruined stone watchtower cut off cleanly at mid-height, jagged open mouth of torn stone at the top, the missing upper stones STACKED in a neat man-high pile at its foot, low village roofs behind, dark fantasy vintage engraving style, grainy etching texture, very high contrast, dark vignette edges, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere", "illustration": "scene_tour_de_guet_a.png"}, {"id": "pierres-rangees", "type": "observe", "nom": "Les pierres, empilées au pied", "lieu": "tour_de_guet_effondree", "parent": "tour-de-guet", "mene_a": [], "texte": ["Tu fais le tour du tas. Il est haut comme un homme et régulier sur toute sa longueur — un travail de plusieurs jours, fait par quelqu'un qui n'était pas pressé."], "description": null, "prompt_image": "long neat stack of dressed stones at the foot of a tower, laid course by course, every carved face turned down against the earth, one stone tipped over to show a fragment of an engraved name. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": null}, {"id": "escalier-vers-rien", "type": "observe", "nom": "L'escalier qui monte au vide", "lieu": "tour_de_guet_effondree", "parent": "tour-de-guet", "mene_a": [], "texte": ["Les marches sont creusées en leur milieu, usées par des passages quotidiens. Tu montes les trois volées qui tiennent. La dernière s'arrête sur le ciel."], "description": null, "prompt_image": "last surviving step of a stone stair inside a broken tower, the tread hollowed in its middle by daily use, the stonework breaking off clean onto open sky. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": null}, {"id": "meurtriere-sud", "type": "observe", "nom": "La meurtrière du sud", "lieu": "tour_de_guet_effondree", "parent": "tour-de-guet", "mene_a": [], "texte": ["Une seule ouverture reste intacte, au sud, à hauteur de poitrine. Le rebord est poli comme une rampe."], "description": null, "prompt_image": "narrow arrow slit in thick stonework at chest height, its sill worn smooth like a handrail, hundreds of tally notches in groups of five cut into the embrasure, a single-lens copper spyglass wedged in a crack. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": null}, {"id": "tour-de-guet-2", "type": "moment", "nom": "Tour de guet 2 — beat 2", "lieu": "tour_de_guet_effondree", "parent": null, "mene_a": [], "texte": ["Il est assis sur le tas de pierres, dos à toi, et il regarde le sud par-dessus le hameau. Un vieux manteau de guet, la corne au côté. Il ne se retourne pas.", "— « Tu es monté. » Ce n'est pas une question. « Alors tu as vu ce qu'on surveillait. »"], "description": "Événement de la Tour : le Guetteur sans tour, assis de dos sur le tas de pierres, en manteau de guet, une corne au côté, il regarde le sud. CHANGE : c'est un portrait de l'homme, plus le plan large de la tour.", "prompt_image": "old watchman seen from behind, seated on a pile of stones, heavy worn sentry cloak, a signal horn hanging at his side, head turned to scan the horizon, never facing the viewer, pitch-black background, subject emerging from darkness, dark fantasy vintage engraving style, grainy etching texture, very high contrast, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere", "illustration": "scene_tour_de_guet_a.png"}, {"id": "marche-muet", "type": "arrivee", "nom": "Le Marché Muet", "lieu": "marche_muet", "parent": null, "mene_a": ["marche-muet-2"], "texte": ["Au cœur du hameau, un marché sans un cri. Des étals de trois fois n croix sur le corps de pierre, comme un moulin fantôme peint sur le vrai.", "La porte est entrouverte. Pas défoncée : entretenue. La croix d'ombres, en haut. La lucarne, qui te regarde. Et la porte, qui n'attend que toi."], "description": "Arrivée au Moulin sans Ailes — c'est le lieu de repos de la zone. Une tour de pierre trapue SANS ailes, quatre traces pâles sur le corps du moulin, la porte entrebâillée.", "prompt_image": "old stone windmill without sails on a moorland crest, four pale ghost marks of the missing sails on the stone body, door ajar, small attic window, dark fantasy vintage engraving style, grainy etching texture, very high contrast, dark vignette edges, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere", "illustration": "scene_moulin_sans_ailes_d_d.png"}, {"id": "croix-ombres", "type": "observe", "nom": "La croix d'ombres, en haut", "lieu": "moulin_sans_ailes", "parent": "campement", "mene_a": [], "texte": ["Tu recules jusqu'au muret d'en face. Il faut de la distance pour la voir entière — c'est une trace, pas un détail."], "description": null, "prompt_image": "squat round stone tower with no blades and no vanes, four pale unweathered bands radiating from its bare cap in the shape of a cross, seen from across a low wall. wide shot, the subject small in the frame, seen from a distance, extreme backlight, one single light source, near-black silhouettes against a glowing orange sky, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_moulin_croix_ombres_a_d.png"}, {"id": "lucarne-moulin", "type": "observe", "nom": "La lucarne, au-dessus de la porte", "lieu": "moulin_sans_ailes", "parent": "campement", "mene_a": [], "texte": ["Quelque chose a bougé là-haut — tu en jurerais. Tu approches sans quitter l'ouverture u Moulin : la garde, ou le sommeil. Le lit de bruyère tassé, refait de frais, les marques de comptage à hauteur d'enfant sur la pierre.", "prompt_image": "interior of a derelict stone windmill, heather bedding pressed flat on the floor, tally marks scratched on the stone wall at child height, broken millstone, light through a small attic window, dark fantasy vintage engraving style, grainy etching texture, very high contrast, pitch-black shadows, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere", "illustration": "scene_moulin_sans_ailes_d_d.png"}, {"id": "chapelle-des-cordes", "type": "arrivee", "nom": "La Chapelle des Cordes", "lieu": "chapelle_des_cordes", "parent": null, "mene_a": ["chapelle-des-cordes-2"], "texte": ["La chapelle est petite et n'a plus de dieu — les niches sont vides, l'autel renversé. Mais elle est TENUE : balayée, entretenue, occupée par sa nouvelle religion.", "Au fond, le mur des cordes. Sur le côté, l'autel couché. Près de l'entrée, une chaise et un ouvrage de tressage — quelqu'un vit ici."], "description": "Arrivée à la Chapelle des Cordes, intérieur du hameau. Une nef courte, des dizaines de cordes coupées clouées en rangs le long des murs, du sol au plafond.", "prompt_image": "interior of a tiny stone chapel, dozens of cut ropes nailed in rows along the walls from floor to ceiling, small paper labels on each, overturned altar, short nave, dark fantasy vintage engraving style, grainy etching texture, very high contrast, pitch-black shadows, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere", "illustration": "scene_chapelle_des_cordes_d.png"}, {"id": "mur-cordes", "type": "observe", "nom": "Le mur des cordes, au fond", "lieu": "chapelle_des_cordes", "parent": "chapelle-des-cordes", "mene_a": [], "texte": ["Tu remontes la nef courte. L'odeur de chanvre vieux prend à la gorge à mesure — une odeur grasse, presque animale, qui n'a rien d'une odeur d'é cription": null, "prompt_image": "a chair turned to face a wall, a half-plaited rope laid across its seat with the work stopped mid-braid. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_chapelle_ouvrage_a_d.png"}, {"id": "chapelle-des-cordes-2", "type": "moment", "nom": "La Chapelle des Cordes — beat 2", "lieu": "chapelle_des_cordes", "parent": null, "mene_a": [], "texte": ["Elle était là depuis le début. Une femme en noir, assise à la chaise, qui refait sans fin le même nœud sans lever les yeux sur toi.", "— « Choisis ton brin. » Sa voix est plate, professionnelle. « Tout le monde finit par en avoir besoin. » Derrière elle, dans une niche à part, sous verre : une corde coupée net, sans nom. La seule de toute la chapelle qui n'a pas tenu."], "description": "Événement de la Chapelle : la Veuve aux Cordes, assise, qui refait sans fin le même nœud. Derrière elle, sous verre, la corde coupée sans nom.", "prompt_image": "a woman's hands endlessly retying the same knot in her lap, black sleeves, the rope worn shiny at that one spot. tight crop on the gesture only — hands, arms, or the back of the figure — the head out of frame, the face never visible, so nothing has to match another image, one single light source raking across the gesture, everything behind it falling away to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_veuve_cordes_a.png"}, {"id": "puits-condamne", "type": "arrivee", "nom": "Le Puits Condamné", "lieu": "puits_condamne", "parent": null, "mene_a": ["puits-condamne-2"], "texte": ["Sur la place arrière du hameau, un puits — condamné de frais : planches neuves, chaînes croisées, cadenas encore gras. Tout le reste du hameau tombe en ruine douce, mais ça, on l'entretient.", "Et dessous, ça cogne. Trois coups, une pause. Trois coups. Poli, presque — comme on frappe à une porte dont on sait qu'on va vous ouvrir."], "description": "Arrivée au Puits Condamné. Un puits fermé par des planches clouées en croix, par-dessus, des pierres empilées.", "prompt_image": "village well sealed shut with planks nailed in a cross over its mouth, stones piled on top, worn rope still tied to the winch, empty square, dark fantasy vintage engraving style, grainy etching texture, very high contrast, dark vignette edges, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere", "illustration": "scene_puits_condamne_c.png"}, {"id": "puits-condamne-2", "type": "moment", "nom": "Le Puits Condamné — beat 2", "lieu": "puits_condamne", "parent": null, "mene_a": [], "texte": ["À ton approche, le rythme change. Plus vite, plus fort — plus personne de poli. Le cadenas saute sur son anneau à chaque série, et les planches, au dernier coup, ont bougé. Franchement bougé."], "description": "Événement du Puits (scène chronométrée) : les Mains du Puits, qui sortent entre les planches.", "prompt_image": "hands forcing up from under the nailed planks of a sealed well, fingers through the gap, a padlock jumping on its ring. tight crop on the gesture only — hands, arms, or the back of the figure — the head out of frame, the face never visible, so nothing has to match another image, one single light source raking across the gesture, everything behind it falling away to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_mains_du_puits_a.png"}, {"id": "chien-du-bailli", "type": "arrivee", "nom": "Le Chien du Bailli", "lieu": "maison_du_bailli", "parent": null, "mene_a": ["chien-du-bailli-2"], "texte": ["La plus grande maison du hameau est murée — de l'intérieur. Chaque fenêtre bouchée de pierres posées depuis dedans, en rangs pressés, par quelqu'un qui s'enfermait plus qu'il ne se protégeait. La maison du Bailli. Vide depuis sa corde. Pas gardée par personne."], "description": "Arrivée à la Maison du Bailli, murée. Portes et fenêtres bouchées à la pierre, de l'extérieur — on a fermé cette maison depuis la rue.", "prompt_image": "stone house with every door and window bricked up from the outside, fresh mortar against old walls, a low garden wall, no path worn to the door, dark fantasy vintage engraving style, grainy etching texture, very high contrast, dark vignette edges, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere", "illustration": "scene_maison_du_bailli_c.png"}, {"id": "chien-du-bailli-2", "type": "moment", "nom": "Le Chien du Bailli — beat 2", "lieu": "maison_du_bailli", "parent": null, "mene_a": [], "texte": ["Le chien se lève du seuil sans aboyer. Gris, trop grand, le poil usé aux endroits d'un harnais qu'il ne porte plus. Son maître pend à la colline — mais l'ordre, lui, n'a jamais été levé. Personne n'entre. Il te le dit d'un seul regard."], "description": "Combat : le Chien du Bailli, qui garde encore une maison où il n'y a plus personne.", "prompt_image": "large grey dog rising from a doorstep without barking, coat worn bare where a harness used to sit, blocking the way. pitch-black background, subject emerging from darkness, one single light source, this is the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_chien_du_bailli_b.png"}, {"id": "petit-tribunal", "type": "arrivee", "nom": "Le Petit Tribunal", "lieu": "petit_tribunal", "parent": null, "mene_a": ["petit-tribunal-2"], "texte": ["La grange aux trois bancs sent le suif froid. La chaire fait face à la porte — ici, même l'entrée est un interrogatoire.", "Au mur, une feuille clouée. Sur la chaire, un livre ouvert. Les bancs, eux, gardent leurs traces."], "description": "Arrivée au Petit Tribunal. Une grange convertie en salle d'audience : trois bancs de bois face à une haute chaire, une feuille de règles clouée au mur.", "prompt_image": "interior of a barn converted into a rustic courtroom, three wooden benches facing a tall wooden pulpit, a sheet of rules nailed to the wall, dim light through plank gaps, dark fantasy vintage engraving style, grainy etching texture, very high contrast, pitch-black shadows, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere", "illustration": "scene_petit_tribunal_a.png"}, {"id": "mur-ordonnance", "type": "observe", "nom": "La feuille clouée au mur", "lieu": "petit_tribunal", "parent": "petit-tribunal", "mene_a": [], "texte": ["Trois pas de dalle inégale, et la feuille se précise : du papier épais, jauni, cloué aux quatre coins par quelqu'un qui ne voulait pas qu'on la décroche."], "description": null, "prompt_image": "thick yellowed sheet of paper nailed at its four corners to a stone wall, the nails driven deep, the edges of the paper curling. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_tribunal_ordonnance_a_c.png"}, {"id": "chaire-registre", "type": "observe", "nom": "La chaire et son livre", "lieu": "petit_tribunal", "parent": "petit-tribunal", "mene_a": [], "texte": ["La chaire est haute — il faut lever les yeux, et c'est le but. Tu montes la marche unique qui y mène, celle que le Bailli montait chaque fois qu'il allait dire la même phrase."], "description": null, "prompt_image": "high wooden pulpit desk seen from its single step, a heavy ledger left open on it, the wood worn pale where hands gripped the edge. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_tribunal_chaire_a_c.png"}, {"id": "les-bancs", "type": "observe", "nom": "Les bancs et leurs traces", "lieu": "petit_tribunal", "parent": "petit-tribunal", "mene_a": [], "texte": ["Tu redescends vers les bancs. Trois rangs de bois brut, et cette disposition que tu reconnais sans l'avoir apprise : les accusés devant, les témoins de côté, le hameau derrière."], "description": null, "prompt_image": "three rows of rough wooden benches in an empty stone hall, the front bench polished smooth by use, the others barely worn. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_tribunal_bancs_a_c.png"}, {"id": "petit-tribunal-2", "type": "moment", "nom": "Le Petit Tribunal — beat 2", "lieu": "petit_tribunal", "parent": null, "mene_a": [], "texte": ["La porte s'ouvre derrière toi. Un petit homme sec entre, plume et encrier serrés contre lui — et se fige net en te voyant à la chaire. Une seconde entière. Assez pour que vous sachiez tous les deux qu'il t'a vu.", "Puis il fait comme si de rien : il s'installe au banc des témoins, ouvre son cahier, et se met à copier. L'Écrivain public. Il ne lève pas les yeux — mais sa plume, elle, a ralenti."], "description": "Événement du Tribunal : l'Écrivain public, qui entre, te voit à la chaire, et se met à copier sans lever les yeux.", "prompt_image": "small dry man frozen in a doorway holding a quill and inkpot clutched to his chest, caught seeing something he should not have seen. pitch-black background, subject emerging from darkness, one single light source, this is the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_ecrivain_public_d.png"}, {"id": "meute-grise-1", "type": "moment", "nom": "La Meute Grise", "lieu": "horslieu", "parent": null, "mene_a": ["meute-grise-2"], "texte": ["Passé les murets du hameau, la lande redevient à eux. Tu les vois de loin — et c'est mauvais signe : la Meute Grise ne se montre que quand l'encerclement est fini. Six silhouettes couleur de bruyère morte, immobiles aux six points d'un cercle dont tu es le centre.", "Pas des chiens : trop patients. Pas des loups : trop organisés. La plus grande s'assoit — le signal. Le cercle se met à tourner, lentement, en se resserrant d'un pas par tour."], "description": "Six silhouettes couleur de bruyère morte, immobiles aux six points d'un cercle dont tu es le centre.", "prompt_image": "six lean grey dogs the colour of dead heather, standing still and evenly spaced, already surrounding the viewer. pitch-black background, subject emerging from darkness, one single light source, this is the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_meute_grise_c.png"}, {"id": "meute-grise-2", "type": "moment", "nom": "La Meute Grise — beat 2", "lieu": "horslieu", "parent": null, "mene_a": [], "texte": ["Le cercle est rompu, mais la meute reste — regroupée à distance de lame, en croissant, plus prudente. Ils ont compris que tu mords aussi. Ça ne les décourage pas : ça les intéresse.", "La meneuse s'avance seule d'un pas, tête basse, et te fixe. Chez eux, c'est une question. La dernière avant la charge — ou avant autre chose. À toi d'y répondre."], "description": "Le cercle est rompu : la meute regroupée en croissant à distance de lame, et la meneuse avancée seule d'un pas, tête basse, qui te fixe. CHANGE : plus de cercle autour de toi — un croissant devant, une bête détachée en avant.", "prompt_image": "grey dogs regrouped at blade's distance in a crescent, more cautious than before, the leader one step ahead of the others. pitch-black background, subject emerging from darkness, one single light source, this is the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_meute_grise_c.png"}, {"id": "mare-aux-regards", "type": "arrivee", "nom": "La Mare aux Regards", "lieu": "mare_aux_regards", "parent": null, "mene_a": ["mare-aux-regards-2"], "texte": ["L'eau e pour toujours."], "description": "Événement de la Mare : un Renonçant qui vient vérifier son propre reflet, et te trouve là.", "prompt_image": "kneeling villager bent over the edge of a black pond staring at his own reflection, hands flat on the trampled bank, head turning sharply toward the viewer, pitch-black background, subject emerging from darkness, dark fantasy vintage engraving style, grainy etching texture, very high contrast, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere", "illustration": "scene_mare_aux_regards_a.png"}, {"id": "verger-noir", "type": "arrivee", "nom": "Le Verger Noir", "lieu": "verger_noir", "parent": null, "mene_a": ["verger-noir-2"], "texte": ["Des arbres fruitiers plantés en rangs — le seul ordre volontaire des Landes hors du hameau. Ils ont poussé, ils ont des branches, des feuilles noires, et des fruits. C'est pire que s'ils étaient morts.", "Les rangs et leurs fruits. La souche du premier arbre, au bout. Et deux silhouettes qui bêchent, tout au fond."], "description": "Arrivée au Verger Noir. Des arbres noirs tordus plantés en rangs, des fruits gris et lourds sur les branches, une vieille souche au premier plan.", "prompt_image": "orchard of black twisted fruit trees planted in rows on dead moorland, heavy grey ash fruits on the branches, one old stump in the foreground, two distant bent figures digging, dark fantasy vintage engraving style, grainy etching texture, very high contrast, dark vignette edges, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere", "illustration": "scene_verger_noir_d.png"}, {"id": "fruits-cendre", "type": "observe", "nom": "Les fruits, dans les rangs", "lieu": "verger_noir", "parent": "verger-noir", "mene_a": [], "texte": ["Tu entres dans un rang. L'odeur devrait arriver là — pas de pourriture : pas d'odeur du tout. Un verger qui ne sent rien."], "description": null, "prompt_image": "single hanging fruit close in the frame, its skin ashen and split, dry grey dust spilling from the split, black branch above it. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_verger_fruits_a_c.png"}, {"id": "souche-premier-arbre", "type": "observe", "nom": "La souche, au bout du rang", "lieu": "verger_noir", "parent": "verger-noir", "mene_a": [], "texte": ["Au bout du rang, un arbre manque. Sa souche est nette, sciée à hauteur de genou, et le bois de coupe est gris."], "description": null, "prompt_image": "knee-high sawn stump at the end of an orchard row, the cut face flat and grey, the saw marks still legible across it. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_verger_souche_a_c.png"}, {"id": "epoux-verger", "type": "observe", "nom": "Les deux qui bêchent, au fond", "lieu": "verger_noir", "parent": "verger-noir", "mene_a": ["epoux-1"], "texte": ["Tu remontes les rangs vers eux. Ils se relaient sur la même bêche sans se parler, du geste réglé des gens qui font la même chose ensemble depuis toujours."], "description": null, "prompt_image": "elderly couple sharing one spade between orchard rows, taking turns without speaking, the settled rhythm of people who have done this together for decades. pitch-black background, subject emerging from darkness, one single light source, this is the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_epoux_verger_a.png"}, {"id": "verger-noir-2", "type": "moment", "nom": "Le Verger Noir — beat 2", "lieu": "verger_noir", "parent": null, "mene_a": [], "texte": ["Un fruit tombe, derrière toi. Sans vent, sans oiseau.", "Quand tu le ramasses, il est encore chaud — comme une chose qui vient de cesser d'essayer."], "description": "Événement du Verger : le fruit qui tombe encore chaud.", "prompt_image": "a single fallen fruit lying in the dirt of an orchard row, picked up in a bare hand, its skin ashen and still warm. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surface so the texture and the cut marks read, background falling to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "scene_verger_noir_d.png"}, {"id": "epoux-1", "type": "moment", "nom": "Epoux 1", "lieu": "verger_noir", "parent": null, "mene_a": ["epoux-2"], "texte": ["La femme se redresse la première. Elle ne sursaute pas — plus rien ne les surprend, ici.", "— « C'est le onzième verger. » Elle le dit avant toute autre chose, comme on donne son nom. « Les dix premiers ont donné des fruits de cendre. Celui-là aussi. Le douzième, on verra. »", "L'homme continue de bêcher. Il n'a pas levé la tête. Il compte les coups de bêche à voix basse."], "description": "Les Époux, deux silhouettes courbées qui creusent entre les rangs du verger noir sans se parler.", "prompt_image": "elderly couple sharing one spade between orchard rows, taking turns without speaking, the settled rhythm of people who have done this together for decades. pitch-black background, subject emerging from darkness, one single light source, this is the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_epoux_verger_a.png"}, {"id": "epoux-2", "type": "moment", "nom": "Epoux 2 — beat 2", "lieu": "verger_noir", "parent": null, "mene_a": ["epoux-3"], "texte": ["— « Tu viens du dehors. » Ce n'est pas une question : c'est une prière déguisée en constat. « Il te reste forcément quelque chose du dehors. N'importe quoi. Une graine, un bout de vrai bois, une chose qui a poussé sous le vrai soleil. On le planterait. »", "Tu sais ce que tu as : rien. Tu es arrivé ici comme tout le monde y arrive — les mains vides et mort."], "description": "L'un des deux s'est redressé entre les rangs et te tend les mains ouvertes et vides, en demande. CHANGE : ils ne sont plus tous deux courbés — l'un est debout, face à toi.", "prompt_image": "two old hands held out open toward the viewer, palms up, begging without words for anything brought from outside. tight crop on the gesture only — hands, arms, or the back of the figure — the head out of frame, the face never visible, so nothing has to match another image, one single light source raking across the gesture, everything behind it falling away to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_epoux_verger_a.png"}, {"id": "epoux-3", "type": "moment", "nom": "Epoux 3 — beat 3", "lieu": "verger_noir", "parent": null, "mene_a": ["verger-noir-2"], "texte": ["Ils se remettent au travail avant que tu sois sorti des rangs — le onzième verger n'attend pas.", "Longtemps après, tu entends encore le compte à voix basse, régulier comme une corde qui grince : c'est le bruit que fait l'espoir quand il refuse de savoir."], "description": "Les deux silhouettes de nouveau courbées, vues de dos, qui s'éloignent entre les rangs. CHANGE : on les quitte — vus de dos, repris au travail.", "prompt_image": "the backs of two old people bent to their work between orchard rows, seen from behind as one walks away from them, heads never turning. tight crop on the gesture only — hands, arms, or the back of the figure — the head out of frame, the face never visible, so nothing has to match another image, one single light source raking across the gesture, everything behind it falling away to black, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": "monstre_epoux_verger_a.png"}, {"id": "palissade-sud", "type": "arrivee", "nom": "La Palissade Sud", "lieu": "palissade_sud", "parent": null, "mene_a": ["palissade-sud-2"], "texte": ["La Palissade barre le plateau d'un trait noir : des rondins plantés serrés, hauts de deux hommes. Un portillon, une guérite, une lanterne allumée en plein jour.", "Derrière, un chemin qui descend. On le sent plus qu'on ne le voit : l'air y coule comme une eau froide. La Descente. Et dans la guérite, un homme qui t'a vu depuis longtemps."], "description": "Arrivée à la Palissade Sud, seuil de l'Acte II. Une haute palissade de rondins appointés qui ferme l'horizon, un petit portillon, une borne au premier plan.", "prompt_image": "tall wooden palisade of sharpened logs closing a moorland horizon, small gate, a single standing boundary stone in the foreground, path leading ring, no watermark", "illustration": "scene_palissade_portillon_a_b.png"}, {"id": "homme-guerite", "type": "observe", "nom": "L'homme de la guérite", "lieu": "palissade_sud", "parent": "palissade-sud", "mene_a": ["veilleur-1"], "texte": ["Il est sorti de sa niche avant que tu aies décidé d'y aller. Tu marches vers lui parce qu'il n'y a plus vraiment le choix."], "description": null, "prompt_image": "night watchman sitting in a narrow plank sentry box built against a log wall, his lantern on the ground at his feet as the only light, watching the viewer with the patience of someone who saw them coming long ago. pitch-black background, subject emerging from darkness, one single light source, this is the reference image of this character, dark fantasy illustration, deep crushed blacks, no fill light, high contrast, two-tone monochrome-friendly, strong readable shapes, matte painting, grim medieval rural, square composition, no text, no lettering, no watermark", "illustration": null}, {"id": "veilleur-1", "type": "moment", "nom": "Veilleur 1", "lieu": "palissade_sud", "parent": null, "mene_a": ["veilleur-2"], "texte": ["— « Trois jours ! » Il le crie presque — la voix de quelqu'un qui parle peu et qui stocke. « Trois jours que j'ai vu personne. Le hameau m'envoie ma soupe par le gamin, et le gamin pose la soupe à vingt pas. Vingt pas ! Comme si veiller la porte, ça s'attrapait. »", "Il sort de sa niche, s'étire, et te détaille sans gêne — l'inventaire franc de l'homme qui n'a plus de manières à user.", "— « Tu descends. Évidemment que tu descends. On vient pas admirer ma palissade. »"], "description": "Le Veilleur dans sa guérite de planches, une lanterne pendue à un clou au-dessus de lui.", "prompt_image": "rusted lantern standing on the floor of a narrow plank sentry box, the only light source, a bowl of cold soup set down far from it. extreme close-up, the subject filling the frame, no horizon, no sky, no figure, no face, one single low raking light grazing the surfac <script>
"use strict";
/* Chemin des images. En local, tools/atelier.py les sert sous /assets/ ; sur
   gh-pages la page vit à côté du jeu, donc en RELATIF (assets/) — une barre de
   plus et toutes les vignettes tombent en 404. */
const BASE = (typeof window.__ZONE_DATA__ !== "undefined") ? "assets/" : "/assets/";
/* ⚠️ Les noms d'image ne sont pas homogènes dans le JSON : les LIEUX portent
   « assets/xxx.png », les SCÈNES « xxx.png ». On rabote le préfixe à la
   lecture plutôt que de doubler /assets/assets/. */
const fichierImage = f => f ? String(f).replace(/^assets\//, "") : f;
const ORANGE="#e0632a";
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* =====================================================================
   MODÈLE — un seul objet par nœud. C'est ce que le JSON doit contenir.
   {id, type, nom, texte, description, prompt, image, parent, mene_a[]}
   type : lieu · arrivee · moment · observe
   ===================================================================== */
const ZONE = new URLSearchParams(location.search).get("zone") || "landes";

/* =====================================================================
   DONNÉES — plus rien en dur : tout vient de data/zones/<zone>.json,
   servi par tools/atelier.py. Le schéma du JSON est celui de la maquette
   à un détail près : `texte` y est un TABLEAU de paragraphes (c'est ce
   que le jeu affiche, un bloc par écran), alors que l'édition se fait
   dans un seul textarea. On aplatit à la lecture, on redécoupe à
   l'écriture — sur les lignes vides, comme des paragraphes.
   ===================================================================== */
let D = { lieux: [], noeuds: [], reserve: [] };

function paraVersTexte(t){ return Array.isArray(t) ? t.join("\n\n") : (t || ""); }
function texteVersPara(s){
  return String(s || "").split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);
}

/* WEB : la page est publiée sur gh-pages, les données du JSON y sont CUITES
   au moment du déploiement (window.__ZONE_DATA__). Il n'y a alors aucun
   serveur derrière — donc aucune écriture possible, et on le dit clairement
   plutôt que de laisser croire qu'un champ modifié part quelque part. */
const WEB = typeof window.__ZONE_DATA__ !== "undefined";

async function chargerZone(){
  let z;
  if(WEB){
    z = window.__ZONE_DATA__;
  }else{
    const r = await fetch(`/api/zone/${ZONE}`);
    if(!r.ok) throw new Error(`zone « ${ZONE} » illisible (${r.status})`);
    z = await r.json();
  }
  D = {
    lieux: (z.lieux || []).map((l, i) => ({
      id: l.id, nom: l.nom || l.id,
      // La carte a besoin de coordonnées ; le JSON de zone n'en porte pas
      // encore. On dispose en grille tant que Patrick n'a pas placé les
      // lieux à la main (le champ `x`/`y` est respecté dès qu'il existe).
      x: l.x != null ? l.x : 60 + (i % 4) * 300,
      y: l.y != null ? l.y : 40 + Math.floor(i / 4) * 260,
      image: l.illustration || null,
      region: !!l.region, dans: l.dans || null, contient: l.contient || []
    })),
    noeuds: (z.scenes || []).map(s => ({
      id: s.id, lieu: s.lieu, type: s.type, nom: s.nom || s.id,
      parent: s.parent || null, mene_a: s.mene_a || [],
      image: s.illustration || null,
      sansImage: !!s.sans_image,
      texte: paraVersTexte(s.texte),
      description: s.description || "",
      prompt: s.prompt_image || ""
    })),
    reserve: z._reserve || []
  };
  // Les scènes errantes (Meute Grise…) n'appartiennent à aucun lieu du JSON :
  // on leur fabrique une carte, sinon elles seraient injoignables.
  const errants = D.noeuds.filter(n => n.lieu === "horslieu");
  if(errants.length && !D.lieux.some(l => l.id === "horslieu")){
    D.lieux.push({ id:"horslieu", nom:"Sans lieu fixe",
      x: 60, y: 40 + Math.ceil(D.lieux.length / 4) * 260,
      image: (errants.find(n => n.image) || {}).image || null });
  }
  // Un lieu sans image propre prend celle de sa scène d'arrivée.
  D.lieux.forEach(l => {
    if(!l.image){
      const a = D.noeuds.find(n => n.lieu === l.id && n.type === "arrivee" && n.image);
      if(a) l.image = a.image;
    }
  });
}

/* ---------- écriture RÉELLE : chaque champ part vers le serveur ---------- */
async function ecrire(id, champ, valeur){
  if(WEB){
    noteEcriture(`<b>${id}</b>.${champ} — non enregistré : cette page est en lecture seule`, false);
    return;
  }
  const l = noteEcriture(`<b>${id}</b>.${champ} — écriture…`);
  try{
    const r = await fetch("/api/champ", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ zone: ZONE, id, champ, valeur })
    });
    const j = await r.json();
    if(!r.ok || j.erreur) throw new Error(j.erreur || `HTTP ${r.status}`);
    majLigne(l, `<b>${id}</b>.${champ} — ${j.journal}`, true);
    return j;
  }catch(e){
    // On le DIT au lieu de laisser croire que c'est écrit.
    majLigne(l, `<b>${id}</b>.${champ} — ✗ ${e.message}`, false);
    throw e;
  }
}

async function deposerImage(id, fichier){
  const l = noteEcriture(`<b>${fichier.name}</b> — dithering…`);
  const data = await new Promise((ok, ko) => {
    const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = ko;
    fr.readAsDataURL(fichier);
  });
  try{
    const r = await fetch("/api/image", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ zone: ZONE, id, nom: fichier.name, data })
    });
    const j = await r.json();
    if(!r.ok || j.erreur) throw new Error(j.erreur || `HTTP ${r.status}`);
    majLigne(l, `<b>${j.fichier}</b> — ${j.journal}`, true);
    return j.fichier;
  }catch(e){
    majLigne(l, `<b>${fichier.name}</b> — ✗ ${e.message}`, false);
    throw e;
  }
}

/* index rapide */

const ecritures=[]; let dirty=0;

function tousAssets(){

/* Le journal n'est plus une liste de « modifs non exportées » : les
   écritures sont réelles et immédiates. Chaque ligne naît « en cours »
   puis dit ce qui s'est VRAIMENT passé, y compris un échec. */
let nEcritures=0;
function rendreJournal(){
  document.getElementById("jbody").innerHTML =
    ecritures.map(e=>`<div class="l" style="opacity:${e.etat==="cours"?.55:1};${e.etat==="ko"?"color:var(--blanc)":""}">${e.txt}</div>`).join("");
  document.getElementById("dirty").textContent =
    nEcritures ? nEcritures+" écriture"+(nEcritures>1?"s":"")+" sur disque" : "";
}
function noteEcriture(txt){
  const l={txt,etat:"cours"}; ecritures.unshift(l); rendreJournal(); return l;
}
function majLigne(l,txt,ok){
  l.txt=txt; l.etat=ok?"ok":"ko"; if(ok) nEcritures++;
  rendreJournal();

}

/* ---------- vignette de secours ---------- */
function ph(el,seed){
  const c=document.createElement("canvas"); c.className="ph"; c.width=60;c.height=60;
  const x=c.getContext("2d"); x.fillStyle="#141310"; x.fillRect(0,0,60,60);
  let s=0; for(const ch of seed) s=(s*31+ch.charCodeAt(0))|0;
  const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  for(let i=0;i<520;i++){
    const p=(rnd()*60)|0,q=(rnd()*60)|0;
    if(rnd()>1-(q/60)*.85) continue;
    x.fillStyle="rgba(224,99,42,.55)"; x.fillRect(p,q,1,1);
  }
  x.fillStyle="rgba(255,255,255,.25)";
  x.fillRect(26,28,8,2); x.fillRect(29,25,2,8);
  el.appendChild(c);
}
function poseImage(box,fichier,seed){
  box.innerHTML="";
  if(fichier){
    const im=document.createElement("img"); im.src=BASE+fichierImage(fichier); im.loading="lazy"; im.alt=seed;
    im.onerror=()=>{im.remove();ph(box,seed);};
    box.appendChild(im);
  } else ph(box,seed);
}

/* ============ VUE CARTE ============ */
const carteInner=document.getElementById("carteInner");
/* La carte respecte la géographie : une RÉGION (le Hameau des Renonçants) est
   un cadre qui contient ses lieux. Sur la carte Figma 2112:325 c'est le cadre
   pointillé ; les mettre au même niveau que la Colline ou la Borne, comme le
   faisait la première version, ment sur ce qu'est le Hameau. */
function renduCarte(){
  carteInner.innerHTML="";
  const carte=(l)=>{
    const ns=D.noeuds.filter(n=>n.lieu===l.id);
    const manquantes=ns.filter(n=>!n.image && !n.sansImage).length;
    const aModifier=ns.filter(n=>marque(n.id)).length;
    const el=document.createElement("div");
    el.className="lieuCard"+(manquantes?" pb":"");
    el.dataset.lieu=l.id;
    el.style.left=(l.x||0)+"px"; el.style.top=(l.y||0)+"px";
    el.innerHTML=`<div class="th"></div><div class="bd">
      <div class="nm">${l.nom}</div>
      <div class="sb">${ns.length?ns.length+" nœud"+(ns.length>1?"s":""):"aucune scène écrite"}</div>
      ${manquantes?`<div class="al">${manquantes} sans image</div>`:""}
      ${aModifier?`<div class="al">${aModifier} à modifier</div>`:""}</div>`;
    poseImage(el.querySelector(".th"), l.image, l.id);
    if(l.region) el.classList.add("regTete");
    attacherDeplacement(el, l);
    return el;
  };

  // Les cadres de région d'abord : ils passent DERRIÈRE les cartes.
  D.lieux.filter(l=>l.region).forEach(l=>{
    const membres=[l, ...D.lieux.filter(x=>x.dans===l.id)];
    const box=document.createElement("div");
    box.className="regionBox";
    const M=26;                       // air entre le cadre et les cartes
    const x0=Math.min(...membres.map(m=>m.x||0))-M;
    const y0=Math.min(...membres.map(m=>m.y||0))-M;
    const x1=Math.max(...membres.map(m=>(m.x||0)+CARTE_L))+M;
    const y1=Math.max(...membres.map(m=>(m.y||0)+CARTE_H))+M;
    box.style.left=x0+"px"; box.style.top=y0+"px";
    box.style.width=(x1-x0)+"px"; box.style.height=(y1-y0)+"px";
    const nsr=D.noeuds.filter(n=>n.lieu===l.id);
    box.innerHTML=`<div class="regTitre">${l.nom}
      <span class="regSub">région · ${membres.length-1} lieux · ${nsr.length} scènes propres</span></div>`;
    carteInner.appendChild(box);
  });

  D.lieux.forEach(l=>carteInner.appendChild(carte(l)));
  ajusterToile();
}

/* ── ZOOM DE LA CARTE ──────────────────────────────────────────────────────
   Demande : « pouvoir dézoomer encore plus pour avoir une vue d'ensemble ».
   Le zoom s'applique à la couche intérieure ; la toile qui défile prend la
   taille RÉELLE (naturelle × zoom), sinon les barres de défilement mentent.
   Le taux est gardé dans le navigateur : on retrouve sa vue en revenant. */
const ZOOM_MIN=0.25, ZOOM_MAX=1.6, ZOOM_RANGE="pactum-atelier-zoom";
let zoomCarte=parseFloat(localStorage.getItem(ZOOM_RANGE)||"1")||1;
const carteToile=document.getElementById("carteToile");

function appliqueZoom(garderCentre){
  zoomCarte=Math.min(ZOOM_MAX,Math.max(ZOOM_MIN,zoomCarte));
  const vue=document.getElementById("carte");
  // On vise le point qui était au CENTRE de l'écran avant le changement,
  // sinon zoomer chasse la carte hors du cadre.
  const cx=garderCentre?(vue.scrollLeft+vue.clientWidth/2):0;
  const cy=garderCentre?(vue.scrollTop+vue.clientHeight/2):0;
  const avant=parseFloat(carteInner.dataset.zoom||"1");
  carteInner.style.transform=`scale(${zoomCarte})`;
  carteInner.dataset.zoom=zoomCarte;
  carteToile.style.width=(carteInner.offsetWidth*zoomCarte)+"px";
  carteToile.style.height=(carteInner.offsetHeight*zoomCarte)+"px";
  if(garderCentre){
    const k=zoomCarte/avant;
    vue.scrollLeft=cx*k-vue.clientWidth/2;
    vue.scrollTop=cy*k-vue.clientHeight/2;
  }
  document.getElementById("zTaux").textContent=Math.round(zoomCarte*100)+" %";
  localStorage.setItem(ZOOM_RANGE,String(zoomCarte));
}
function zoomAjuste(){
  const vue=document.getElementById("carte");
  const l=carteInner.offsetWidth, h=carteInner.offsetHeight;
  if(!l||!h) return;
  zoomCarte=Math.min((vue.clientWidth-24)/l,(vue.clientHeight-24)/h);
  appliqueZoom(false);
  vue.scrollTo(0,0);
}
document.getElementById("zMoins").onclick=()=>{zoomCarte-=0.1;appliqueZoom(true);};
document.getElementById("zPlus").onclick=()=>{zoomCarte+=0.1;appliqueZoom(true);};
document.getElementById("zTaux").onclick=()=>{zoomCarte=1;appliqueZoom(true);};
document.getElementById("zFit").onclick=zoomAjuste;
/* Pincer sur le trackpad arrive au navigateur comme molette + ctrl : on la
   récupère telle quelle, la molette seule continuant de faire défiler. */
document.getElementById("carte").addEventListener("wheel",e=>{
  if(!e.ctrlKey&&!e.metaKey) return;
  e.preventDefault();
  zoomCarte*=e.deltaY<0?1.08:0.92;
  appliqueZoom(true);
},{passive:false});

/* Taille d'une carte de lieu — sert au cadre de région et à la toile.
   Mesurée une fois sur la première carte rendue plutôt que codée en dur :
   la hauteur dépend du nombre de lignes du bloc de texte. */
let CARTE_L=212, CARTE_H=190;
function ajusterToile(){
  const une=carteInner.querySelector(".lieuCard");
  if(une){ CARTE_L=une.offsetWidth; CARTE_H=une.offsetHeight; }
  const mx=Math.max(...D.lieux.map(l=>(l.x||0)+CARTE_L), 900);
  const my=Math.max(...D.lieux.map(l=>(l.y||0)+CARTE_H), 700);
  carteInner.style.width=(mx+80)+"px";
  carteInner.style.height=(my+80)+"px";
  appliqueZoom(false);
}

/* ── déplacer un lieu ──────────────────────────────────────────────────────
   Le but affiché : « une carte, un peu comme mon Figma ». Donc on doit
   pouvoir déranger la disposition à la main. En local, le déplacement part
   dans le JSON ; depuis le lien publié, il n'y a pas de serveur, donc il
   tient dans le navigateur et le bouton « copier les positions » permet de
   me les renvoyer. Un clic sans glissement ouvre le lieu, comme avant. */
/* ── « À MODIFIER » ─────────────────────────────────────────────────────────
   Même clé et même format que la page de couverture (`pactum-verdicts`,
   {id:{v:"a_remplacer",note}}). Les deux pages sont servies par le même
   domaine, donc elles partagent ce stockage : marquer une image ici la
   marque là-bas, et inversement. Une seule liste, jamais deux avis. */
const VERDICTS="pactum-verdicts", A_MODIFIER="a_remplacer";
function verdicts(){
  try{ return JSON.parse(localStorage.getItem(VERDICTS)||"{}"); }catch(_){ return {}; }
}
function marque(id){ return (verdicts()[id]||{}).v===A_MODIFIER; }
function basculerMarque(id, note){
  const v=verdicts();
  if(v[id] && v[id].v===A_MODIFIER) delete v[id];
  else { v[id]={v:A_MODIFIER}; if(note) v[id].note=note; }
  localStorage.setItem(VERDICTS, JSON.stringify(v));
  return marque(id);
}

const POSITIONS_LOCALES="pactum-atelier-positions";
function positionsRangees(){
  try{ return JSON.parse(localStorage.getItem(POSITIONS_LOCALES)||"{}"); }
  catch(_){ return {}; }
}
function rangerPosition(id,x,y){
  const p=positionsRangees(); p[id]={x,y};
  localStorage.setItem(POSITIONS_LOCALES, JSON.stringify(p));
}
function appliquerPositionsRangees(){
  const p=positionsRangees();
  D.lieux.forEach(l=>{ if(p[l.id]){ l.x=p[l.id].x; l.y=p[l.id].y; } });
}

function attacherDeplacement(el, l){
  /* ⚠️ Les écouteurs vivent sur la FENÊTRE, pas sur la carte. Première
     version faite avec setPointerCapture sur l'élément : mesuré, la carte ne
     recevait que 2 pointermove sur 10 pendant un glissement, et la première
     alors même que la capture n'était pas encore effective — donc un
     déplacement de 100px n'en enregistrait que 10. Sur la fenêtre, aucun
     événement ne peut se perdre pendant que la carte se déplace sous le
     curseur. */
  el.onpointerdown=e=>{
    if(e.button!==0) return;
    e.preventDefault();
    const ox=e.clientX, oy=e.clientY, px=l.x||0, py=l.y||0;
    let bouge=false;

    const bouger=ev=>{
      const dx=(ev.clientX-ox)/zoomCarte, dy=(ev.clientY-oy)/zoomCarte;
      // Seuil : sans lui, le moindre frémissement de la souris transformerait
      // un clic d'ouverture en déplacement d'un pixel.
      if(!bouge && Math.abs(dx)*zoomCarte<4 && Math.abs(dy)*zoomCarte<4) return;
      bouge=true; el.classList.add("drag");
      l.x=Math.max(0,Math.round(px+dx)); l.y=Math.max(0,Math.round(py+dy));
      el.style.left=l.x+"px"; el.style.top=l.y+"px";
      majCadresRegion();
    };
    const lacher=()=>{
      window.removeEventListener("pointermove",bouger);
      window.removeEventListener("pointerup",lacher);
      window.removeEventListener("pointercancel",lacher);
      el.classList.remove("drag");
      if(!bouge){ ouvrirLieu(l.id); return; }
      rangerPosition(l.id,l.x,l.y);
      ajusterToile();
      if(!WEB) ecrireLieu(l.id,l.x,l.y);
      else noteEcriture(`<b>${l.nom}</b> — déplacé (gardé dans ce navigateur)`,true);
    };
    window.addEventListener("pointermove",bouger);
    window.addEventListener("pointerup",lacher);
    window.addEventListener("pointercancel",lacher);
  };
}

/* Le cadre suit les cartes pendant le glissement, sinon il saute à la fin. */
function majCadresRegion(){
  D.lieux.filter(l=>l.region).forEach((l,i)=>{
    const box=carteInner.querySelectorAll(".regionBox")[i]; if(!box) return;
    const membres=[l, ...D.lieux.filter(x=>x.dans===l.id)];
    const M=26;
    const x0=Math.min(...membres.map(m=>m.x||0))-M;
    const y0=Math.min(...membres.map(m=>m.y||0))-M;
    const x1=Math.max(...membres.map(m=>(m.x||0)+CARTE_L))+M;
    const y1=Math.max(...membres.map(m=>(m.y||0)+CARTE_H))+M;
    box.style.left=x0+"px"; box.style.top=y0+"px";
    box.style.width=(x1-x0)+"px"; box.style.height=(y1-y0)+"px";
  });
}

async function ecrireLieu(id,x,y){
  const ligne=noteEcriture(`<b>${id}</b>.position — écriture…`);
  try{
    const r=await fetch("/api/lieu",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({zone:ZONE,id,x,y})});
    const j=await r.json();
    if(!r.ok||j.erreur) throw new Error(j.erreur||`HTTP ${r.status}`);
    majLigne(ligne,`<b>${id}</b>.position — ${j.journal}`,true);
  }catch(e){ majLigne(ligne,`<b>${id}</b>.position — ✗ ${e.message}`,false); }
}

/* disposition en arbre : racines = arrivées sans parent d'action */
function disposer(lieuId){
  [...gScene.querySelectorAll(".node")].forEach(n=>n.remove());
  gEdges.innerHTML="";
  const ns=D.noeuds.filter(n=>n.lieu===lieuId);
  const NW=210, NH=150, GX=30, GY=80;

  /* chaînes : une racine = un nœud vers lequel rien ne mène */
  const cible=new Set(); ns.forEach(n=>(n.mene_a||[]).forEach(t=>cible.add(t)));
  const racines=ns.filter(n=>n.type!=="observe" && !cible.has(n.id));

  let colonne=0; const pos={};
  function placerChaine(n,col,rang){
    pos[n.id]={x:col*(NW+GX), y:rang*(NH+GY)};
    const obs=ns.filter(o=>o.type==="observe" && o.parent===n.id);
    obs.forEach((o,i)=>{ pos[o.id]={x:(col)*(NW+GX)+ (NW+GX)*(i+1)*0.0 + (NW+GX), y:rang*(NH+GY)+ i*(NH+20)}; });
    let large=1+ (obs.length?1:0);
    const suite=(n.mene_a||[]).map(id=>ns.find(x=>x.id===id)).filter(Boolean);
    let sousCol=col;
    suite.forEach((s,i)=>{ placerChaine(s, col, rang+1+i*0); });
    return large;
  }
  /* disposition simple : une colonne par chaîne, un rang par beat */
  racines.forEach(r=>{
    let n=r, rang=0;
    const colObs=[];
    while(n){
      pos[n.id]={x:colonne*(NW+GX)*2, y:rang*(NH+GY)};
      const obs=ns.filter(o=>o.type==="observe" && o.parent===n.id);
      obs.forEach((o,i)=>{ pos[o.id]={x:colonne*(NW+GX)*2 + NW+GX, y:rang*(NH+GY)+i*(NH+16)}; });
      const suivant=(n.mene_a||[])[0];
      n = suivant ? ns.find(x=>x.id===suivant) : null;
      rang++;
    }
    colonne++;
  });
  /* orphelins éventuels */
  ns.forEach(n=>{ if(!pos[n.id]) { pos[n.id]={x:colonne*(NW+GX)*2, y:0}; colonne++; } });

  /* nœuds */
  ns.forEach(n=>{
    const el=document.createElement("div");
    el.className="node "+n.type+(n.image?"":" pb");
    el.style.left=pos[n.id].x+"px"; el.style.top=pos[n.id].y+"px";
    el.dataset.id=n.id;
    const kd={arrivee:"arrivée",moment:"moment",observe:"observé",lieu:"lieu"}[n.type]||n.type;
    el.innerHTML=`<div class="th"></div><div class="bd">
      <div class="kd">${kd}</div><div class="nm">${n.nom}</div>
      ${n.image?"":'<div class="al r">image à créer</div>'}</div>`;
    poseImage(el.querySelector(".th"), n.image, n.id);
    // ⚠️ APRÈS poseImage : celle-ci vide la vignette avant de dessiner, donc
    // un badge posé plus tôt disparaîtrait sans bruit.
    if(marque(n.id)){
      el.classList.add("mod");
      el.querySelector(".th").insertAdjacentHTML("beforeend",'<div class="mk">à modifier</div>');
    }
    el.onclick=e=>{e.stopPropagation();ouvrirFiche(n.id);};
    gScene.appendChild(el);
  });

  /* arêtes */
  const svgns="http://www.w3.org/2000/svg";
  let maxX=0,maxY=0;
  Object.values(pos).forEach(p=>{maxX=Math.max(maxX,p.x+NW);maxY=Math.max(maxY,p.y+NH);});
  gEdges.setAttribute("width",maxX+200); gEdges.setAttribute("height",maxY+200);
  function trait(a,b,pointille){
    const p1=pos[a], p2=pos[b]; if(!p1||!p2) return;
    const x1=p1.x+NW/2, y1=p1.y+NH, x2=p2.x+NW/2, y2=p2.y;
    const path=document.createElementNS(svgns,"path");
    const my=(y1+y2)/2;
    path.setAttribute("d",`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
    path.setAttribute("fill","none");
    path.setAttribute("stroke", pointille?"rgba(255,255,255,.25)":"rgba(224,99,42,.75)");
    path.setAttribute("stroke-width","2");
    if(pointille) path.setAttribute("stroke-dasharray","5 5");
    gEdges.appendChild(path);
  }
  function traitLateral(a,b){
    const p1=pos[a], p2=pos[b]; if(!p1||!p2) return;
    const path=document.createElementNS(svgns,"path");
    const x1=p1.x+NW, y1=p1.y+NH/2, x2=p2.x, y2=p2.y+NH/2;
    const mx=(x1+x2)/2;
    path.setAttribute("d",`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    path.setAttribute("fill","none");
    path.setAttribute("stroke","rgba(255,255,255,.25)");
    path.setAttribute("stroke-width","2");
    path.setAttribute("stroke-dasharray","5 5");
    gEdges.appendChild(path);
  }
  ns.forEach(n=>{
    (n.mene_a||[]).forEach(t=>{ if(pos[t]) trait(n.id,t,false); });
    if(n.type==="observe" && n.parent && pos[n.parent]) traitLateral(n.parent,n.id);
  });
}

  document.getElementById("fprompt").onchange=e=>{

  document.getElementById("fsel").onchange=e=>{

  document.getElementById("fcopy").onclick=()=>{

    const texte = prompt
      ? prompt
      : `PACTUM — image à refaire pour « ${n.nom} » (${n.id}).\n`+
        `Aucun prompt n'est encore écrit pour cet écran. `+

  const fmod=document.getElementById("fmod");

  const dz=document.getElementById("fdrop");
  dz.ondragover=e=>{e.preventDefault();dz.classList.add("on");};
  dz.ondragleave=()=>dz.classList.remove("on");
  dz.ondrop=async e=>{
    e.preventDefault();dz.classList.remove("on");
    const f=e.dataTransfer.files[0]; if(!f)return;
    // L'image passe par dither_batch.py côté serveur : jamais de brut
    // dans assets/. Le nom est normalisé là-bas aussi.
    try{
      n.image=await deposerImage(n.id,f);
      if(!D.reserve.includes(n.image)) D.reserve.push(n.image);
      disposer(lieuCourant); ouvrirFiche(id);
    }catch(_){ /* déjà signalé dans le journal */ }
  };
  const fi=document.getElementById("ffile");
  document.getElementById("fimport").onclick=()=>fi.click();
  fi.onchange=async e=>{
    const f=e.target.files[0]; if(!f)return;
    try{
      n.image=await deposerImage(n.id,f);
      if(!D.reserve.includes(n.image)) D.reserve.push(n.image);
      disposer(lieuCourant); ouvrirFiche(id);
    }catch(_){ /* déjà signalé dans le journal */ }
  };
  fb.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>ouvrirFiche(b.dataset.go));

  if(WEB){
    // Lecture seule : on retire ce qui prétendrait écrire, on garde ce qui
    // sert vraiment depuis un lien — lire, et copier un prompt.
    ["ftexte","fdesc","fprompt"].forEach(k=>{
      const e=document.getElementById(k); if(e){e.readOnly=true;e.title="lecture seule";}
    });
    ["fsel","fdrop","fimport"].forEach(k=>{
      const e=document.getElementById(k); if(e) e.style.display="none";
    });
    const lab=fb.querySelector(".side .lab");
    if(lab) lab.textContent="Image câblée dans le jeu";
  }

  fiche.classList.add("on");
}
function rule(cv){
  const w=cv.clientWidth||600; cv.width=w; cv.height=2;
  const x=cv.getContext("2d");
  for(let i=0;i<w;i++){
    if(Math.random()<.7){x.fillStyle="rgba(255,255,255,.26)";x.fillRect(i,0,1,1);}
    if(Math.random()<.13){x.fillStyle="rgba(255,255,255,.14)";x.fillRect(i,1,1,1);}
  }
}

/* ============ barre ============ */
/* ── LE CTA : tout ce qu'il reste à produire, d'un coup ────────────────────
   Deux catégories dans le même envoi, parce qu'elles appellent le même
   travail : les écrans SANS image (à créer) et ceux dont l'image est câblée
   mais jugée mauvaise (à modifier, avec la raison quand elle a été donnée).
   Chaque entrée porte son nom de fichier cible et son prompt — il n'y a
   rien à assembler derrière. Les positions ne sont plus copiées ici : elles
   voyagent déjà dans « Export de secours ». */
function aProduire(){
  const v=verdicts();
  const creer=[], modifier=[];
  D.noeuds.forEach(n=>{
    // Un écran marqué `sans_image` n'attend AUCUNE illustration (une question
    // de dialogue, par exemple) : il n'a rien à faire dans une liste de
    // production, sinon il y reste pour toujours.
    if(n.sansImage) return;
    if(!n.image) creer.push(n);
    else if((v[n.id]||{}).v===A_MODIFIER) modifier.push(n);
  });
  return {creer, modifier, notes:v};
}
function texteAProduire(){
  const {creer, modifier, notes}=aProduire();
  const bloc=(n,quoi)=>{
    const lieu=(lieuById[n.lieu]||{}).nom||n.lieu;
    const note=(notes[n.id]||{}).note;
    return [
      `── ${n.nom}  (${n.id} · ${lieu})`,
      quoi==="modifier" ? `   à MODIFIER · fichier actuel : ${n.image}` : `   à CRÉER`,
      note ? `   ce qui ne va pas : ${note}` : null,
      n.description ? `   ce qu'on doit voir : ${n.description}` : null,
      n.prompt ? `   prompt :\n${n.prompt}` : `   (aucun prompt écrit — texte joué :)\n${n.texte||"—"}`,
    ].filter(Boolean).join("\n");
  };
  const parts=[`PACTUM — Les Landes · images à produire`,
    `${creer.length} à créer · ${modifier.length} à modifier`, ""];
  if(modifier.length){
    parts.push("╔═ À MODIFIER ═══════════════════════════════════════");
    modifier.forEach(n=>parts.push(bloc(n,"modifier"), ""));
  }
  if(creer.length){
    parts.push("╔═ À CRÉER ══════════════════════════════════════════");
    creer.forEach(n=>parts.push(bloc(n,"creer"), ""));
  }
  if(!creer.length && !modifier.length)
    parts.push("Rien à produire : chaque écran a une image, et aucune n'est marquée.");
  return parts.join("\n");
}
const bPrompts=document.getElementById("bPrompts");
function majCompteur(){
  const {creer, modifier}=aProduire();
  bPrompts.textContent = (creer.length+modifier.length)
    ? `Copier les prompts · ${creer.length} à créer, ${modifier.length} à modifier`
    : "Rien à produire";
}
bPrompts.onclick=()=>{
  navigator.clipboard.writeText(texteAProduire()).then(()=>{
    const avant=bPrompts.textContent;
    bPrompts.textContent="Copié ✓";
    setTimeout(()=>{bPrompts.textContent=avant;},1800);
  });
};

/* ============ BRIEF POUR CLAUDE CODE ============ */
const RECETTE_SCENE="dark fantasy vintage engraving style, grainy etching texture, very high contrast, dark vignette edges, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere";
const RECETTE_NOIR="dark fantasy vintage engraving style, grainy etching texture, very high contrast, pitch-black background, subject emerging from darkness, dramatic single light source, high contrast chiaroscuro, no color, mystical and eerie atmosphere";

function briefClaudeCode(){
  const aEcrire=D.noeuds.filter(n=>!n.image && !(n.prompt||"").trim());
  if(!aEcrire.length) return "Aucune scène en attente de prompt. Tout est écrit.";

  const parLieu={};
  aEcrire.forEach(n=>{(parLieu[n.lieu]=parLieu[n.lieu]||[]).push(n);});

  let out=`MISSION — écrire les prompts d'image manquants, zone LES LANDES.
${aEcrire.length} scène${aEcrire.length>1?"s":""} sans image ni prompt.

RÈGLES (non négociables)
1. RÈGLE DU DÉTAIL UNIQUE — deux images d'un même lieu ne montrent JAMAIS le même sujet.
   Chaque lieu ci-dessous liste d'abord ses images déjà décidées : ne répète aucun de ces
   sujets. Isole un détail que les autres ne montrent pas (une main, un objet, des pieds,
   une trace, une texture). Jamais deux fois le même visage, jamais deux fois le même mur.
2. RECETTE v2 — termine chaque prompt par la bonne variante :
   · scènes et paysages : "${RECETTE_SCENE}"
   · gros plans, objets, créatures, portraits : "${RECETTE_NOIR}"
3. Prompt en ANGLAIS. Si le champ description est vide, écris-le aussi (en français,
   1-2 phrases : ce qu'on doit voir à l'écran, avec le type de cadrage).
4. Écris directement dans data/zones/landes.json (champs prompt_image et description).
   N'attends pas ma validation scène par scène — je relirai dans l'atelier.
5. Termine par la liste des ids traités.

`;
  Object.keys(parLieu).forEach(lid=>{
    const l=lieuById[lid];
    const deja=D.noeuds.filter(n=>n.lieu===lid && (n.description||"").trim() && !parLieu[lid].includes(n));
    out+=`\n${"═".repeat(64)}\n## ${l.nom}\n`;
    if(deja.length){
      out+=`\nSujets DÉJÀ pris dans ce lieu — ne pas les répéter :\n`;
      deja.forEach(d=>{ out+=`  · ${d.id} — ${(d.description||"").split("\n")[0]}\n`; });
    }
    out+=`\nÀ ÉCRIRE :\n`;
    parLieu[lid].forEach(n=>{
      const suite=(n.mene_a||[]).map(i=>byId[i]).filter(Boolean).map(x=>x.id).join(", ");
      const avant=D.noeuds.filter(x=>(x.mene_a||[]).includes(n.id)).map(x=>x.id).join(", ");
      out+=`\n─── ${n.id}  ·  ${n.nom}  ·  ${n.type}\n`;
      if(avant) out+=`vient de : ${avant}\n`;
      if(suite) out+=`mène à   : ${suite}\n`;
      out+=`texte joué :\n${(n.texte||"(vide)").split("\n").map(l=>"  "+l).join("\n")}\n`;
      out+=`description : ${(n.description||"").trim()||"(à écrire)"}\n`;
    });
  });
  return out;
}

function listeLeonardo(){
  const prets=D.noeuds.filter(n=>!n.image && (n.prompt||"").trim());
  if(!prets.length) return "Aucun prompt prêt en attente de génération.";
  let out=`${prets.length} image${prets.length>1?"s":""} à générer dans Leonardo.\nRéglages : Lucid Origin · Dynamic · 1:1 · 1024.\nNommer le fichier avec l'id indiqué, puis /leo-import.\n`;
  const parLieu={};
  prets.forEach(n=>{(parLieu[n.lieu]=parLieu[n.lieu]||[]).push(n);});
  Object.keys(parLieu).forEach(lid=>{
    out+=`\n${"═".repeat(64)}\n## ${lieuById[lid].nom}\n`;
    parLieu[lid].forEach(n=>{
      out+=`\n─── ${n.id}\n${n.description||""}\n\n${n.prompt}\n`;
    });
  });
  return out;
}

function sansTexte(){
  const v=D.noeuds.filter(n=>!(n.texte||"").trim());
  if(!v.length) return "Toutes les scènes ont leur texte.";
  let out=`${v.length} scène${v.length>1?"s":""} sans texte joué — à écrire avant les images.\n`;
  v.forEach(n=>{ out+=`\n─── ${n.id} · ${n.nom} · ${lieuById[n.lieu].nom}\n${n.description||"(aucune description)"}\n`; });
  return out;
}
