<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PACTUM — Couverture visuelle · carte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --charbon:#1c1a16;
    --orange:#e0632a;
    --blanc:#ffffff;
    --blanc-50:rgba(255,255,255,.5);
    --blanc-20:rgba(255,255,255,.2);
    --rouge:#a4001b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--charbon);color:var(--blanc);font-family:'Roboto Mono',monospace;font-size:13px;overflow:hidden}

  #top{
    position:fixed;top:0;left:0;right:0;height:96px;z-index:20;
    background:var(--charbon);border-bottom:1px solid var(--blanc-20);
    padding:12px 20px;display:flex;flex-direction:column;gap:8px;
  }
  .line1{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:24px;letter-spacing:2px;line-height:1}
  .counts{display:flex;gap:14px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--blanc-50)}
  .counts b{font-family:'Instrument Serif',serif;font-size:16px;font-weight:400;color:var(--blanc);margin-right:4px}
  .counts .ko b{color:var(--orange)}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .filters button{
    background:none;border:1px solid var(--blanc-20);color:var(--blanc-50);
    font-family:inherit;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:6px 10px;cursor:pointer;
  }
  .filters button.on{background:var(--orange);border-color:var(--orange);color:var(--charbon)}
  .filters .sep{width:1px;background:var(--blanc-20);margin:0 4px}

  #board{position:absolute;top:96px;left:0;right:0;bottom:0;overflow:auto}
  #inner{position:relative;width:1500px;height:1340px}

  .lieu{position:absolute;width:224px;background:var(--charbon);border:2px solid var(--orange);cursor:pointer}
  .lieu.warn{border-color:var(--blanc)}
  .lieu.bad{border-color:var(--rouge)}
  .lieu.hidden{opacity:.15;pointer-events:none}
  .lieu .thumb{position:relative;width:100%;height:118px;overflow:hidden;background:#141310}
  .lieu .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .lieu .thumb canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
  .lieu .body{padding:9px 10px 10px}
  .lieu .nom{font-size:13px;line-height:1.3}
  .lieu .sub{font-size:10px;color:var(--blanc-50);margin-top:4px}
  .lieu .alerte{font-size:10px;color:var(--orange);margin-top:5px}
  .lieu .alerte.rouge{color:var(--rouge)}

  /* ---------- volet : 2/3 de l'écran ---------- */
  #panel{
    position:fixed;top:0;right:0;bottom:0;width:66vw;min-width:520px;z-index:30;
    background:var(--charbon);border-left:1px solid var(--blanc-20);
    transform:translateX(101%);display:flex;flex-direction:column;
  }
  #panel.on{transform:translateX(0)}
  #ph{padding:16px 22px 12px;border-bottom:1px solid var(--blanc-20);position:relative}
  #ph h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:26px;line-height:1.1}
  #ph .meta{font-size:10px;color:var(--blanc-50);margin-top:6px;letter-spacing:1px;text-transform:uppercase}
  #close{
    position:absolute;top:16px;right:20px;width:28px;height:28px;
    background:none;border:2px solid var(--blanc);color:var(--blanc);
    font-family:inherit;font-size:12px;cursor:pointer;transform:rotate(45deg);
  }
  #close span{display:block;transform:rotate(-45deg);line-height:24px}
  #pbody{flex:1 1 auto;overflow-y:auto;padding:6px 22px 60px}

  /* ---------- bloc de scène ---------- */
  .bloc{display:flex;gap:20px;align-items:flex-start;padding:22px 0}
  .parent{flex:0 0 250px}
  .vign{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:#141310;cursor:pointer;border:1px solid var(--blanc-20)}
  .vign img{width:100%;height:100%;object-fit:cover;display:block}
  .vign canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
  .vign.manque{border-color:var(--rouge)}
  .vign.mark{outline:2px solid var(--rouge);outline-offset:-2px}
  .cap{margin-top:8px;font-size:11px;line-height:1.45;word-break:break-word}
  .cap .f{display:block;color:var(--blanc-50);font-size:10px;margin-top:3px}
  .cap .warn{display:block;color:var(--orange);font-size:10px;margin-top:3px}
  .cap .warn.rouge{color:var(--rouge)}

  .enfants{flex:1 1 auto;min-width:0}
  .lot{margin-bottom:14px}
  .lot .titre{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--blanc-50);margin-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:11px}
  .petit .cap{font-size:10px}
  .vide{font-size:10px;color:var(--blanc-20);letter-spacing:1px}
  canvas.rule{display:block;width:100%;height:2px;image-rendering:pixelated}

  /* ---------- loupe ---------- */
  #zoom{position:fixed;inset:0;z-index:40;background:rgba(12,11,9,.95);display:none;
        flex-direction:column;align-items:center;justify-content:center;padding:34px}
  #zoom.on{display:flex}
  #zoom img{max-width:min(620px,80vw);max-height:54vh;display:block;border:1px solid var(--blanc-20)}
  #zoom .z-meta{max-width:620px;margin-top:18px;text-align:center}
  #zoom .z-id{font-size:10px;color:var(--blanc-50);letter-spacing:1px;margin-bottom:10px}
  #zoom .z-desc{font-size:14px;line-height:1.7}
  #zoom .z-act{display:flex;gap:10px;margin-top:22px}
  #zoom button{background:none;border:1px solid var(--blanc-20);color:var(--blanc);
    font-family:inherit;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:9px 14px;cursor:pointer}
  #zoom button.danger{border-color:var(--rouge);color:var(--rouge)}
  #zoom button.danger.on{background:var(--rouge);color:var(--blanc)}

  #reserve{position:fixed;bottom:16px;left:16px;z-index:22;background:var(--charbon);
    border:1px solid var(--blanc-20);color:var(--blanc-50);font-family:inherit;font-size:10px;
    letter-spacing:1px;text-transform:uppercase;padding:9px 12px;cursor:pointer}
</style>
</head>
<body>

<div id="top">
  <div class="line1">
    <h1>LES LANDES — CARTE VISUELLE</h1>
    <div class="counts">
      <span><b id="c-d">0</b>images propres</span>
      <span><b id="c-h">0</b>réutilisées</span>
      <span class="ko"><b id="c-g">0</b>vue de zone</span>
      <span class="ko"><b id="c-x">0</b>rien à afficher</span>
      <span><b>27</b>en réserve</span>
    </div>
  </div>
  <div class="filters" id="filters">
    <button class="on" data-f="tout">Tout</button>
    <button data-f="probleme">Ce qui cloche</button>
    <span class="sep"></span>
    <button data-f="g">Vue de zone</button>
    <button data-f="x">Rien à afficher</button>
    <button data-f="h">Réutilisées</button>
  </div>
</div>

<div id="board"><div id="inner"></div></div>
<button id="reserve">Réserve · 27 images non utilisées</button>

<div id="panel">
  <div id="ph">
    <h2 id="pt"></h2>
    <div class="meta" id="pm"></div>
    <button id="close" aria-label="Fermer"><span>◆</span></button>
  </div>
  <div id="pbody"></div>
</div>

<div id="zoom">
  <img id="zimg" alt="">
  <div class="z-meta"><div class="z-id" id="zid"></div><div class="z-desc" id="zdesc"></div></div>
  <div class="z-act">
    <button id="zmark" class="danger">Marquer à remplacer</button>
    <button id="zclose">Fermer</button>
  </div>
</div>

  {p:["hesitant-1","monstre_hesitant_b.png","d","Un homme immobile face au sud, dos au hameau, planté depuis si longtemps que l'herbe s'est couchée."],
   m:[["hesitant-2","monstre_hesitant_b.png","d","Il parle enfin : tourné de trois-quarts, il désigne la borne du menton sans la regarder."],
      ["hesitant-3","monstre_hesitant_b.png","d","La borne seule au milieu du plateau — l'homme a disparu du cadre."]],o:[]}]},

 {id:"palissade",nom:"La Palissade Sud",x:620,y:1120,scenes:[
  {p:["palissade-sud","scene_palissade_sud_a_a.png","d","Seuil de la sortie : une haute palissade de rondins appointés qui ferme l'horizon, un portillon, une borne au premier plan."],
   m:[["palissade-sud-2",null,"x","L'Appelé, toujours vu de dos, qui marche vers la Descente sans se retourner."]],
   o:[["homme-guerite",null,"g","Le Veilleur dans sa guérite — aucune image dédiée."],
      ["portillon-verrou","scene_palissade_portillon_a_b.png","d","Le verrou côté nord, le bois griffé à hauteur de mains."],
      ["rondins-pointes","scene_palissade_rondins_a_c.png","d","Les pointes taillées, tournées vers l'intérieur des Landes."]]},
  {p:["veilleur-1","objet_lanterne_rouillee.png","d","Le Veilleur dans sa guérite de planches, une lanterne pendue à un clou au-dessus de lui."],
   m:[["veilleur-2","objet_lanterne_rouillee.png","d","Il a décroché sa lanterne et la tend à moitié, le visage éclairé par en dessous."],
      ["veilleur-3","objet_lanterne_rouillee.png","d","Il note ton passage sur une planche, sans lever les yeux ; le portillon sud est ouvert derrière lui."]],o:[]}]},

 {id:"horslieu",nom:"Sans lieu fixe",x:60,y:470,scenes:[
  {p:["meute-grise-1","monstre_meute_grise_c.png","d","Six silhouettes couleur de bruyère morte, immobiles aux six points d'un cercle dont tu es le centre."],
   m:[["meute-grise-2","monstre_meute_grise_c.png","d","Le cercle est rompu : la meute en croissant, la meneuse avancée seule d'un pas, tête basse."]],o:[]}]}
];

const ORPHELINS=["monstre_deserteur_tribunal_a.png","monstre_gamin_murets_a.png","monstre_geryon.png",
"monstre_la_fille_c.png","monstre_limiers.png","monstre_ombre_grand_gibet_a.png","monstre_pendu_mal_fixe_v1_b.png",
"monstre_rodeur.png","monstre_vent_qui_ment_b.png","monstre_vent_qui_ment_d.png","objet_crane.png","objet_dague.png",
"objet_masque.png","scene_champ_des_fixes_c.png","scene_gibet_vide_c.png","scene_landes_hameau_croix_craie_a.png",
"scene_landes_hameau_puits_b.png","scene_landes_tribunal_b.png","scene_moulin_sans_ailes_c.png","scene_tour_de_guet_a.png",
"scene_transition_arrivee_hameau_b.png","scene_transition_chemin_murets_b.png","scene_transition_crete_cordes_b.png",
"scene_transition_croisee_sud_b.png","scene_transition_croix_craie_c.png","scene_transition_hommes_suivent_b.png",
"scene_transition_vols_basses_b.png"];

/* mention affichée seulement quand quelque chose cloche */
const MENTION={h:"réutilise l'image d'une autre scène",g:"vue générique de la zone",x:"rien à afficher"};
const marques=new Set();

function tousItems(l){
  const out=[];
  l.scenes.forEach(s=>{ out.push(s.p); s.m.forEach(i=>out.push(i)); s.o.forEach(i=>out.push(i)); });
  return out;
}
function placeholder(cv,seed,st){
  const W=60,H=60; cv.width=W; cv.height=H;
  const x=cv.getContext("2d"); x.fillStyle="#141310"; x.fillRect(0,0,W,H);
  let s=0; for(const ch of seed) s=(s*31+ch.charCodeAt(0))|0;
  const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  const hz=H*(.55+rnd()*.2);
  for(let i=0;i<820;i++){
    const p=(rnd()*W)|0,q=(rnd()*H)|0;
    if(rnd()>1-(q/H)*.9) continue;
    x.fillStyle= st==="x" ? "rgba(164,0,27,.75)" : ORANGE;
    x.fillRect(p,q,1,1);
  }
  for(let i=0;i<110;i++){ x.fillStyle="#141310"; x.fillRect((W/2+(rnd()-.5)*W*.6)|0,(hz+rnd()*H*.4)|0,2,2); }
}
function media(box,fichier,seed,st){
  if(fichier){
    const im=document.createElement("img"); im.src=BASE+fichier; im.alt=seed; im.loading="lazy";
    im.onerror=()=>{im.remove();const c=document.createElement("canvas");box.appendChild(c);placeholder(c,seed,st);};
    box.appendChild(im);
  } else { const c=document.createElement("canvas"); box.appendChild(c); placeholder(c,seed,st); }
}
function rule(cv){
  const w=cv.clientWidth||600; cv.width=w; cv.height=2;
  const x=cv.getContext("2d");
  for(let i=0;i<w;i++){
    if(Math.random()<.7){x.fillStyle="rgba(255,255,255,.26)";x.fillRect(i,0,1,1);}
    if(Math.random()<.13){x.fillStyle="rgba(255,255,255,.14)";x.fillRect(i,1,1,1);}
  }
}

/* ---------- plateau ---------- */
const inner=document.getElementById("inner");
LIEUX.forEach(l=>{
  const items=tousItems(l);
  const nx=items.filter(i=>i[2]==="x").length, ng=items.filter(i=>i[2]==="g").length, nh=items.filter(i=>i[2]==="h").length;
  const el=document.createElement("div");
  el.className="lieu"+(nx?" bad":(ng?" warn":""));
  el.style.left=l.x+"px"; el.style.top=l.y+"px"; el.dataset.lieu=l.id;
  let alerte="";
  if(nx) alerte=`<div class="alerte rouge">${nx} sans rien à afficher</div>`;
  else if(ng) alerte=`<div class="alerte">${ng} sur vue générique</div>`;
  else if(nh) alerte=`<div class="alerte">${nh} réutilisée${nh>1?"s":""}</div>`;
  el.innerHTML=`<div class="thumb"></div><div class="body">
      <div class="nom">${l.nom}</div>
      <div class="sub">${l.scenes.length} scène${l.scenes.length>1?"s":""} · ${items.length} images</div>
      ${alerte}</div>`;
  media(el.querySelector(".thumb"), l.scenes[0].p[1], l.id, "d");
  el.onclick=()=>ouvrir(l);
  inner.appendChild(el);
});
const T=LIEUX.flatMap(tousItems);
document.getElementById("c-d").textContent=T.filter(i=>i[2]==="d").length;
document.getElementById("c-h").textContent=T.filter(i=>i[2]==="h").length;
document.getElementById("c-g").textContent=T.filter(i=>i[2]==="g").length;
document.getElementById("c-x").textContent=T.filter(i=>i[2]==="x").length;

/* ---------- volet ---------- */
const panel=document.getElementById("panel"), pbody=document.getElementById("pbody");
function vignette(item,petit){
  const [id,fichier,st,desc]=item;
  const w=document.createElement("div"); w.className=petit?"petit":"";
  const box=document.createElement("div");
  box.className="vign"+(st==="x"?" manque":"")+(marques.has(id)?" mark":"");
  box.dataset.id=id;
  media(box,fichier,id,st);
  box.onclick=()=>loupe(item);
  const cap=document.createElement("div"); cap.className="cap";
  cap.innerHTML=`${id}${fichier?`<span class="f">${fichier}</span>`:""}${
    st!=="d"?`<span class="warn${st==="x"?" rouge":""}">${MENTION[st]}</span>`:""}`;
  w.appendChild(box); w.appendChild(cap);
  return w;
}
function ouvrir(l){
  document.getElementById("pt").textContent=l.nom;
  const n=tousItems(l).length;
  document.getElementById("pm").textContent=`${l.scenes.length} scène${l.scenes.length>1?"s":""} · ${n} images · clique une image pour la lire`;
  pbody.innerHTML="";
  l.scenes.forEach((s,i)=>{
    const bloc=document.createElement("div"); bloc.className="bloc";
    const gauche=document.createElement("div"); gauche.className="parent";
    gauche.appendChild(vignette(s.p,false));
    const droite=document.createElement("div"); droite.className="enfants";
    if(!s.m.length && !s.o.length){
      droite.innerHTML='<div class="vide">— aucune variante —</div>';
    } else {
      [["Autres moments",s.m],["Éléments observés",s.o]].forEach(([titre,lot])=>{
        if(!lot.length) return;
        const bloc2=document.createElement("div"); bloc2.className="lot";
        bloc2.innerHTML=`<div class="titre">${titre} · ${lot.length}</div>`;
        const g=document.createElement("div"); g.className="grid";
        lot.forEach(it=>g.appendChild(vignette(it,true)));
        bloc2.appendChild(g); droite.appendChild(bloc2);
      });
    }
    bloc.appendChild(gauche); bloc.appendChild(droite);
    pbody.appendChild(bloc);
    if(i<l.scenes.length-1){ const c=document.createElement("canvas"); c.className="rule"; pbody.appendChild(c); rule(c); }
  });
  panel.classList.add("on");
  requestAnimationFrame(()=>pbody.querySelectorAll("canvas.rule").forEach(rule));
}
document.getElementById("close").onclick=()=>panel.classList.remove("on");

/* ---------- loupe ---------- */
const zoom=document.getElementById("zoom"), zimg=document.getElementById("zimg");
let courant=null;
function loupe(item){
  const [id,fichier,st,desc]=item; courant=item;
  zimg.style.display=fichier?"block":"none";
  if(fichier) zimg.src=BASE+fichier;
  document.getElementById("zid").textContent=id+(fichier?" · "+fichier:"")+(st!=="d"?" · "+MENTION[st]:"");
  document.getElementById("zdesc").textContent=desc;
  const mk=document.getElementById("zmark");
  mk.classList.toggle("on",marques.has(id));
  mk.textContent=marques.has(id)?"Marquée à remplacer":"Marquer à remplacer";
  zoom.classList.add("on");
}
document.getElementById("zclose").onclick=()=>zoom.classList.remove("on");
zoom.onclick=e=>{ if(e.target===zoom) zoom.classList.remove("on"); };
document.getElementById("zmark").onclick=()=>{
  if(!courant)return;
  const id=courant[0];
  marques.has(id)?marques.delete(id):marques.add(id);
  loupe(courant);
  const v=pbody.querySelector(`.vign[data-id="${id}"]`); if(v) v.classList.toggle("mark",marques.has(id));
};

/* ---------- filtres ---------- */
document.getElementById("filters").onclick=e=>{
  const b=e.target.closest("button"); if(!b)return;
  document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  const f=b.dataset.f;
  LIEUX.forEach(l=>{
    const el=document.querySelector(`.lieu[data-lieu="${l.id}"]`);
    const items=tousItems(l);
    let vis=true;
    if(f==="probleme") vis=items.some(i=>i[2]!=="d");
    else if(f!=="tout") vis=items.some(i=>i[2]===f);
    el.classList.toggle("hidden",!vis);
  });
};

/* ---------- réserve ---------- */
document.getElementById("reserve").onclick=()=>{
  document.getElementById("pt").textContent="Réserve";
  document.getElementById("pm").textContent="Images présentes dans assets/, rattachées à aucune scène";
  pbody.innerHTML="";
  const g=document.createElement("div"); g.className="grid";
  ORPHELINS.forEach(f=>g.appendChild(vignette([f,f,"d","Image en réserve : présente dans assets/, rattachée à aucune scène."],true)));
  pbody.appendChild(g);
  panel.classList.add("on");
};
</script>
</body>
