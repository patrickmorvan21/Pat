function brancher(){
  const d=$("#droite");
  const c=d.querySelector("#pClose"); if(c) c.onclick=fermer;
  d.querySelectorAll("[data-onglet]").forEach(b=>b.onclick=()=>{onglet=b.dataset.onglet;renduPanneau();});
  d.querySelectorAll("[data-vers]").forEach(b=>b.onclick=()=>{
    const s=scenePar(b.dataset.vers); if(s) selectionner(natureScene(s),s.id);});
  d.querySelectorAll("[data-poi]").forEach(b=>b.onclick=()=>selectionner("poi",b.dataset.poi));
  d.querySelectorAll("[data-saut]").forEach(b=>b.onclick=()=>{
    const i=Math.max(0,Math.min(D.scenes.length-1,+b.dataset.saut)), s=D.scenes[i];
    selectionner(natureScene(s),s.id);});
  const im=d.querySelector(".pimg[data-zoom]");
  if(im) im.onclick=()=>{const z=$("#zoomimg");z.querySelector("img").src=im.dataset.zoom;
    z.querySelector("p").textContent=im.dataset.nom;z.classList.add("on");};
  d.querySelectorAll("[data-remplacer]").forEach(b=>b.onclick=()=>{
    editImage="image:"+b.dataset.remplacer; renduPanneau();
    const t=$("#motifImage"); if(t) t.focus();
  });
  d.querySelectorAll("[data-fermer-img]").forEach(b=>b.onclick=()=>{ editImage=null; renduPanneau(); });
  d.querySelectorAll('input[type=file][data-pour]').forEach(inp=>inp.onchange=async()=>{
    const file=inp.files&&inp.files[0]; if(!file) return;
    if(!/^image\//.test(file.type||"")) return toast("Ce n'est pas une image");
    await Fichiers.poser(inp.dataset.pour,file);
    editImage=inp.dataset.pour; renduPanneau();
    toast("Image chargée — décris ce qui n'allait pas, puis enregistre");
  });
  d.querySelectorAll("[data-oter-fichier]").forEach(b=>b.onclick=async()=>{
    await Fichiers.retirer(b.dataset.oterFichier);
    editImage=b.dataset.oterFichier; sauver(); renduPanneau(); toast("Fichier retiré");
  });
  d.querySelectorAll("[data-noter]").forEach(b=>b.onclick=()=>{
    const f=b.dataset.noter, t=$("#motifImage"), cible="image:"+f;
    const el=JSON.parse(b.dataset.el||"{}"), fi=Fichiers.get(cible);
    const motif=(t&&t.value.trim())||(fi?"remplacement fourni":"à remplacer, sans précision");
    // La fiche complète voyage avec la demande : sans l'id de l'element, le
    // chemin cible et le hash de l'image publiee, le lot ne serait pas
    // applicable sans deviner.
    noter(cible,"Remplacer l'image",f,motif,b.dataset.ctx,{
      statut: fi?"remplacement-en-attente":"note",
      elementId: el.id, elementType: el.type, elementNom: el.nom,
      imageActuelle: f,
      cheminCible: "aldenhar/public/assets/"+f,
      hashPublie: (MANIF.fichiers[f]||{}).hash||null,
      fichier: fi?{nom:fi.nom, taille:fi.taille, type:fi.type, at:fi.at}:null,
    });
    editImage=null; renduPanneau();
    toast(fi?"Remplacement en attente — exporte le lot quand tu as fini"
            :"Noté — retrouve-le dans « Modifications »");
  });
  d.querySelectorAll("[data-annuler]").forEach(b=>b.onclick=async()=>{
    const cible="image:"+b.dataset.annuler;
    const i=journal.findIndex(j=>j.cible===cible);
    if(i>=0){ journal.splice(i,1); sauver(); }
    await Fichiers.retirer(cible);
    editImage=null; renduPanneau(); toast("Demande retirée");
  });
  d.querySelectorAll("[data-reutiliser]").forEach(b=>b.onclick=()=>{
    reuseOuvert=b.dataset.reutiliser; reuseVal=""; renduPanneau();
    const i=$("#reuseNom"); if(i){ i.focus(); }
  });
  d.querySelectorAll("[data-fermer-reuse]").forEach(b=>b.onclick=()=>{
    reuseOuvert=null; reuseVal=""; renduPanneau(); });
  // Choisir à l'œil : la vignette écrit le nom dans le champ, et la
  // comparaison « Aujourd'hui / Reprendrait » se met à jour aussitôt.
  d.querySelectorAll("[data-pick]").forEach(g=>g.onclick=()=>{
    reuseVal=g.dataset.pick; renduPanneau(); });
  // Le champ se relit à CHAQUE frappe : la vignette de droite doit confirmer
  // le nom avant l'enregistrement, sinon on note un fichier sans l'avoir vu.
  const rn=d.querySelector("#reuseNom");
  if(rn) rn.oninput=()=>{ reuseVal=rn.value; renduPanneau(); const i=$("#reuseNom");
    if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } };
  d.querySelectorAll("[data-noter-reuse]").forEach(b=>b.onclick=()=>{
    const cible=b.dataset.noterReuse, nom=nomAsset(($("#reuseNom")||{}).value);
    if(!assetsConnus().has(nom)) return toast("Ce nom n'existe pas dans les assets");
    const [,type,id]=cible.split(":");
    noter(cible,"Reprendre une image existante",b.dataset.actuel,nom,b.dataset.ctx,{
      statut:"reprise",
      elementId:id, elementType:type,
      imageActuelle:b.dataset.actuel,
      imageSouhaitee:nom,
      hashSouhaite:(MANIF.fichiers[nom]||{}).hash||null,
      // Rien à produire : c'est un CÂBLAGE à déplacer, pas un fichier à faire.
      action:"pointer cet élément vers une image déjà présente dans assets/",
    });
    reuseOuvert=null; reuseVal=""; renduPanneau(); toast("Noté — la même image sera reprise");
  });
  d.querySelectorAll("[data-annuler-reuse]").forEach(b=>b.onclick=()=>{
    const i=journal.findIndex(j=>j.cible===b.dataset.annulerReuse);
    if(i>=0){ journal.splice(i,1); sauver(); }
    reuseOuvert=null; reuseVal=""; renduPanneau(); toast("Reprise retirée");
  });
  d.querySelectorAll("[data-refaire]").forEach(b=>b.onclick=()=>{
    const r=prompt("Pourquoi cette image est-elle à refaire ? (facultatif)")||"sans précision";
    noter(b.dataset.refaire+":image","Image à refaire",b.dataset.nom,r,titre()); toast("Noté");});
  d.querySelectorAll(".edit").forEach(e=>e.onclick=()=>{
    if(!document.body.classList.contains("mode-edition")) return;
    const av=e.dataset.avant, j=journal.find(x=>x.cible===e.dataset.cible);
    const v=prompt(e.dataset.quoi, j?j.apres:av);
    if(v===null||v===(j?j.apres:av)) return;
    noter(e.dataset.cible,e.dataset.quoi,av,v,e.dataset.ctx); renduPanneau(); toast("Modification notée");});
}
function titre(){
  if(!selection) return "Divers";
  if(selection.kind==="poi"){const r=poiPar(selection.id);return r?(r.poi.label||r.poi.id):selection.id;}
  if(selection.kind==="lieu"){const l=(D.zones[0].lieux||[]).find(x=>x.id===selection.id);return l?l.nom:selection.id;}
  const s=scenePar(selection.id); return s?(s.nom||s.id):selection.id;
}

/* ---------- vues secondaires ---------- */
/* ═══ TOUS LES ÉCRANS QUI PORTENT UNE IMAGE ═══════════════════════════════
   Trois natures, et il a fallu les trois pour que la liste soit complète :
     • la SCÈNE — l'entrée de `SCENES[]`, plus le nœud terminal (la Descente,
       qui vit hors du tableau et n'apparaissait donc nulle part) ;
     • l'INTERACTION — depuis le 13/08 les points d'intérêt sont des CHOIX, et
       leur image a migré avec eux. 29 écrans réels étaient invisibles ici ;
     • l'ÉCRAN DE MARCHE — une liaison n'est pas une donnée, elle est fabriquée
       à l'exécution par `makeLiaison()`. Ce sont pourtant les écrans les plus
       VUS d'une vie (un par lieu traversé).
   Sans les trois, « l'ensemble des scènes » n'en montrait que la moitié. */
function tousLesEcrans(){
  const out=[];
  (D.scenes||[]).forEach(s=>{
    if(s.image) out.push({nat:"scene", id:s.id, nom:s.nom||s.id, img:s.image,
      vers:s.id, sous:(s.lieu||"")+(s.terminal?" · sortie de zone":"")});
    (s.choix||[]).forEach(c=>{ if(c.image)
      out.push({nat:"interaction", id:c.id, nom:c.label||c.id, img:c.image,
        vers:s.id, sous:"dans « "+(s.nom||s.id)+" »"}); });
  });
  (D.ecransDeMarche||[]).forEach(e=>out.push({nat:"marche", id:e.id,
    nom:e.fichier, img:e, vers:null, sous:e.regle}));
  return out;
}
const NAT_ECRAN={scene:{ico:"▸",lib:"Scène"},interaction:{ico:"◆",lib:"Interaction"},
  marche:{ico:"↝",lib:"Écran de marche"}};

/* ═══ LA VUE IMAGES ════════════════════════════════════════════════════════
   Quatre paniers, dans l'ordre où ils coûtent du travail. ⚠️ Le STATUT et le
   VERDICT ne se déduisent JAMAIS l'un de l'autre : le statut dit si une image
   est câblée, le verdict si elle est bonne. Une image peut très bien être
   « dédiée » et « à refaire » — le Moulin sans Ailes qui a gardé ses ailes en
   est l'exemple canonique. */
function vueImages(){
  const ec=tousLesEcrans();
  const aRefaire=ec.filter(e=>e.img.verdict);
  const aCreer=ec.filter(e=>!e.img.verdict && e.nat!=="marche"
    && (e.img.statut==="heritee"||e.img.statut==="fallback"));
  const absent=ec.filter(e=>e.img.existe===false);
  const perimes=D.verdictsPerimes||[];
  const doublons=(D.reserve||[]).filter(r=>r.groupe==="doublon");

  const carte=e=>{
    const u=urlImg(e.img.fichier), n=NAT_ECRAN[e.nat];
    const st=e.img.statut==="heritee" ? `emprunte l'image de « ${esc(e.img.herite)} »`
      : e.img.statut==="fallback" ? "vue générique de la zone, pas son lieu"
      : "";
    return `<div style="border:1px solid var(--b10);padding:10px;display:flex;gap:12px;margin-bottom:8px">
      <div class="pimg" style="margin:0;width:104px;height:104px;flex:none;background-image:url('${u}')"
        data-zoom="${u}" data-nom="${esc(e.img.fichier)}"></div>
      <div style="flex:1;min-width:0">
        <p style="margin:0 0 2px"><span style="color:var(--b30)">${n.ico}</span>
          <b style="font-weight:400">${esc(e.nom)}</b></p>
        <p style="margin:0 0 6px;font-size:10px;color:var(--b30)">${n.lib} · ${esc(e.sous||"")}</p>
        ${st?`<p style="margin:0 0 6px;font-size:10.5px;color:var(--b50)">${esc(st)}</p>`:""}
        ${e.img.verdictNote?`<p style="margin:0 0 6px;font-size:11px;color:var(--b50);
          border-left:2px solid var(--orange);padding-left:8px">${esc(e.img.verdictNote)}</p>`:""}
        <p style="margin:0;font-size:9.5px;color:var(--b30);word-break:break-all">${esc(e.img.fichier)}</p>
        ${e.vers?`<button class="lk" data-vers="${esc(e.vers)}" style="margin-top:7px;padding:4px 9px">
          Ouvrir l'écran <em>→</em></button>`:""}
      </div></div>`;
  };
  const section=(titre,aide,html,n)=>!n?"":
    `<h3 style="font:400 17px/1 var(--serif);margin:22px 0 3px">${titre}
       <span style="color:var(--b30);font-size:11px">· ${n}</span></h3>
     <p style="color:var(--b30);font-size:11px;margin:0 0 10px;max-width:82ch">${aide}</p>${html}`;

  const vign=r=>`<figure style="width:120px;margin:0"><div class="pimg" style="margin:0;
      background-image:url('${urlImg(r.fichier)}')" data-zoom="${urlImg(r.fichier)}"
      data-nom="${esc(r.fichier)}"></div>
    <figcaption style="font-size:9px;color:var(--b50);margin-top:4px;word-break:break-all">${esc(r.fichier)}</figcaption></figure>`;
  const parRacine={}; doublons.forEach(r=>{(parRacine[r.racine]=parRacine[r.racine]||[]).push(r);});

  return `<h2 style="font:400 22px/1 var(--serif);margin:0 0 6px">Images</h2>
    <p style="color:var(--b30);font-size:11.5px;margin:0 0 4px">${ec.length} écrans portent une image :
      ${ec.filter(e=>e.nat==="scene").length} scènes, ${ec.filter(e=>e.nat==="interaction").length} interactions,
      ${ec.filter(e=>e.nat==="marche").length} écrans de marche.</p>
    <p style="color:var(--b30);font-size:11px;margin:0 0 4px">Le <b>statut</b> dit si une image est câblée ;
      le <b>verdict</b> dit si elle est bonne. Les deux ne se déduisent pas l'un de l'autre.</p>`
   + section("À refaire",
       "Marquées par toi sur la page de couverture. La note est la tienne — je m'en sers comme brief de prompt.",
       aRefaire.map(carte).join(""), aRefaire.length)
   + section("À créer",
       "Ces écrans n'ont pas d'image à eux : ils empruntent celle d'un voisin, ou affichent une vue d'ambiance de la zone. Rien n'est cassé — il manque une image.",
       aCreer.map(carte).join(""), aCreer.length)
   + section("Fichier introuvable",
       "Une image est câblée mais absente du disque : l'écran sortirait vide. C'est une alarme, pas une tâche de production.",
       absent.map(carte).join(""), absent.length)
   + section("À supprimer",
       "Plusieurs fichiers pour le même sujet. Un seul sert — les autres encombrent le Drive et le dépôt. Dis-moi lequel garder.",
       Object.entries(parRacine).map(([rac,fs])=>
         `<div style="border:1px solid var(--b10);padding:10px;margin-bottom:10px">
            <p style="font-size:10.5px;color:var(--orange);margin:0 0 8px;letter-spacing:1px">${esc(rac)}</p>
            <div style="display:flex;flex-wrap:wrap;gap:12px">${fs.map(vign).join("")}</div></div>`).join(""),
       doublons.length)
   + section("Avis dont l'écran n'existe plus",
       "Tu avais jugé ces images, mais l'écran qui les portait a été coupé ou fondu dans la narration depuis. Ton avis reste valable : les fichiers dorment en réserve, donc ils sont encore réutilisables — et encore faux.",
       perimes.map(p=>`<div style="border:1px solid var(--b10);padding:10px;margin-bottom:8px">
          <p style="margin:0 0 4px"><b style="font-weight:400">${esc(p.id)}</b>
            <span style="color:var(--b30);font-size:10px"> · écran supprimé</span></p>
          <p style="margin:0;font-size:11px;color:var(--b50);border-left:2px solid var(--orange);
            padding-left:8px">${esc(p.note)}</p></div>`).join(""),
       perimes.length);
}

function renduVue(){
  $$(".tab").forEach(t=>t.classList.toggle("on",t.dataset.vue===vue));
  const c=vue==="carte";
  $("#toile").style.display=c?"":"none";
  ["#zoomctl","#minimap"].forEach(s=>$(s).style.display=c?"":"none");
  $("#entete").style.display=c&&!(lieuOuvert&&!audit)?"":"none";
  $("#fil").style.display=c&&lieuOuvert&&!audit?"flex":"none";
  const old=$("#liste"); if(old) old.remove();
  if(c) return;
  const l=document.createElement("div"); l.id="liste";
  l.style.cssText="position:absolute;inset:0;overflow:auto;padding:18px 22px 60px";
  if(vue==="liste"){
    // TOUS les écrans, pas seulement les scènes : les interactions et les
    // écrans de marche sont des écrans que le joueur voit, au même titre.
    // Une ligne d'interaction est décalée sous sa scène porteuse — c'est là
    // qu'elle se joue, et ça montre d'un coup d'œil ce que le lieu contient.
    const ec=tousLesEcrans();
    const lignes=[];
    (D.scenes||[]).forEach(s=>{
      const img=urlImg(s.image&&s.image.fichier);
      lignes.push(`<button class="lk" data-vers="${esc(s.id)}" style="margin-bottom:4px;gap:12px">
        <span style="width:32px;height:32px;flex:none;border:1px solid var(--b20);background:${img?`url('${img}') center/cover`:"var(--carte)"}"></span>
        <span style="flex:1"><b style="font-weight:400">${NATURE[natureScene(s)].ico} ${esc(s.nom||s.id)}</b>
        <span style="display:block;color:var(--b30);font-size:10px">${esc(s.id)} · ${s.choix.length} choix · accès : ${esc(s.acces)}</span></span>
        <em>→</em></button>`);
      (s.choix||[]).forEach(c=>{ if(!c.image) return;
        const ci=urlImg(c.image.fichier);
        lignes.push(`<button class="lk" data-vers="${esc(s.id)}" style="margin:0 0 4px 26px;gap:10px;width:calc(100% - 26px)">
          <span style="width:26px;height:26px;flex:none;border:1px solid var(--b10);background:${ci?`url('${ci}') center/cover`:"var(--carte)"}"></span>
          <span style="flex:1"><b style="font-weight:400;font-size:12px">◆ ${esc(c.label||c.id)}</b>
          <span style="display:block;color:var(--b30);font-size:9.5px">interaction · ${esc(c.id)}</span></span>
          <em>→</em></button>`); });
    });
    const marche=(D.ecransDeMarche||[]).map(e=>{const u=urlImg(e.fichier);
      return `<div class="lk" style="margin-bottom:4px;gap:12px;cursor:default">
        <span class="pimg" style="margin:0;width:32px;height:32px;flex:none;background-image:url('${u}')"
          data-zoom="${u}" data-nom="${esc(e.fichier)}"></span>
        <span style="flex:1"><b style="font-weight:400">↝ ${esc(e.fichier)}</b>
        <span style="display:block;color:var(--b30);font-size:10px">écran de marche · servi ${esc(e.regle)}</span></span></div>`;}).join("");
    l.innerHTML=`<h2 style="font:400 22px/1 var(--serif);margin:0 0 4px">Tous les écrans</h2>
      <p style="color:var(--b30);font-size:11.5px;margin:0 0 14px">${ec.length} écrans portent une image —
        ${ec.filter(e=>e.nat==="scene").length} scènes, ${ec.filter(e=>e.nat==="interaction").length} interactions
        (décalées sous leur scène), ${ec.filter(e=>e.nat==="marche").length} écrans de marche.</p>`
      + lignes.join("")
      + `<h3 style="font:400 17px/1 var(--serif);margin:24px 0 3px">Les écrans de marche</h3>
         <p style="color:var(--b30);font-size:11px;margin:0 0 10px;max-width:82ch">Ils n'existent dans aucune donnée :
           une liaison est fabriquée à l'exécution, et son visuel est tiré selon la direction offerte.
           C'est pourtant ce qu'on voit entre chaque lieu.</p>` + marche;
  }else if(vue==="images"){
    l.innerHTML=vueImages();
  }else if(vue==="systemes"){
    l.innerHTML=vueSystemes();
  }else{
    // ═══ LA RÉSERVE EN TROIS GROUPES (tâche du journal 6/08) ═════════════
    // « Attend sa scène » = le fichier nomme un sujet du lore sans scène
    // écrite. « À brancher » = une scène existante parle du même sujet mais
    // pointe ailleurs (rattachement par le mécanisme de reprise d'image).
    // « Doublons » = plusieurs fichiers pour la même racine — en désigner un.
    // Le reste (« Sans attache ») n'est jamais caché : vestiges et matière.
    const GROUPES=[
      ["attend","Attend sa scène","Le nom correspond à un personnage ou un lieu du lore, mais aucune scène ne l\u2019utilise encore. La scène est à écrire — pas l\u2019image."],
      ["brancher","À brancher","Une scène existante parle du même sujet mais pointe vers une autre image (ou une plus ancienne). Ouvre la scène et utilise « Reprendre une image déjà faite »."],
      ["doublon","Doublons","Plusieurs fichiers pour le même sujet (_v1/_b/_c…). Désigne le bon dans la scène concernée — les autres seront à archiver côté Drive."],
      ["autre","Sans attache","Vestiges d\u2019anciennes zones, matière des liaisons écrites à venir, exports périmés. Rien à faire tant que leur chantier n\u2019existe pas."],
    ];
    const vignette=r=>`<figure style="width:132px;margin:0"><div class="pimg" style="margin:0;background-image:url('${urlImg(r.fichier)}')"
        data-zoom="${urlImg(r.fichier)}" data-nom="${esc(r.fichier)}"></div>
       <figcaption style="font-size:9.5px;color:var(--b50);margin-top:5px;word-break:break-all">${esc(r.fichier)}<br>
       <span style="color:var(--b30)">${r.hash}${r.recent?" · récent":""}</span></figcaption></figure>`;
    // Les doublons se lisent par PAQUET : groupés par racine, côte à côte.
    const parGroupe=g=>D.reserve.filter(r=>(r.groupe||"autre")===g);
    const blocDoublons=rs=>{
      const par={}; rs.forEach(r=>{(par[r.racine]=par[r.racine]||[]).push(r);});
      return Object.entries(par).map(([rac,fs])=>
        `<div style="border:1px solid var(--b10);padding:10px;margin-bottom:10px">
           <p style="font-size:10.5px;color:var(--orange);margin:0 0 8px;letter-spacing:1px">${esc(rac)}</p>
           <div style="display:flex;flex-wrap:wrap;gap:14px">${fs.map(vignette).join("")}</div>
         </div>`).join("");
    };
    l.innerHTML=`<h2 style="font:400 22px/1 var(--serif);margin:0 0 6px">Réserve</h2>
      <p style="color:var(--b30);font-size:11.5px;margin:0 0 16px">${D.reserve.length} images dans assets/, utilisées par aucune scène — classées par ce qu\u2019elles attendent.</p>`+
      GROUPES.map(([g,titre,aide])=>{
        const rs=parGroupe(g);
        if(!rs.length) return "";
        return `<h3 style="font:400 17px/1 var(--serif);margin:20px 0 3px">${titre} <span style="color:var(--b30);font-size:11px">· ${rs.length}</span></h3>
          <p style="color:var(--b30);font-size:11px;margin:0 0 10px;max-width:80ch">${aide}</p>`+
          (g==="doublon"?blocDoublons(rs):`<div style="display:flex;flex-wrap:wrap;gap:14px">${rs.map(vignette).join("")}</div>`);
      }).join("");
  }
  $("#centre").appendChild(l);
  l.querySelectorAll("[data-vers]").forEach(b=>b.onclick=()=>{
    vue="carte"; renduVue(); const s=scenePar(b.dataset.vers); selectionner(natureScene(s),s.id);});
  l.querySelectorAll("[data-zoom]").forEach(b=>b.onclick=()=>{const z=$("#zoomimg");
    z.querySelector("img").src=b.dataset.zoom; z.querySelector("p").textContent=b.dataset.nom; z.classList.add("on");});
}

/* LES SYSTÈMES TRANSVERSES (5/08) — ils ne vivent dans aucune scène mais
   pèsent sur toutes : reliques, loi du Domaine, témoins, faits variables,
   filtres de perception. Sans cette vue, ils sont invisibles hors du code. */
const DONS={amorti:"amortit le premier coup dur",passe:"ouvre un verrou, une fois",
  faveur:"+1 à tous les jets",regard:"donne les lignes de perception",
  silence:"efface un témoin au procès",lecture:"rend les contradictions lisibles"};
const DETTES={marque:"+1 Soupçon dès l'entrée",brisure:"rompt à l'usage (ÉBRANLÉ)",
  exclusion:"le Hameau refuse la grange",usure:"départ à santé réduite",
  froideur:"−1 aux jets d'Empathie",gel:"premier jet sans aucun état"};
const STATL={courage:"Courage",ruse:"Ruse",instinct:"Instinct",empathie:"Empathie"};

function vueSystemes(){
  const rel=D.reliques||[], faits=D.faits||[], perc=D.perceptions||{},
        tem=D.temoins||{}, loi=D.loiDuDomaine||{manifestations:[]},
        surp=D.surprises||[];
  const h=t=>`<h2 style="font:400 22px/1 var(--serif);margin:26px 0 4px">${t}</h2>`;
  const p=t=>`<p style="color:var(--b30);font-size:11.5px;margin:0 0 14px;max-width:78ch">${t}</p>`;
  // ═══ LES ÉLÉMENTS-SURPRISES (catalogue 6/08) : rationnés à UN par run,
  // avec récupération — leur puissance vient de leur rareté. Chaque fiche
  // porte son garde-fou, parce que c'est lui qui fait tenir la surprise.
  const blocSurprises = surp.length
    ? h("Les "+surp.length+" éléments-surprises")+
      p("Au maximum UNE par run, jamais deux runs de suite — le rationnement est non négociable. "+
        "S'y ajoutent, hors tirage : le Geôlier métaleptique (comportemental) et la récitation du Grand Témoin (3e apparition).")+
      surp.map(x=>`<div style="border:1px solid var(--b10);padding:10px 12px;margin-bottom:8px">
        <b style="font-weight:400">${esc(x.nom)}</b>
        <p style="margin:4px 0 0;font-size:11.5px;color:var(--b50)">${esc(x.contexte)}</p>
        <p style="margin:4px 0 0;font-size:10.5px;color:var(--orange)">garde-fou — ${esc(x.garde)}</p>
      </div>`).join("")
    : "";
  const nomScene=i=>{const s=scenePar(i);return s?(s.nom||i):i};

  let out=`<h2 style="font:400 22px/1 var(--serif);margin:0 0 4px">Les systèmes du Domaine</h2>
    ${p("Ce qui ne tient à aucune scène en particulier, et qui pèse sur toutes. Rien d'ici n'est jamais montré au joueur sous forme de chiffre.")}`;
  out+=blocSurprises;

  /* LES ÉTATS EN PREMIER : c'est la question la plus utile à trancher d'un
     coup d'œil — « est-ce un fait auquel le monde réagit, ou un modificateur
     déguisé ? ». D'où les trois colonnes SOURCE / RÉACTIONS / REMÈDE à côté
     des effets mécaniques, et le décompte des sources réelles en jeu. */
  const etats=D.etats||[], besoins=D.besoins||[];
  const srcEtat={}, remEtat={};
  D.scenes.forEach(s=>{
    (s.pointsInteret||[]).forEach(x=>{ if(x.poseEtat)
      (srcEtat[x.poseEtat]=srcEtat[x.poseEtat]||[]).push({s:s.id,l:x.label,q:"en examinant"});});
    (s.choix||[]).forEach(c=>{
      if(c.poseEtat) (srcEtat[c.poseEtat]=srcEtat[c.poseEtat]||[]).push({s:s.id,l:c.label,q:"au choix"});
      if(c.poseEtatSiEchec) (srcEtat[c.poseEtatSiEchec]=srcEtat[c.poseEtatSiEchec]||[]).push({s:s.id,l:c.label,q:"si le jet rate"});
      if(c.repondBesoin){const b=besoins.find(x=>x.id===c.repondBesoin);
        if(b)(remEtat[b.etat]=remEtat[b.etat]||[]).push({s:s.id,l:c.label});}
      if(c.exigeEtat) (srcEtat["__ouvre_"+c.exigeEtat]=srcEtat["__ouvre_"+c.exigeEtat]||[]).push({s:s.id,l:c.label});
    });
  });
  out+=h(`Les ${etats.length} états`)+
    p("Un état n'est pas un modificateur déguisé : c'est un fait sur le héros auquel le monde réagit. Aucun chiffre, aucune durée n'est jamais montrée au joueur — un état se lit à son nom et à la façon dont on le traite.")+
    `<div class="sect">${etats.map(e=>{
      const src=srcEtat[e.id]||[], rem=remEtat[e.id]||[], ouv=srcEtat["__ouvre_"+e.id]||[];
      return `<div class="ch"><div class="l1">
      <span class="lab"><b style="font-weight:400">${esc(e.nom)}</b></span>
      <span class="tags"><span class="tag st">${esc(e.groupe)}</span>${
        src.length?"":'<span class="tag">aucune source en jeu</span>'}${
        e.effets.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</span></div>
      <div class="iss">
        <div><b>Manifestation</b> — ${esc(e.manifestation)}</div>
        ${e.reactions.map(r=>`<div><b>Le monde</b> — ${esc(r)}</div>`).join("")}
        ${e.hint?`<div style="color:var(--orange)"><b>Sous l'anneau</b> — ${esc(e.hint)}</div>`:""}
        ${src.length?`<div><b>S'attrape</b> — ${src.map(x=>`${esc(x.l)} <em style="color:var(--b30)">(${esc(x.q)}, ${esc(nomScene(x.s))})</em>`).join(" · ")}</div>`
          :`<div style="color:var(--b30)"><b>S'attrape</b> — hors scène (${esc(e.source)})</div>`}
        ${ouv.length?`<div><b>Ouvre</b> — ${ouv.map(x=>`${esc(x.l)} <em style="color:var(--b30)">(${esc(nomScene(x.s))})</em>`).join(" · ")}</div>`:""}
        <div><b>Se lève</b> — ${esc(e.remede)}${rem.length?" · "+rem.map(x=>`${esc(x.l)} <em style="color:var(--b30)">(${esc(nomScene(x.s))})</em>`).join(" · "):""}</div>
        ${e.lignesIntruses.length?`<div style="color:var(--b30)">${e.lignesIntruses.length} lignes intruses</div>`:""}
      </div></div>`;}).join("")}</div>`;

  out+=h(`Les ${besoins.length} besoins`)+
    p("Ils se comptent en JOURS, jamais en scènes — un joueur qui traverse vite n'aura presque jamais faim. Aucune jauge : un besoin ne se manifeste QUE par l'état qu'il finit par poser, et il ne tue jamais.")+
    `<div class="sect">${besoins.map(b=>`<div class="ch"><div class="l1">
      <span class="lab"><b style="font-weight:400">${esc(b.id)}</b></span>
      <span class="tags"><span class="tag st">${b.jours} jours</span><span class="tag">pose ${esc((etats.find(e=>e.id===b.etat)||{}).nom||b.etat)}</span></span></div>
      <div class="iss"><div><b>Y répondent</b> — ${b.remedes.map(r=>esc(nomScene(r))).join(" · ")||"—"}</div>
      <div style="color:var(--b30)">route sûre : ${esc(nomScene(b.routeSure))} · route risquée : ${esc(nomScene(b.routeRisquee))}</div></div></div>`).join("")}</div>`;

  /* LES TRANSITIONS. Le texte le plus VU du jeu, et il n'apparaissait nulle
     part ici : une liaison n'est pas une scène, elle est fabriquée à
     l'exécution. On pouvait donc écrire quatorze vignettes de village sans
     qu'aucune soit visible dans l'éditeur. Regroupées par CONTEXTE, parce que
     la vraie question à trancher est « à qui celle-ci est-elle réservée ». */
  const tr=D.transitions||{fond:[],variantes:[],bifurcations:[]};
  const libCond=c=>{
    const o=[];
    if(c.from) o.push(c.from[0]==="HAMEAU_INTERIOR"?"dans le village":"en venant de "+c.from.map(nomScene).join(" ou "));
    if(c.to) o.push("vers "+c.to.map(nomScene).join(" ou "));
    if(c.serment) o.push("serment "+c.serment.join(" ou "));
    if(c.minSoupcon!=null) o.push("soupçon ≥ "+c.minSoupcon);
    if(c.maxSoupcon!=null) o.push("soupçon ≤ "+c.maxSoupcon);
    if(c.maxHealth!=null) o.push("blessé");
    if(c.chapter) o.push("chapitre "+c.chapter);
    if(c.carrying) o.push("porte « "+c.carrying+" »");
    return o;
  };
  const groupes=[
    ["Dans le village", v=>(v.conditions.from||[])[0]==="HAMEAU_INTERIOR"],
    ["Selon d'où tu viens", v=>v.conditions.from && (v.conditions.from||[])[0]!=="HAMEAU_INTERIOR"],
    ["Selon où tu vas", v=>!v.conditions.from && v.conditions.to],
    ["Selon ton état", v=>!v.conditions.from && !v.conditions.to],
  ];
  const vus=new Set();
  out+=h(`Les ${tr.variantes.length+tr.fond.length} textes de marche`)+
    p("Ce qu'on lit ENTRE deux lieux — le texte le plus vu du jeu. La plus spécifique éligible gagne ; à défaut, le fond générique. Un texte servi ne revient jamais dans la même vie.")+
    groupes.map(([titre,f])=>{
      const l=tr.variantes.filter(v=>!vus.has(v.texte)&&f(v));
      l.forEach(v=>vus.add(v.texte));
      if(!l.length) return "";
      return `<div class="sub">${esc(titre)} <span style="color:var(--b30)">· ${l.length}</span></div>
        <div class="sect">${l.map(v=>{
          const cs=libCond(v.conditions);
          return `<div class="ch"><div class="l1"><span class="tags">${
            cs.map(x=>`<span class="tag${/serment|soupçon|blessé|porte/.test(x)?" st":""}">${esc(x)}</span>`).join("")}</span></div>
          <div class="iss"><div>${esc(v.texte)}</div></div></div>`;}).join("")}</div>`;
    }).join("")+
    `<div class="sub">Fond générique <span style="color:var(--b30)">· ${tr.fond.length}</span></div>
     <div class="sect">${tr.fond.map(t=>`<div class="ch"><div class="iss"><div>${esc(t)}</div></div></div>`).join("")}</div>
     <div class="sub">Bifurcations <span style="color:var(--b30)">· ${tr.bifurcations.length}</span></div>
     ${p("La phrase qui annonce les deux routes. La signature (« Deux directions s'ouvrent… ») ne sert qu'à la PREMIÈRE Croisée d'une vie ; ensuite ce sont celles-ci.")}
     <div class="sect">${tr.bifurcations.map(t=>`<div class="ch"><div class="iss"><div>${esc(t)}</div></div></div>`).join("")}</div>`;

  out+=h("La loi du Domaine")+p("Jamais énoncée en jeu. Elle se constate, cas après cas — et elle prépare le twist final sans le révéler.")+
    `<div class="sect" style="max-width:78ch"><p class="para" style="color:var(--orange)">${esc(loi.loi||"—")}</p>
     ${(loi.manifestations||[]).map(m=>`<div class="ch"><div class="l1"><span class="tags">
       <span class="tag">${esc(m.registre||"")}</span></span></div>
       <div class="iss"><div>${esc(m.texte||"")}</div></div></div>`).join("")}</div>`;

  out+=h(`Les ${rel.length} reliques des Landes`)+
    p("Une relique AIDE et COÛTE, toujours les deux. La cause de la mort choisit le pool : une corde ne forge pas la même chose qu'une noyade.")+
    `<div class="sect">${rel.map(r=>`<div class="ch"><div class="l1">
      <span class="lab"><b style="font-weight:400">${esc(r.nom)}</b></span>
      <span class="tags"><span class="tag st">${esc(r.rarete)}</span><span class="tag">mort : ${esc(r.mort)}</span></span></div>
      <div class="iss"><div><b>Don</b> — ${esc(r.fonction||"")} <em style="color:var(--b30)">(${esc(DONS[r.don]||r.don)})</em></div>
      <div><b>Dette</b> — ${esc(r.cout||"")} <em style="color:var(--b30)">(${esc(DETTES[r.dette]||r.dette)})</em></div>
      ${r.murmure?`<div style="color:var(--orange)">« ${esc(r.murmure)} »</div>`:""}</div></div>`).join("")}</div>`;

  out+=h(`Les ${faits.length} faits variables`)+
    p("Le Domaine ne raconte pas la même histoire d'une vie à l'autre. Une seule version est vraie par run, tirée par l'index de la run. Deux versions lues dans deux vies = une contradiction opposable au Registre.")+
    `<div class="sect">${faits.map(f=>`<div class="ch"><div class="l1">
      <span class="lab"><b style="font-weight:400">${esc(f.sujet)}</b></span>
      <span class="tags"><span class="tag">${f.versions.length} versions</span></span></div>
      <div class="iss">${f.versions.map(v=>`<div><b>${esc(v.id)}</b> — ${esc(v.texte)}</div>`).join("")}
      <div style="color:var(--orange)"><b>Au tribunal</b> — ${esc(f.accusation)}</div></div></div>`).join("")}</div>`;

  const cles=Object.keys(perc);
  out+=h(`Les filtres de perception (${cles.length} lieux)`)+
    p("La stat dominante du héros change ce qu'il REMARQUE. Une ligne par écran au plus, la plus haute stat gagne, jamais le nom de la stat à l'écran.")+
    `<div class="sect">${cles.map(k=>`<div class="ch"><div class="l1">
      <span class="lab">${esc(nomScene(k))}</span>
      <span class="tags">${Object.keys(perc[k]).map(s=>`<span class="tag st">${esc(STATL[s]||s)}</span>`).join("")}</span></div>
      <div class="iss">${Object.entries(perc[k]).map(([s,t])=>`<div><b>${esc(STATL[s]||s)}</b> — ${esc(t)}</div>`).join("")}</div></div>`).join("")}</div>`;

  const tk=Object.keys(tem);
  out+=h(`Les ${tk.length} témoins`)+
    p("Le Soupçon n'est pas un compteur, ce sont des gens. Chaque acte qui le fait monter inscrit qui a vu quoi ; au procès, ce sont ces dépositions qui sont lues.")+
    `<div class="sect">${tk.map(k=>`<div class="ch"><div class="l1">
      <span class="lab">${esc(tem[k].nom)}</span>
      <span class="tags"><span class="tag">${esc(k)}</span></span></div>
      <div class="iss"><div>${esc(tem[k].lieu)} — « ${esc(tem[k].deposition)} »</div></div></div>`).join("")}</div>`;
  return out;
}

function chercher(q){
  const r=$("#resultats"); q=q.trim().toLowerCase();
  if(q.length<2){ r.classList.remove("on"); return; }
  const out=[];
  ((D.zones.find(z=>z.id===zoneActive)||D.zones[0]).lieux||[]).forEach(l=>{
    if(l.nom.toLowerCase().includes(q)) out.push({t:l.nom,k:"lieu",s:l.id,d:"lieu"});});
  D.scenes.forEach(s=>{
    if((s.nom||"").toLowerCase().includes(q)||s.id.includes(q))
      out.push({t:s.nom||s.id,k:natureScene(s),s:s.id,d:NATURE[natureScene(s)].lib});
    s.choix.forEach(c=>{ if(c.label.toLowerCase().includes(q))
      out.push({t:c.label,k:natureScene(s),s:s.id,d:"choix · "+(s.nom||s.id)});});
    s.pointsInteret.forEach(p=>{ if((p.label||"").toLowerCase().includes(q))
      out.push({t:p.label,k:"poi",s:p.id,d:"point · "+(s.nom||s.id)});});
  });
  r.innerHTML=out.slice(0,24).map(o=>`<button data-k="${o.k}" data-s="${esc(o.s)}">${esc(o.t)}<span class="rid"> — ${esc(o.d)}</span></button>`).join("")
    ||'<button disabled style="color:var(--b30)">Rien trouvé</button>';
  r.classList.add("on");
  r.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    r.classList.remove("on"); $("#q").value="";
    if(vue!=="carte"){vue="carte";renduVue();}
    if(b.dataset.k==="lieu") ouvrirLieu(b.dataset.s); else selectionner(b.dataset.k,b.dataset.s);});
}

/* ---------- colonne de gauche ---------- */
function renduGauche(){
  $("#zones").innerHTML=D.zones.map(z=>{
    const n=z.lieux.reduce((a,l)=>a+(l.nbScenes||0),0), v=z.lieux.find(l=>l.illustration);
    return `<button class="zline${z.id===zoneActive?" on":" mute"}" data-zone="${esc(z.id)}">
      <span class="vign" ${v?`style="background-image:url('${urlImg(v.illustration)}')"`:""}></span>
      <span><b>${esc(z.nom)}</b><span>${z.lieux.length} lieux · ${n} scènes</span></span></button>`;}).join("");
  $$("[data-zone]").forEach(b=>b.onclick=()=>{zoneActive=b.dataset.zone;lieuOuvert=null;selection=null;
    $("#corps").classList.remove("avec-panneau");disposerLieux();rendu();ajusterLieux();renduGauche();});

  const t=D.totaux, sc=D.scenes;
  const alertes=sc.reduce((n,s)=>n+(s.alertes||[]).length,0);
  const acompl=sc.filter(s=>s.etat!=="valide").length;
  const lieux=(D.zones.find(z=>z.id===zoneActive)||D.zones[0]).lieux.length;
  $("#stats").innerHTML=`
    <div><div class="n">${lieux}</div><div class="l">Lieux</div></div>
    <div><div class="n">${t.scenes}</div><div class="l">Scènes</div></div>
    <div><div class="n">${t.pointsInteret}</div><div class="l">Points</div></div>
    <div><div class="n">${t.choix}</div><div class="l">Choix</div></div>
    <div class="${acompl?"at":""}"><div class="n">${acompl}</div><div class="l">À compléter</div></div>
    <div class="${alertes?"ko":""}"><div class="n">${alertes}</div><div class="l">Alertes</div></div>`;

  const grp=(t,l)=>`<h4>${t}</h4>${l}`;
  $("#legende").innerHTML=
    grp("Nature du contenu", Object.entries(NATURE).map(([k,v])=>
      `<div class="lg"><span class="sh">${v.ico}</span>${v.lib}</div>`).join(""))+
    /* ⚠️ La légende ne liste que les transitions RÉELLEMENT présentes.
       « Choix d'orientation » y figurait alors qu'aucun lien de ce type
       n'existe : les orientations naissent des écrans de LIAISON, générés à
       l'exécution par makeLiaison() — elles ne sont donc jamais des entrées
       statiques du jeu. Une légende qui annonce un symbole qu'on ne verra
       jamais est pire qu'une entrée manquante. */
    grp("Transitions", (()=>{
      const types=new Set((D.liens||[]).map(l=>l.type));
      const l=[];
      if(types.has("principal"))
        l.push(`<div class="lg"><u></u>Suite de séquence</div>`);
      if(types.has("secondaire"))
        l.push(`<div class="lg"><u class="sec"></u>Ouvert par un point</div>`);
      if(types.has("conditionnel"))
        l.push(`<div class="lg"><svg class="ondelg" viewBox="0 0 22 8" width="22" height="8" aria-hidden="true">
          <path d="M0,4 C2.8,0.6 5.7,7.4 8.5,4 C11.3,0.6 14.2,7.4 17,4 C19,1.6 20.6,4 22,4"
                fill="none" stroke="#fff" stroke-width="1.6"/></svg>Choix d'orientation</div>`);
      l.push(`<div class="lg"><span class="sh">◆</span>Point rattaché à sa scène</div>`);
      return l.join("");
    })())+
    grp("État de production", Object.entries(ETAT).map(([k,v])=>
      `<div class="lg"><span class="sh"><span class="etat ${k}" style="position:static;border:none;width:13px;height:13px">${v.ico}</span></span>${v.lib}</div>`).join(""))+
    grp("Alertes d'audit",
      `<div class="lg"><span class="sh" style="color:var(--violet)">⚠</span>Orphelin — aucun accès</div>
       <div class="lg"><span class="sh" style="color:var(--violet)">⛓</span>Lien cassé</div>
       <div class="lg"><span class="sh" style="color:var(--violet)">▢</span>Image manquante</div>`);

  const d=(D.genere||"").replace("T"," ").replace("Z"," UTC");
  $("#fraich").innerHTML=`<div class="note">Les lieux ne sont pas reliés entre eux : la traversée
    tire sa destination à chaque marche. Seules les suites écrites sont tracées.</div>
    Données : <b>${esc(d||"?")}</b><br>commit <b>${esc(D.commit||"?")}</b>`;
}

/* ---------- démarrage ---------- */
(async function(){
  try{
    const [rd,rm]=await Promise.all([
      fetch("studio-data.json?t="+Date.now(),{cache:"no-store"}),
      fetch(BASE+"manifest.json?t="+Date.now(),{cache:"no-store"}).catch(()=>null)]);
    if(!rd.ok) throw new Error("studio-data.json illisible ("+rd.status+")");
    D=await rd.json(); if(rm&&rm.ok) MANIF=await rm.json();
    // La liste complète des assets publiés alimente le champ « reprendre une
    // image » : coller un nom marche, mais la proposer évite la faute de frappe.
    $("#tousLesAssets").innerHTML=[...assetsConnus()].sort()
      .map(n=>`<option value="${esc(n)}">`).join("");
  }catch(e){
    document.body.innerHTML=`<div style="padding:60px;max-width:640px;line-height:1.8;font:13px var(--mono)">
      <h1 style="font:400 24px var(--serif)">Les données ne se chargent pas.</h1>
      <p style="color:rgba(255,255,255,.5)">${esc(e.message)}</p></div>`; return;
  }
  // Les fichiers déposés sont relus AVANT le premier rendu : sinon un
  // remplacement en attente s'afficherait « sans fichier » au rechargement.
  await Fichiers.init();
  zoneActive=D.zones[0]&&D.zones[0].id;
  $("#sousmarque").textContent=`${(D.zones[0]||{}).nom||""} · ${D.zones[0].lieux.length} lieux`;
  $("#titreZone").textContent=((D.zones[0]||{}).nom||"").toUpperCase();
  disposerLieux(); renduGauche(); rendu(); ajusterLieux(); majJournal();
  $("#njour").textContent=journal.length;

  $$("[data-vue]").forEach(b=>b.onclick=()=>{vue=b.dataset.vue;renduVue();});
  $("#zPlus").onclick=()=>setZoom(zs*1.25);
  $("#zMoins").onclick=()=>setZoom(zs*.8);
  $("#zFit").onclick=()=>{lieuOuvert=null;selection=null;audit=false;$("#zAudit").classList.remove("on");
    $("#corps").classList.remove("avec-panneau");rendu();apresTransition(ajusterLieux);};
  $("#zAudit").onclick=()=>{
    audit=!audit; $("#zAudit").classList.toggle("on",audit); rendu();
    if(audit){
      const N=noeuds, r=$("#centre").getBoundingClientRect();
      const x0=Math.min(...N.map(n=>n.x)), y0=Math.min(...N.map(n=>n.y));
      const x1=Math.max(...N.map(n=>n.x+n.w)), y1=Math.max(...N.map(n=>n.y+n.h));
      zs=Math.max(.12,Math.min(1,Math.min(r.width/(x1-x0+90),r.height/(y1-y0+90))));
      zx=24-x0*zs; zy=24-y0*zs; appliquer(); majMinimap();
    } else ajusterLieux();
    toast(audit?"Mode audit — tout est déplié":"Retour à la carte");};
  $("#filRetour").onclick=()=>{lieuOuvert=null;selection=null;
    $("#corps").classList.remove("avec-panneau");rendu();apresTransition(ajusterLieux);};
  $("#q").oninput=e=>chercher(e.target.value);
  document.addEventListener("keydown",e=>{
    if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();$("#q").focus();}
    if(e.key==="Escape"){$("#zoomimg").classList.remove("on");$("#resultats").classList.remove("on");}});
  $("#zoomimg").onclick=()=>$("#zoomimg").classList.remove("on");
  $("#bEdition").onclick=()=>{const on=document.body.classList.toggle("mode-edition");
    $("#bEdition").classList.toggle("actif",on);
    toast(on?"Édition — clique un texte pour le modifier":"Lecture seule"); renduPanneau();};
  $("#bJournal").onclick=()=>$("#journal").classList.toggle("on");
  $("#jClose").onclick=()=>$("#journal").classList.remove("on");
  $("#jVider").onclick=async()=>{if(confirm("Effacer toutes les modifications non transmises, fichiers joints compris ?")){
    journal=[]; await Fichiers.vider(); sauver(); toast("Journal vidé"); renduPanneau();}};
  $("#jCopy").onclick=()=>navigator.clipboard.writeText(rapport())
    .then(()=>toast("Résumé copié — colle-le à Claude"),()=>toast("Copie impossible"));
  $("#jLot").onclick=async()=>{
    const lot=await fabriquerLot();
    if(!lot) return toast("Aucune image jointe — utilise « Copier le résumé textuel »");
    const d=new Date(), p=n=>String(n).padStart(2,"0");
    const nom=`pactum-lot-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.zip`;
    const a=document.createElement("a");
    a.href=URL.createObjectURL(lot.blob); a.download=nom; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast(`Lot de ${lot.n} image(s) téléchargé — joins-le dans le chat`);
  };
  $("#jbody").onclick=e=>{const b=e.target.closest("[data-annule]");if(!b)return;
    journal.splice(+b.dataset.annule,1);sauver();renduPanneau();};
  window.addEventListener("resize",majMinimap);
})();
</script>
</body></html>
