<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PACTUM STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   PACTUM STUDIO — éditeur de conception.

   QUATRE DIMENSIONS, JAMAIS MÉLANGÉES (refonte 30/07) :
     A. NATURE   — ce que l'élément EST. Portée par la TAILLE, la FORME et
                   l'ICÔNE. La couleur n'est qu'un rappel, jamais le seul
                   moyen de distinguer.
     B. RÔLE     — sa fonction dans le parcours (entrée, sortie, pivot,
                   optionnel, verrouillé). Un badge posé sur le nœud, pas un type.
     C. ÉTAT     — où en est la PRODUCTION. Une pastille en haut à droite.
                   JAMAIS la bordure de la carte.
     D. ALERTE   — ce qui est CASSÉ. Des icônes distinctes, en bas à droite.

   L'ORANGE VIF est RÉSERVÉ à la sélection courante. Rien d'autre ne le porte
   en bordure — sinon on ne sait plus ce qui est sélectionné.
   ===================================================================== */
:root{
  --charbon:#141310; --panneau:#191713; --carte:#1f1c17; --carte2:#25211b;
  --orange:#e0632a; --orange-doux:#8a4620; --blanc:#fff;
  --b70:rgba(255,255,255,.7); --b50:rgba(255,255,255,.5);
  --b30:rgba(255,255,255,.3); --b20:rgba(255,255,255,.14); --b10:rgba(255,255,255,.07);
  --rouge:#c8402c; --vert:#5c9e6a; --violet:#9b7bc4; --bleu:#4a9ecf;
  --mono:"Roboto Mono",ui-monospace,monospace; --serif:"Instrument Serif",Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--charbon);color:var(--blanc);font:13px/1.5 var(--mono);
  overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--b20)}

#app{display:grid;grid-template-rows:56px 1fr;height:100vh}
#topbar{display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--b10);
  background:var(--panneau);z-index:20}
#corps{display:grid;grid-template-columns:224px 1fr 0;min-height:0;transition:grid-template-columns .18s}
#corps.avec-panneau{grid-template-columns:224px 1fr 440px}
@media (max-width:1180px){
  #corps{grid-template-columns:0 1fr 0}
  #corps.avec-panneau{grid-template-columns:0 1fr 390px}
  #gauche{display:none}
}

/* ---------- barre du haut ---------- */
.marque{display:flex;align-items:center;gap:10px;min-width:200px}
.logo{width:30px;height:30px;flex:none}
.marque h1{margin:0;font:500 15px/1 var(--mono);letter-spacing:2.4px}
.marque .sous{font-size:10px;color:var(--b50);letter-spacing:.6px;margin-top:3px}
#onglets{display:flex;gap:4px}
.tab{display:flex;align-items:center;gap:6px;padding:7px 13px;font-size:12px;color:var(--b50);
  border:1px solid transparent;letter-spacing:.4px}
.tab:hover{color:var(--b70)}
.tab.on{color:var(--orange);border-color:var(--b20);background:var(--carte)}
#recherche{flex:1;max-width:400px;margin-left:auto;position:relative}
#recherche input{width:100%;padding:8px 12px;background:var(--carte);border:1px solid var(--b20);
  color:var(--blanc);font-size:12px}
#recherche input::placeholder{color:var(--b30)}
#resultats{position:absolute;top:100%;left:0;right:0;z-index:40;background:var(--panneau);
  border:1px solid var(--b20);max-height:340px;overflow:auto;display:none}
#resultats.on{display:block}
#resultats button{display:block;width:100%;text-align:left;padding:8px 12px;font-size:12px;
  border-bottom:1px solid var(--b10)}
#resultats button:hover{background:var(--carte);color:var(--orange)}
#resultats .rid{color:var(--b30);font-size:10px}
.btop{padding:7px 12px;font-size:12px;color:var(--b70);border:1px solid var(--b20);white-space:nowrap}
.btop:hover{border-color:var(--orange);color:var(--orange)}
.btop.actif{background:var(--orange);border-color:var(--orange);color:var(--charbon)}
.pastille{display:inline-block;min-width:17px;padding:0 5px;margin-left:6px;background:var(--orange);
  color:var(--charbon);font-size:10px;font-weight:700;text-align:center}

/* ---------- colonne de gauche ---------- */
#gauche{background:var(--panneau);border-right:1px solid var(--b10);overflow-y:auto;padding:14px 0 24px}
.gtitre{padding:16px 16px 7px;font-size:9.5px;letter-spacing:1.6px;color:var(--b30);text-transform:uppercase}
.gtitre:first-child{padding-top:0}
.zline{display:flex;gap:10px;align-items:center;padding:8px 16px;width:100%;text-align:left}
.zline:hover{background:var(--carte)}
.zline.on{background:var(--carte);box-shadow:inset 2px 0 0 var(--orange)}
.zline .vign{width:34px;height:34px;flex:none;background:var(--carte) center/cover;border:1px solid var(--b20)}
.zline b{display:block;font-weight:400;font-size:12px;color:var(--orange)}
.zline.mute b{color:var(--b50)}
.zline span{font-size:10px;color:var(--b30)}

/* Les statistiques vivent DANS la colonne : elles ne peuvent plus recouvrir
   un nœud de la carte, quel que soit le zoom. */
#stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--b10);margin:0 16px}
#stats div{background:var(--panneau);padding:7px 8px}
#stats .n{font:400 17px/1 var(--serif)}
#stats .l{font-size:8.5px;letter-spacing:.6px;color:var(--b30);text-transform:uppercase;margin-top:2px}
#stats .ko .n{color:var(--rouge)} #stats .at .n{color:var(--orange)}

.lgrp{padding:0 16px 4px}
.lgrp h4{margin:11px 0 5px;font-size:9px;letter-spacing:1.2px;color:var(--b50);text-transform:uppercase}
.lg{display:flex;align-items:center;gap:8px;padding:2.5px 0;font-size:10.5px;color:var(--b50)}
.lg .sh{width:22px;flex:none;display:flex;justify-content:center;align-items:center;font-size:11px}
.lg u{width:22px;height:0;flex:none;border-top:2px solid #fff;text-decoration:none}
.lg u.sec{border-top-width:1.6px;border-top-style:dashed}
.lg .ondelg{flex:none;overflow:visible}
#fraich{padding:14px 16px 0;font-size:9.5px;color:var(--b30);letter-spacing:.4px;line-height:1.5}
#fraich b{color:var(--b50);font-weight:400}
#fraich .note{color:var(--b30);padding-bottom:10px}

/* ---------- la carte ---------- */
#centre{position:relative;overflow:hidden;background:var(--charbon)}
#toile{position:absolute;inset:0;cursor:grab;touch-action:none}
#toile.drag{cursor:grabbing}
#monde{position:absolute;transform-origin:0 0;will-change:transform}
/* ⚠️ z-index explicite : le panneau du lieu déplié (.deplie) a un fond
   charbon à 94 % d'opacité. Sans empilement déclaré il se peint APRÈS le
   SVG et VOILE toutes les flèches de la séquence — un blanc plein ressort
   alors en gris (255×.06 + 20×.94 ≈ 34). C'était la vraie cause du
   « les flèches ne se voient pas », pas la couleur du trait.
   Ordre : région (0) < panneau déplié (1) < flèches (2) < cartes (5). */
#fondSvg{position:absolute;overflow:visible;left:0;top:0;pointer-events:none;z-index:2}
#fondSvg path.hit{pointer-events:stroke;cursor:pointer}

/* --- A. NATURE : la TAILLE et la FORME d'abord, la couleur en rappel --- */
/* ⚠️ z-index explicite : les nœuds (position:absolute, z-index auto)
   passeraient sous le panneau du lieu déplié et sous les flèches, et le fond du
   panneau les délave — les scènes du lieu ouvert devenaient illisibles. */
.nd{position:absolute;z-index:5;background:var(--carte);border:1px solid var(--b20);cursor:pointer;
  user-select:none;display:flex;align-items:center}
.nd:hover{border-color:var(--b50);background:var(--carte2)}
.nd .th{flex:none;background:var(--charbon) center/cover;border:1px solid var(--b10)}
.nd .th.vide{display:flex;align-items:center;justify-content:center;color:var(--b20);font-size:9px}
.nd .nm{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}

/* LIEU — l'élément dominant : ~2,5× une scène, nom lisible sans zoomer. */
.nd.lieu{width:286px;padding:9px;gap:11px;align-items:flex-start;border-left:3px solid var(--bleu)}
.nd.lieu .th{width:74px;height:74px}
/* Le nom du lieu est dimensionné pour le zoom d'ajustement de la CARTE
   FIGMA (≈0,56 : la carte est presque carrée, l'écran large — elle tient par
   la hauteur). À 14,5px il tombait à 8px à l'écran. */
.nd.lieu .nm{font-size:16.5px;line-height:1.22;letter-spacing:.2px}
.nd.lieu .cpt{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px;font-size:11px;color:var(--b50)}
.nd.lieu .cpt i{font-style:normal;color:var(--b30);margin-right:3px}
.nd.lieu .io{margin-top:5px;font-size:10.5px;color:var(--b30);letter-spacing:.3px}
/* SCÈNE — moyenne, sobre. */
.nd.scene{width:198px;padding:5px;gap:8px;border-left:3px solid var(--orange-doux)}
.nd.scene .th{width:30px;height:30px}
.nd.scene .nm{font-size:11.5px;line-height:1.25}
/* RENCONTRE — même gabarit, coin coupé + icône : reconnaissable sans couleur. */
.nd.rencontre{width:198px;padding:5px;gap:8px;border-left:3px solid var(--rouge);
  clip-path:polygon(0 0,calc(100% - 11px) 0,100% 11px,100% 100%,0 100%)}
.nd.rencontre .th{width:30px;height:30px}
.nd.rencontre .nm{font-size:11.5px;line-height:1.25}
/* POINT D'INTÉRÊT — le plus petit, biseauté des deux côtés. */
.nd.poi{width:174px;padding:4px;gap:7px;border-left:3px solid var(--vert);
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.nd.poi .th{width:22px;height:22px}
.nd.poi .nm{font-size:10.5px;line-height:1.2}
.nd .ico{flex:none;font-size:11px;color:var(--b50);width:13px;text-align:center}

/* --- SÉLECTION : le seul usage de l'orange vif en bordure --- */
.nd.sel{border-color:var(--orange)!important;box-shadow:0 0 0 1px var(--orange),0 0 22px rgba(224,99,42,.28);
  background:var(--carte2);z-index:7}
.nd.attenue{opacity:.2}

/* --- C. ÉTAT DE PRODUCTION : une pastille, jamais la bordure --- */
.etat{position:absolute;top:-6px;right:-6px;width:15px;height:15px;border-radius:50%;
  border:2px solid var(--charbon);display:flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:700;line-height:1}
.etat.valide{background:var(--vert);color:#0d1a10}
.etat.acompleter{background:var(--orange);color:var(--charbon)}
.etat.brouillon{background:var(--b30);color:var(--charbon)}
/* --- D. ALERTES D'AUDIT : icônes séparées, en bas à droite --- */
.alertes{position:absolute;right:-5px;bottom:-7px;display:flex;gap:2px}
.alertes span{width:15px;height:15px;background:var(--charbon);border:1px solid var(--violet);
  color:var(--violet);font-size:8.5px;display:flex;align-items:center;justify-content:center}
/* --- B. RÔLE : un badge textuel --- */
.roles{position:absolute;left:-4px;top:-9px;display:flex;gap:3px}
.roles span{padding:1px 5px;font-size:8px;letter-spacing:.7px;text-transform:uppercase;
  background:var(--charbon);border:1px solid var(--b30);color:var(--b70);white-space:nowrap}
.roles span.entree{border-color:var(--vert);color:var(--vert)}
.roles span.sortie{border-color:var(--bleu);color:var(--bleu)}

/* Le lieu DÉPLIÉ : un panneau qui s'ouvre. Les autres restent repliés. */
.deplie{position:absolute;border:1px solid var(--b20);background:rgba(20,19,16,.94);
  z-index:1;pointer-events:none}
.deplie .titre{position:absolute;left:12px;top:-9px;background:var(--charbon);padding:0 8px;
  font-size:10px;letter-spacing:1.2px;color:var(--b50);text-transform:uppercase}
.region{position:absolute;border:1px dashed var(--b20);pointer-events:none;z-index:0}
.region span{position:absolute;left:12px;top:-9px;background:var(--charbon);padding:0 8px;
  font-size:11px;color:var(--b50);letter-spacing:.6px}

#zoomctl{position:absolute;left:14px;top:14px;z-index:8;display:flex;flex-direction:column;gap:4px}
#zoomctl button{width:30px;height:30px;background:var(--panneau);border:1px solid var(--b20);
  color:var(--b70);font-size:15px;line-height:1}
#zoomctl button:hover{border-color:var(--orange);color:var(--orange)}
#zoomctl button.on{background:var(--orange);border-color:var(--orange);color:var(--charbon)}
#entete{position:absolute;left:58px;top:12px;z-index:7;pointer-events:none}
#entete h2{margin:0;font:400 24px/1 var(--serif);color:var(--b70);letter-spacing:1px}
#entete p{margin:5px 0 0;font-size:10px;letter-spacing:1.4px;color:var(--b30);text-transform:uppercase}
#fil{position:absolute;left:58px;top:12px;z-index:9;display:none;align-items:center;gap:10px}
#fil.on{display:flex}
#fil button{font-size:11px;color:var(--b50);border:1px solid var(--b20);padding:5px 10px}
#fil button:hover{color:var(--orange);border-color:var(--orange)}
#fil span{font:400 20px/1 var(--serif);color:var(--b70)}
#minimap{position:absolute;right:14px;bottom:14px;width:172px;height:118px;z-index:5;
  background:rgba(20,19,16,.86);border:1px solid var(--b20)}
#minimap canvas{width:100%;height:100%;display:block}
#infoLien{position:fixed;z-index:70;max-width:340px;background:var(--panneau);border:1px solid var(--orange);
  padding:10px 12px;font-size:11px;line-height:1.5;display:none;pointer-events:none}
#infoLien.on{display:block}
#infoLien b{color:var(--orange);font-weight:400}
#infoLien .t{display:flex;gap:5px;margin:5px 0;flex-wrap:wrap}
#infoLien .t span{font-size:9px;padding:1px 5px;border:1px solid var(--b20);color:var(--b50)}

/* ---------- panneau de droite ---------- */
#droite{background:var(--panneau);border-left:1px solid var(--b10);overflow-y:auto;display:none}
#corps.avec-panneau #droite{display:block}
.phead{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.phead .ic{font-size:14px;color:var(--b50)}
.phead h2{margin:0;font:400 18px/1.2 var(--serif);flex:1}
.badge{padding:2px 7px;font-size:9.5px;letter-spacing:.6px;border:1px solid var(--b20);color:var(--b50);
  white-space:nowrap}
.badge.valide{color:var(--vert);border-color:var(--vert)}
.badge.acompleter{color:var(--orange);border-color:var(--orange)}
.pnav{display:flex;gap:3px}
.pnav button{width:24px;height:24px;border:1px solid var(--b20);color:var(--b50);font-size:12px}
.pnav button:hover{border-color:var(--orange);color:var(--orange)}
.pmeta{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.pmeta span{font-size:9.5px;padding:2px 6px;border:1px solid var(--b20);color:var(--b50);letter-spacing:.5px}
.pmeta span.role{border-color:var(--b30);color:var(--b70);text-transform:uppercase}
.pmeta span.alerte{border-color:var(--violet);color:var(--violet)}
.pimg{margin:0 16px;aspect-ratio:1/1;background:var(--carte) center/cover;border:1px solid var(--b20);
  position:relative;cursor:zoom-in}
.pimg.vide{display:flex;align-items:center;justify-content:center;color:var(--b20);font-size:11px;
  letter-spacing:1px;cursor:default}
.pimg.ko{background:var(--rouge);color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;letter-spacing:1px;text-align:center;padding:20px;cursor:default}
.ptabs{display:flex;gap:2px;margin:14px 16px 0;border-bottom:1px solid var(--b10)}
.ptab{padding:8px 10px;font-size:11px;color:var(--b30);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptab.on{color:var(--orange);border-bottom-color:var(--orange)}
.ptab:hover{color:var(--b70)}
.pcorps{padding:14px 16px 40px}
.sect{margin-bottom:20px}
/* Sous-titre de regroupement dans la vue Systèmes (transitions). */
.sub{margin:18px 0 8px;font-size:10px;letter-spacing:1.4px;color:var(--b50);text-transform:uppercase}
.sect>h3{margin:0 0 8px;font-size:10px;letter-spacing:1.4px;color:var(--b30);text-transform:uppercase;
  display:flex;align-items:center;gap:8px}
.sect>h3 button{font-size:10px;color:var(--b30);border:1px solid var(--b20);padding:2px 6px;margin-left:auto}
.sect>h3 button:hover{color:var(--orange);border-color:var(--orange)}
.para{font-size:12.5px;line-height:1.65;color:var(--b70);margin:0 0 8px}
.vide-txt{font-size:11.5px;color:var(--b30);font-style:italic;line-height:1.5}
.ch{border:1px solid var(--b20);border-left:2px solid var(--c,var(--b20));padding:9px 11px;margin-bottom:8px}
.ch.risque{--c:var(--orange-doux)} .ch.passif{--c:var(--b30)} .ch.verrouille{--c:var(--violet)}
.ch.orientation{--c:var(--bleu)} .ch.suite{--c:var(--b20)} .ch.repos{--c:var(--vert)}
.ch .l1{display:flex;align-items:flex-start;gap:8px}
.ch .num{width:17px;height:17px;flex:none;background:var(--c);color:var(--charbon);font-size:10px;
  font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ch .lab{flex:1;font-size:12.5px}
.ch .tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.ch .tag{font-size:9px;letter-spacing:.5px;padding:2px 5px;border:1px solid var(--b20);color:var(--b50);
  white-space:nowrap}
.ch .tag.st{border-color:var(--orange);color:var(--orange)}
.ch .iss{margin-top:7px;padding-left:25px;font-size:11px;color:var(--b50);line-height:1.55}
/* Systèmes du 5/08 : la déposition d'un témoin se lit comme une citation, pas
   comme une issue de dé — filet gauche orange pour la distinguer. */
.ch .iss.temoin{border-left:2px solid var(--orange);padding-left:10px;margin-left:25px;color:var(--b50)}
.sysnote{font-size:10px;color:var(--b30);margin:3px 0 0}
.ch .iss b{color:var(--b70);font-weight:400}
.ch .fx{margin-top:6px;padding-left:25px;display:flex;gap:6px;flex-wrap:wrap}
.ch .fx span{font-size:9.5px;padding:2px 5px;border:1px dashed var(--b20);color:var(--b50)}
.liens{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.liens h4{margin:0 0 6px;font-size:9.5px;letter-spacing:1px;color:var(--b30);text-transform:uppercase}
.lk{display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid var(--b20);margin-bottom:5px;
  font-size:11px;width:100%;text-align:left}
.lk:hover{border-color:var(--orange);color:var(--orange)}
.lk em{margin-left:auto;font-style:normal;color:var(--b30);white-space:nowrap}
.poil{display:flex;gap:10px;padding:8px;border:1px solid var(--b20);margin-bottom:8px;cursor:pointer}
.poil:hover{border-color:var(--b50)}
.poil .th{width:52px;height:52px;flex:none;background:var(--carte) center/cover;border:1px solid var(--b10)}
.poil .th.vide{display:flex;align-items:center;justify-content:center;color:var(--b20);font-size:8px}
.poil b{display:block;font-weight:400;font-size:12px;margin-bottom:3px}
.poil p{margin:0;font-size:10.5px;color:var(--b50);line-height:1.45}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--b10);
  font-size:11.5px}
.kv span{color:var(--b30)} .kv b{font-weight:400;text-align:right;word-break:break-all}
.kv b.mono{font-size:10.5px;color:var(--b70)}

.edit{border:1px dashed var(--b20);padding:2px 4px;margin:-2px -4px;cursor:text}
body.mode-edition .edit:hover{border-color:var(--orange);background:rgba(224,99,42,.06)}
body:not(.mode-edition) .edit{border-color:transparent;cursor:default}
.edit.modifie{border-style:solid;border-color:var(--orange)}
.ebtn{display:none}
/* Barre d'action sous l'image du panneau. Le Studio n'écrit JAMAIS dans le
   dépôt (voir l'en-tête du fichier) : « remplacer » ne remplace donc rien
   ici — il inscrit la demande, avec le nom exact du fichier, dans le journal
   que Patrick me recolle. C'est moi qui trame la photo et qui câble. */
.pimgact{display:flex;flex-direction:column;margin:8px 16px 0;gap:8px}
.pimgact>button{padding:8px;font-size:11.5px;border:1px solid var(--b20);color:var(--b70);
  letter-spacing:.4px}
.pimgact>button:hover{border-color:var(--orange);color:#fff}
.pimgact.ouvert{border:1px solid var(--orange);padding:10px;gap:7px}
.pimgact label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--b50)}

<script>
"use strict";
/* =====================================================================
   PRINCIPE FONDATEUR : cette page NE TOUCHE JAMAIS AU DÉPÔT. Elle lit un
   export (studio-data.json) et range les modifications dans un journal local.
   « Copier pour Claude » sort le rapport ; c'est Claude qui écrit et déploie.
   ===================================================================== */

const BASE="assets/", CLE="pactum-studio-journal";
let D=null, MANIF={fichiers:{}}, zoneActive=null, vue="carte";
let selection=null;      // {kind:"lieu"|"scene"|"rencontre"|"poi", id}
let lieuOuvert=null;     // UN SEUL lieu déplié à la fois
let audit=false;         // « tout déplier » — jamais le comportement normal
let journal=charger();

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1700);}

/* Le hash du contenu dans l'URL : une image remplacée sous le même nom change
   d'URL, donc aucun cache ne peut servir l'ancienne. */
function urlImg(f){ if(!f) return null;
  const n=String(f).replace(/^assets\//,""), fi=MANIF.fichiers[n];
  return BASE+n+(fi?"?v="+fi.hash:""); }

/* ---------- LES FICHIERS DÉPOSÉS (IndexedDB) ----------
   Les images choisies restent DANS LE NAVIGATEUR : le Studio n'a aucun
   accès au dépôt et n'en aura pas dans cette version. Elles vivent en
   IndexedDB et non en localStorage — localStorage ne stocke que du texte et
   plafonne à ~5 Mo, une seule illustration en base64 le remplirait.
   Le journal (localStorage) ne garde que les MÉTADONNÉES ; l'octet reste ici.

   ⚠️ Ce n'est pas une impasse d'architecture : le jour où le Studio
   s'authentifiera à GitHub, c'est exactement ce même lot (fichier + chemin
   cible + hash de l'image publiée) qui partira en commit ou en branche. La
   structure est déjà celle-là — seul le transport change. */
const Fichiers=(()=>{
  const NOM="pactum-studio-fichiers", MAG="images";
  let db=null; const cache={};            // cible → {blob,url,nom,taille,type,at}
  const ouvrir=()=>new Promise((ok,ko)=>{
    const r=indexedDB.open(NOM,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(MAG)) r.result.createObjectStore(MAG); };
    r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error);
  });
  const tx=(mode)=>db.transaction(MAG,mode).objectStore(MAG);
  return {
    async init(){
      try{ db=await ouvrir(); }catch(e){ console.warn("Studio : IndexedDB indisponible",e); return; }
      await new Promise(ok=>{
        const st=tx("readonly"), req=st.openCursor();
        req.onsuccess=()=>{ const c=req.result;
          if(!c) return ok();
          const v=c.value; cache[c.key]={...v, url:URL.createObjectURL(v.blob)};
          c.continue(); };
        req.onerror=()=>ok();
      });
    },
    get(cible){ return cache[cible]||null; },
    tous(){ return Object.entries(cache).map(([cible,v])=>({cible,...v})); },
    async poser(cible,file){
      const v={blob:file, nom:file.name, taille:file.size, type:file.type||"image/png",
               at:new Date().toISOString()};
      if(cache[cible]) URL.revokeObjectURL(cache[cible].url);
      cache[cible]={...v, url:URL.createObjectURL(file)};
      if(db) await new Promise(ok=>{ const r=tx("readwrite").put(v,cible); r.onsuccess=ok; r.onerror=ok; });
      return cache[cible];
    },
    async retirer(cible){
      if(cache[cible]){ URL.revokeObjectURL(cache[cible].url); delete cache[cible]; }
      if(db) await new Promise(ok=>{ const r=tx("readwrite").delete(cible); r.onsuccess=ok; r.onerror=ok; });
    },
    async vider(){ Object.keys(cache).forEach(k=>{URL.revokeObjectURL(cache[k].url); delete cache[k];});
      if(db) await new Promise(ok=>{ const r=tx("readwrite").clear(); r.onsuccess=ok; r.onerror=ok; }); },
  };
})();

/* ---------- ZIP (méthode « stored », sans dépendance) ----------
   Une page publiée ne peut charger aucune librairie externe (politique de
   sécurité stricte). Le format ZIP sans compression tient en une trentaine
   de lignes, et nos entrées sont des PNG/JPEG : déjà compressés, les
   dégonfler ne gagnerait rien. */
const CRC_T=(()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(u8){ let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0; }
function zip(entrees){                       // [{nom, data:Uint8Array}]
  const enc=new TextEncoder(), d=new Date();
  const heure=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF;
  const jour=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  const morceaux=[], central=[]; let pos=0;
  entrees.forEach(e=>{
    const nom=enc.encode(e.nom), crc=crc32(e.data);
    const l=new DataView(new ArrayBuffer(30));
    l.setUint32(0,0x04034b50,true); l.setUint16(4,20,true); l.setUint16(6,0x0800,true);
    l.setUint16(8,0,true); l.setUint16(10,heure,true); l.setUint16(12,jour,true);
    l.setUint32(14,crc,true); l.setUint32(18,e.data.length,true); l.setUint32(22,e.data.length,true);
    l.setUint16(26,nom.length,true); l.setUint16(28,0,true);
    morceaux.push(new Uint8Array(l.buffer),nom,e.data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true);
    c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,heure,true);
    c.setUint16(14,jour,true); c.setUint32(16,crc,true);
    c.setUint32(20,e.data.length,true); c.setUint32(24,e.data.length,true);
    c.setUint16(28,nom.length,true); c.setUint32(42,pos,true);
    central.push(new Uint8Array(c.buffer),nom);
    pos+=30+nom.length+e.data.length;
  });
  const tailleC=central.reduce((n,b)=>n+b.length,0);
  const f=new DataView(new ArrayBuffer(22));
  f.setUint32(0,0x06054b50,true); f.setUint16(8,entrees.length,true);
  f.setUint16(10,entrees.length,true); f.setUint32(12,tailleC,true); f.setUint32(16,pos,true);
  return new Blob([...morceaux,...central,new Uint8Array(f.buffer)],{type:"application/zip"});
}

/* ---------- le journal de modifications ---------- */
function charger(){ try{return JSON.parse(localStorage.getItem(CLE)||"[]")}catch(_){return[]} }
function sauver(){ localStorage.setItem(CLE,JSON.stringify(journal));
  $("#njour").textContent=journal.length; majJournal();
  $$(".edit").forEach(e=>e.classList.toggle("modifie", journal.some(j=>j.cible===e.dataset.cible))); }
function noter(cible,quoi,avant,apres,ctx,fiche){
  const i=journal.findIndex(j=>j.cible===cible);
  const e={cible,quoi,avant,apres,ctx,at:new Date().toISOString(),...(fiche||{})};
  if(i>=0) journal[i]=e; else journal.push(e); sauver(); }
function majJournal(){
  const b=$("#jbody");
  b.innerHTML = journal.length ? journal.map((j,i)=>{
    const f=Fichiers.get(j.cible);
    const st = j.statut==="remplacement-en-attente" && f
      ? `<span class="st">remplacement en attente</span>`
      : (j.statut ? `<span class="st txt">note seule</span>` : "");
    return `<div class="jl"><div><b>${esc(j.ctx||j.cible)}</b><br>${esc(j.quoi)} → ${esc(String(j.apres).slice(0,60))}${st}</div>
     <button data-annule="${i}" title="Annuler">×</button></div>`;}).join("")
    : '<div class="vide-txt">Aucune modification. Clique « Remplacer cette image » sous une illustration, ou passe en Édition pour un texte.</div>';
  const n=journal.filter(j=>Fichiers.get(j.cible)).length;
  const bt=$("#jLot"); if(bt){ bt.disabled=!n;
    bt.textContent = n ? `Exporter le lot pour Claude (${n} image${n>1?"s":""})`
                       : "Exporter le lot — aucune image jointe"; }
}
/* LE LOT — un zip que Patrick joint dans le chat.
   Il contient les images choisies, un manifeste lisible par une machine et
   des instructions lisibles par un humain. Le manifeste porte de quoi
   appliquer chaque remplacement SANS RIEN DEVINER : l'élément, son type, le
   chemin cible exact, le hash de l'image publiée (donc de quelle version on
   partait) et la note.
   ⚠️ Les images du lot sont les sources BRUTES : le dithering canonique
   (Floyd-Steinberg, seuil 182, contraste 151 %, Charbon/Orange) reste fait
   par `tools/dither_batch.py`, qui est la seule implémentation validée.
   Le tramer ici serait un troisième portage non contrôlé. */
async function fabriquerLot(){
  const avec=journal.filter(j=>Fichiers.get(j.cible));
  if(!avec.length) return null;
  const entrees=[], images=[];
  for(const j of avec){
    const f=Fichiers.get(j.cible);
    const ext=(f.nom.match(/\.[a-z0-9]+$/i)||[".png"])[0].toLowerCase();
    const dans="images/"+j.imageActuelle.replace(/\.[^.]+$/,"")+"__nouvelle"+ext;
    entrees.push({nom:dans, data:new Uint8Array(await f.blob.arrayBuffer())});
    images.push({
      fichierDansLeLot: dans,
      elementId: j.elementId||null, elementType: j.elementType||null,
      elementNom: j.elementNom||null,
      imageActuelle: j.imageActuelle||null,
      cheminCible: j.cheminCible||null,
      hashPublie: j.hashPublie||null,
      sourceChoisie: {nom:f.nom, taille:f.taille, type:f.type},
      note: j.apres||"", statut: "remplacement-en-attente",
      demandeLe: j.at,
    });
  }
  const sansFichier=journal.filter(j=>!Fichiers.get(j.cible)).map(j=>({
    cible:j.cible, quoi:j.quoi, avant:j.avant??null, apres:j.apres,
    contexte:j.ctx||null, statut:j.statut||"modification", demandeLe:j.at}));
  const manifeste={
    outil:"PACTUM Studio", version:1,
    genereLe:new Date().toISOString(),
    donneesLues:{commit:D.commit||null, manifesteAssets:D.genere||null},
    pipeline:{
      dithering:"tools/dither_batch.py (implémentation validée — ne pas retramer ailleurs)",
      destination:"aldenhar/public/assets/",
      apres:["npm run check:coherence","npm run gen:manifest","python3 tools/studio_data.py"],
    },
    remplacementsImages:images,
    autresModifications:sansFichier,
  };
  const enc=new TextEncoder();
  entrees.push({nom:"manifest.json", data:enc.encode(JSON.stringify(manifeste,null,2))});
  entrees.push({nom:"instructions.txt", data:enc.encode(instructions(manifeste))});
  return {blob:zip(entrees), n:images.length};
}

function instructions(m){
  const L=[];
  L.push("PACTUM — LOT DE REMPLACEMENT D'IMAGES");
  L.push("généré par Pactum Studio le "+new Date(m.genereLe).toLocaleString("fr-FR"));
  L.push("données lues : commit "+(m.donneesLues.commit||"?")+" · manifeste d'assets "+(m.donneesLues.manifesteAssets||"?"));
  L.push("");
  L.push("CONTENU");
  L.push("  images/          les sources BRUTES choisies (non tramées)");
  L.push("  manifest.json    la même chose en structuré, pour la machine");
  L.push("  instructions.txt ce fichier");
  L.push("");
  L.push("À FAIRE (Claude)");
  L.push("  1. Passer chaque image par tools/dither_batch.py — seule implémentation");
  L.push("     validée du dithering canonique (Floyd-Steinberg, seuil 182,");
  L.push("     contraste 151 % pivot 128, Charbon #1c1a16 / Orange #e0632a).");
  L.push("  2. NE PAS réutiliser le nom de l'image remplacée : prendre la lettre de");
  L.push("     variante suivante (_c → _d). Un remplacement silencieux sous le même");
  L.push("     nom est invisible dans l'historique et dans les caches.");
  L.push("  3. Déposer dans aldenhar/public/assets/, puis câbler dans");
  L.push("     aldenhar/lib/scene-data.ts (source canonique).");
  L.push("  4. npm run check:coherence · npm run gen:manifest · python3 tools/studio_data.py");
  L.push("  5. Rebuild + déploiement du jeu et des pages d'outillage.");
  L.push("");
  L.push("REMPLACEMENTS ("+m.remplacementsImages.length+")");
  m.remplacementsImages.forEach((r,i)=>{
    L.push("");
    L.push("  "+(i+1)+". "+(r.elementNom||r.elementId)+"  ["+(r.elementType||"?")+"]");
    L.push("     id             : "+(r.elementId||"?"));
    L.push("     image actuelle : "+(r.imageActuelle||"?")+"  (hash publié "+(r.hashPublie||"?")+")");
    L.push("     chemin cible   : "+(r.cheminCible||"?"));
    L.push("     nouvelle image : "+r.fichierDansLeLot+"  (source « "+r.sourceChoisie.nom+" », "+Math.round(r.sourceChoisie.taille/1024)+" Ko)");
    L.push("     note           : "+(r.note||"—"));
  });
  if(m.autresModifications.length){
    L.push("");
    L.push("AUTRES MODIFICATIONS SANS FICHIER ("+m.autresModifications.length+")");
    m.autresModifications.forEach(j=>{
      L.push("  - "+(j.contexte||j.cible)+" · "+j.quoi);
      if(j.avant!=null && String(j.avant).trim()!=="") L.push("      avant : "+String(j.avant).replace(/\n/g," "));
      L.push("      après : "+String(j.apres).replace(/\n/g," "));
    });
  }
  L.push("");
  return L.join("\n");
}

function rapport(){
  if(!journal.length) return "Aucune modification.";
  const par={}; journal.forEach(j=>{(par[j.ctx||"Divers"] ||= []).push(j)});
  let t="# PACTUM STUDIO — modifications à appliquer\n";
  t+=`# ${journal.length} modification(s) · export du ${new Date().toLocaleString("fr-FR")}\n`;
  t+=`# données lues : commit ${D.commit||"?"} · manifeste ${D.genere||"?"}\n\n`;
  for(const [ctx,l] of Object.entries(par)){
    t+=`## ${ctx}\n`;
    l.forEach(j=>{ const f=Fichiers.get(j.cible);
      t+=`- **${j.quoi}** (\`${j.cible}\`)${f?" — FICHIER JOINT DANS LE LOT : "+f.nom:""}\n`;
      if(j.cheminCible) t+=`  - cible : \`${j.cheminCible}\` (hash publié ${j.hashPublie||"?"})\n`;
      if(j.avant!=null && String(j.avant).trim()!=="") t+=`  - avant : ${String(j.avant).replace(/\n/g," ")}\n`;
      t+=`  - après : ${String(j.apres).replace(/\n/g," ")}\n`; });
    t+="\n";
  }
  t+="---\nÀ faire côté dépôt : appliquer dans `aldenhar/lib/scene-data.ts` — SOURCE\n";
  t+="CANONIQUE, c'est le fichier que le moteur exécute. Le champ `illustration` des\n";
  t+="JSON de zone en est un MIROIR : ne pas l'éditer à la main, le régénérer avec\n";
  t+="`npm run check:coherence -- --fix`. Puis `npm run gen:manifest`,\n";
  t+="`python3 tools/studio_data.py`, rebuild et déploiement des pages d'outillage.\n";
  return t;
}

/* =====================================================================
   A. NATURE — quatre natures, et rien d'autre.
   « Scène principale » était une catégorie concurrente d'un lieu : supprimée.
   Un lieu CONTIENT des scènes ; une scène est une étape narrative.
   ===================================================================== */
const NATURE={
  lieu:      {ico:"⬟", lib:"Lieu"},
  scene:     {ico:"▸", lib:"Scène / étape narrative"},
  rencontre: {ico:"☠", lib:"Rencontre"},
  poi:       {ico:"◆", lib:"Point d'intérêt"},
};
const natureScene=s=>(s.combat||s.adversaire)?"rencontre":"scene";
const ETAT={valide:{ico:"✓",lib:"Validé"},acompleter:{ico:"!",lib:"À compléter"},brouillon:{ico:"○",lib:"Brouillon"}};
const ALERTE={orpheline:{ico:"⚠",lib:"Orphelin — aucun accès"},lienCasse:{ico:"⛓",lib:"Lien cassé"},
  imageManquante:{ico:"▢",lib:"Image manquante"},imageIntrouvable:{ico:"▢",lib:"Fichier introuvable"}};
const ROLE={entree:"Entrée",sortie:"Sortie",pivot:"Pivot",optionnel:"Optionnel",verrouille:"Verrouillé"};

/* =====================================================================
   ZOOM SÉMANTIQUE
     Niveau 1 — les LIEUX seuls, grandes cartes lisibles sans zoomer.
     Niveau 2 — UN lieu ouvert : ses scènes, rencontres et points. Les autres
                lieux restent repliés — ouvrir un lieu n'ouvre jamais les autres.
     Niveau 3 — une scène sélectionnée : ses transitions ressortent, le reste
                s'atténue ; seuls les voisins à une distance restent pleins.
   ===================================================================== */
function niveau(){ return audit ? 9 : lieuOuvert ? (selection && selection.kind!=="lieu" ? 3 : 2) : 1; }
const LIB_NIVEAU={1:"Niveau 1 — les lieux de la zone",2:"Niveau 2 — un lieu ouvert",
  3:"Niveau 3 — une scène et ses transitions",9:"Mode audit — tout déplié"};

let zx=0,zy=0,zs=1;
let noeuds=[], arcs=[], posLieu={}, boitesRegion=[], regionsDecalees=[];

/* Disposition des LIEUX : leurs coordonnées viennent de la carte dessinée à la
   main dans l'atelier. On les met à l'échelle pour que deux grandes cartes ne
   se touchent jamais — sinon un nom de 14 px devient illisible à l'ouverture. */
function disposerLieux(){
  const L=(D.zones.find(z=>z.id===zoneActive)||D.zones[0]).lieux;
  const CW=286, CH=124;

  /* LES POSITIONS VIENNENT DE LA CARTE FIGMA DE PATRICK — telles quelles.
     `x` / `y` sont les coordonnées du coin haut-gauche des chips « LIEU » du
     frame 2112:325, recopiées dans data/zones/*.json (champ zone.carte).

     ⚠️ AUCUN réagencement : ni cohésion, ni séparation, ni balayage d'échelle.
     La version précédente calculait une disposition « propre » à partir de ces
     coordonnées — le résultat était lisible, mais ce n'était plus la carte de
     Patrick : deux lieux voisins pouvaient se retrouver aux deux bouts. Une
     carte qui range les lieux ne dit plus où ils sont.

     Conséquence assumée : si deux lieux se chevauchent dans le Figma, ils se
     chevauchent ici. On le SIGNALE en console au lieu de le corriger en
     douce — c'est une information sur la carte, pas un bug d'affichage. */
  posLieu={}; boitesRegion=[];
  L.forEach((l,i)=>{
    posLieu[l.id] = (l.x!=null && l.y!=null)
      ? {x:l.x, y:l.y}
      // Un lieu sans coordonnée n'est pas inventé au milieu des autres : il est
      // rangé en bande, SOUS la carte, où son absence de place se voit.
      : {x:(i%5)*(CW+30), y:2100+Math.floor(i/5)*(CH+30)};
  });

  /* LE CADRE DE RÉGION vient lui aussi du Figma (frame 2112:328), il n'est
     PAS déduit de ses membres : un rectangle calculé après coup englobe
     fatalement des lieux qui n'en font pas partie et affirme alors que la
     Borne Frontière est dans le Hameau. */
  (D.regions||[]).forEach(rg=>{
    if(!rg.boite) return;
    const ids=(rg.lieux||[]).filter(id=>posLieu[id]);
    boitesRegion.push({nom:rg.nom, x:rg.boite.x, y:rg.boite.y,
                       w:rg.boite.w, h:rg.boite.h, ids});
  });

  // ── Contrôles d'honnêteté (signalés, jamais corrigés en silence).
  const ids=Object.keys(posLieu);
  let chev=0;
  for(let a=0;a<ids.length;a++) for(let b=a+1;b<ids.length;b++){
    const p=posLieu[ids[a]], q=posLieu[ids[b]];
    if(p.x<q.x+CW && q.x<p.x+CW && p.y<q.y+CH && q.y<p.y+CH){
      chev++; console.warn("Studio : chevauchement Figma", ids[a], "×", ids[b]);
    }
  }
  boitesRegion.forEach(r=>{
    const intrus=ids.filter(id=>!r.ids.includes(id)).filter(id=>{
      const p=posLieu[id];
      return p.x<r.x+r.w && r.x<p.x+CW && p.y<r.y+r.h && r.y<p.y+CH;
    });
    if(intrus.length) console.warn("Studio : le cadre «",r.nom,"» touche", intrus);
  });
  if(chev) console.warn("Studio :",chev,"chevauchement(s) sur la carte Figma");
}

/* Les SÉQUENCES d'un lieu, d'après `suite` (le chaînage écrit dans le jeu).
   Un lieu n'est pas un tas de scènes : le Hameau en compte quinze, réparties
   en cinq séquences (l'entrée, la Femme au Seuil, la halte, la nuit dehors, le
   procès). Les empiler dans une seule colonne, comme le faisait la première
   version, cachait exactement ce qu'il faut voir. */
function sequences(l){
  const ss=(l.scenes||[]).map(id=>D.scenes.find(x=>x.id===id)).filter(Boolean);
  const dedans=new Set(ss.map(x=>x.id));
  const suivant={}; ss.forEach(x=>{ if(x.suite&&dedans.has(x.suite)) suivant[x.id]=x.suite; });
  const cibles=new Set(Object.values(suivant));
  const racines=ss.filter(x=>!cibles.has(x.id)).map(x=>x.id);
  const vus=new Set(), out=[];
  racines.forEach(r=>{
    const ch=[]; let cur=r;
    // Une queue partagée (la Femme au Seuil rejoint l'entrée du Hameau) n'est
    // placée qu'UNE fois ; la flèche montrera la jonction.
    while(cur && !vus.has(cur)){ vus.add(cur); ch.push(cur); cur=suivant[cur]; }
    if(ch.length) out.push(ch);
  });
  ss.forEach(x=>{ if(!vus.has(x.id)){ vus.add(x.id); out.push([x.id]); } });
  return out;
}

function construire(){
  const zone=D.zones.find(z=>z.id===zoneActive)||D.zones[0];
  noeuds=[];
  zone.lieux.forEach(l=>{
    const p=posLieu[l.id]; if(!p) return;
    const ouvert = audit || l.id===lieuOuvert;
    noeuds.push({id:l.id,kind:"lieu",x:p.x,y:p.y,w:286,h:124,data:l,ouvert});
    if(!ouvert) return;
    /* Le lieu déplié : UNE COLONNE PAR SÉQUENCE, les scènes dans l'ordre du
       jeu, leurs points d'intérêt collés à droite. On lit d'un coup d'œil
       combien de fils partent du lieu et où ils se rejoignent. */
    let x=p.x+18;
    sequences(l).forEach(ch=>{
      const scenes=ch.map(id=>D.scenes.find(s=>s.id===id)).filter(Boolean);
      const avecPoi=scenes.some(s=>s.pointsInteret.length);
      let y=p.y+150;
      scenes.forEach(s=>{
        noeuds.push({id:s.id,kind:natureScene(s),x,y,w:198,h:44,data:s,lieu:l.id});
        // ⚠️ Le pas vertical suit la hauteur MAXIMALE d'une vignette de point,
        // pas sa hauteur de base : un libellé sur deux lignes (« Les corbeaux,
        // sur la traverse ») fait 36 px là où la vignette d'une ligne en fait
        // 24 — à un pas de 34 les points se chevauchaient. Même piège que la
        // hauteur des cartes de lieu (CH) relevé le 30/07.
        s.pointsInteret.forEach((poi,k)=>{
          noeuds.push({id:poi.id,kind:"poi",x:x+210,y:y+k*42,w:174,h:38,data:poi,parent:s,lieu:l.id});
        });
        y += Math.max(60, s.pointsInteret.length*42+18);
      });
      x += avecPoi ? 410 : 232;
    });
  });
}

function ecarterDuDeplie(){
  if(audit || !lieuOuvert) { regionsDecalees=boitesRegion.map(b=>({...b})); return; }
  const b=boiteDeplie(lieuOuvert); if(!b) { regionsDecalees=boitesRegion.map(b=>({...b})); return; }
  const MG=34;
  const pousse=(o)=>{
    const w=o.w!=null?o.w:286, h=o.h!=null?o.h:124;
    if(o.x+w<b.x0-MG||o.x>b.x0+b.w+MG||o.y+h<b.y0-MG||o.y>b.y0+b.h+MG) return;
    const dG=o.x+w-(b.x0-MG), dD=(b.x0+b.w+MG)-o.x;
    const dH=o.y+h-(b.y0-MG), dB=(b.y0+b.h+MG)-o.y;
    const mn=Math.min(dG,dD,dH,dB);
    if(mn===dG) o.x-=dG; else if(mn===dD) o.x+=dD;
    else if(mn===dH) o.y-=dH; else o.y+=dB;
  };
  /* Le lieu ouvert et son contenu ne bougent pas ; tout le reste s'écarte.
     ⚠️ Un seul passage ne suffit pas : les lieux repoussés hors de la boîte se
     percutent ENTRE EUX (mesuré : 7 chevauchements sur le Hameau ouvert, qui
     déplie 15 scènes en 5 colonnes). On alterne donc « sortir de la boîte » et
     « ne pas se marcher dessus » jusqu'à ce que plus rien ne bouge. */
  const autres=noeuds.filter(n=>n.kind==="lieu" && n.id!==lieuOuvert);
  for(let it=0; it<80; it++){
    let bouge=false;
    autres.forEach(n=>{ const ax=n.x, ay=n.y; pousse(n); if(n.x!==ax||n.y!==ay) bouge=true; });
    for(let i=0;i<autres.length;i++) for(let j=i+1;j<autres.length;j++){
      const a=autres[i], b2=autres[j];
      let dx=(b2.x+b2.w/2)-(a.x+a.w/2), dy=(b2.y+b2.h/2)-(a.y+a.h/2);
      if(dx===0&&dy===0){ dx=(i%2?1:-1)*0.5; dy=0.5; }
      const cx=(a.w+b2.w)/2+22-Math.abs(dx), cy=(a.h+b2.h)/2+22-Math.abs(dy);
      if(cx<=0||cy<=0) continue;
      bouge=true;
      if(cx/((a.w+b2.w)/2) < cy/((a.h+b2.h)/2)){ const d=(dx>=0?1:-1)*cx/2; a.x-=d; b2.x+=d; }
      else { const d=(dy>=0?1:-1)*cy/2; a.y-=d; b2.y+=d; }
    }
    if(!bouge) break;
  }
  regionsDecalees=boitesRegion.map(r=>{
    const c={...r};
    if(!r.ids.includes(lieuOuvert)) pousse(c);
    else { // la région contient le lieu ouvert : elle épouse ses membres
      const m=noeuds.filter(n=>n.kind==="lieu"&&r.ids.includes(n.id));
      const x0=Math.min(...m.map(n=>n.x),b.x0)-26, y0=Math.min(...m.map(n=>n.y),b.y0)-36;
      c.x=x0; c.y=y0;
      c.w=Math.max(...m.map(n=>n.x+n.w),b.x0+b.w)+26-x0;
      c.h=Math.max(...m.map(n=>n.y+n.h),b.y0+b.h)+26-y0;
    }
    return c;
  });
}

function boiteDeplie(lid){
  const ns=noeuds.filter(n=>n.lieu===lid||n.id===lid);
  if(ns.length<2) return null;
  const x0=Math.min(...ns.map(n=>n.x))-16, y0=Math.min(...ns.map(n=>n.y))-16;
  const x1=Math.max(...ns.map(n=>n.x+n.w))+16, y1=Math.max(...ns.map(n=>n.y+n.h))+16;
  return {x0,y0,w:x1-x0,h:y1-y0};
}

/* Les CHOIX comme transitions : un lien porte ce qui le déclenche. */
function calculerArcs(){
  const parId=Object.fromEntries(noeuds.map(n=>[n.id,n]));
  arcs=[];
  D.liens.forEach(l=>{
    const a=parId[l.de], b=parId[l.vers]; if(!a||!b) return;
    const s=D.scenes.find(x=>x.id===l.de);
    let via=null;
    if(s && l.type==="secondaire") via=s.pointsInteret.find(p=>p.id===l.par);
    if(s && l.type==="conditionnel") via=s.choix.find(c=>c.id===l.par);
    arcs.push({a,b,type:l.type,via});
  });
  noeuds.filter(n=>n.kind==="poi").forEach(n=>{
    const p=parId[n.parent.id]; if(p) arcs.push({a:p,b:n,type:"attache"});
  });
}
const lieSel=a=>selection && (a.a.id===selection.id||a.b.id===selection.id);

/* Un tracé ONDULÉ le long d'un chemin quelconque (droite ou bézier).
   L'amplitude s'annule aux deux bouts : le départ sort proprement de la carte
   et l'arrivée pointe dans la vraie direction, sinon la pointe de flèche se
   retrouve de travers. */
function ondule(d, svg, amp=3.4, periode=17){
  const NS="http://www.w3.org/2000/svg";
  const tmp=document.createElementNS(NS,"path");
  tmp.setAttribute("d",d); tmp.setAttribute("fill","none"); tmp.setAttribute("stroke","none");
  svg.appendChild(tmp);                    // getTotalLength exige d'être dans le DOM
  const L=tmp.getTotalLength();
  if(L<12){ tmp.remove(); return d; }
  const n=Math.max(10, Math.round(L/3)), pts=[];
  for(let i=0;i<=n;i++){
    const s=L*i/n, p=tmp.getPointAtLength(s), q=tmp.getPointAtLength(Math.min(L,s+1));
    let dx=q.x-p.x, dy=q.y-p.y; const m=Math.hypot(dx,dy)||1; dx/=m; dy/=m;
    const fondu=Math.sin(Math.PI*i/n);     // 0 aux extrémités, 1 au milieu
    const o=Math.sin(s/periode*Math.PI*2)*amp*fondu;
    pts.push([p.x-dy*o, p.y+dx*o]);
  }
  tmp.remove();
  return "M"+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L");
}

function rendu(){
  construire();
  /* ⚠️ Un lieu déplié occupe beaucoup plus de place que sa carte repliée : ses
     colonnes de séquences débordent sur les lieux voisins (défaut visible sur
     la capture du Puits Condamné). On écarte donc TEMPORAIREMENT les autres
     lieux — et le cadre de région — hors de la boîte dépliée. Rien n'est
     mémorisé : refermer le lieu rend la carte à sa disposition d'origine. */
  ecarterDuDeplie();
  calculerArcs();
  const monde=$("#monde"), svg=$("#fondSvg");
  monde.querySelectorAll(".nd,.deplie,.region").forEach(e=>e.remove());
  svg.innerHTML=""; svg.setAttribute("width","12000"); svg.setAttribute("height","8000");
  /* Des FLÈCHES, pas des traits : « quelle conséquence suit mon action » se lit
     dans le SENS du lien. Un trait nu ne dit pas qui mène à qui. */
  svg.insertAdjacentHTML("beforeend",`<defs>
    <marker id="fl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
      orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#ffffff"/></marker>
    <marker id="flSel" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
      orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#e0632a"/></marker>
    <marker id="flSec" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
      orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#ffffff"/></marker>
  </defs>`);

  /* RÉGION — le Hameau des Renonçants, seule enclave géographique du jeu.
     Sa surface est RÉSERVÉE au placement (voir disposerLieux) : le cadre ne
     peut donc plus contenir un lieu qui n'en fait pas partie. */
  regionsDecalees.forEach(b=>{
    const el=document.createElement("div"); el.className="region";
    el.style.cssText=`left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px`;
    el.innerHTML=`<span>${esc(b.nom)}</span>`;
    monde.appendChild(el);
  });

  // Panneau du lieu ouvert : il se lit comme une carte qu'on déplie.
  noeuds.filter(n=>n.kind==="lieu"&&n.ouvert).forEach(n=>{
    const b=boiteDeplie(n.id); if(!b) return;
    const el=document.createElement("div"); el.className="deplie";
    el.style.cssText=`left:${b.x0}px;top:${b.y0}px;width:${b.w}px;height:${b.h}px`;
    el.innerHTML=`<span class="titre">${esc(n.data.nom)}</span>`;
    monde.appendChild(el);
  });

  // ── LIENS : principaux visibles, secondaires très atténués, conditionnels
  // masqués tant que rien n'est sélectionné (hors mode audit).
  /* Les traits sont BLANCS À PLEINE OPACITÉ (retour Patrick 30/07 : « les
     flèches ne se voient pas »). Ce qui distingue les types, c'est l'ÉPAISSEUR
     et le POINTILLÉ, jamais un affaiblissement — une flèche à 13 % d'opacité
     sur fond charbon n'existe pas. */
  const ST={principal:{c:"#ffffff",w:2,d:null},
            secondaire:{c:"#ffffff",w:1.6,d:"6 5"},
            conditionnel:{c:"#ffffff",w:1.6,d:null},
            attache:{c:"#ffffff",w:1.3,d:"2 6"}};
  arcs.forEach(t=>{
    const sel=lieSel(t);
    if(t.type==="conditionnel" && !sel && !audit) return;
    const st=ST[t.type]||ST.attache;
    // Deux scènes d'une même colonne : trait droit de bord à bord, pas une
    // courbe entre deux centres — une bézier verticale se cache sous les cartes.
    const memeColonne = Math.abs(t.a.x-t.b.x)<6 && t.b.y>t.a.y;
    let x1,y1,x2,y2,d;
    if(memeColonne){
      x1=x2=t.a.x+t.a.w/2; y1=t.a.y+t.a.h; y2=t.b.y;
      d=`M${x1},${y1} L${x2},${y2}`;
    }else{
      x1=t.a.x+t.a.w; y1=t.a.y+t.a.h/2; x2=t.b.x; y2=t.b.y+t.b.h/2;
      if(t.b.x<t.a.x){ x1=t.a.x; x2=t.b.x+t.b.w; }
      const mx=(x1+x2)/2;
      d=`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
    }
    if(t.via||t.type==="principal"){
      const hit=document.createElementNS("http://www.w3.org/2000/svg","path");
      hit.setAttribute("d",d); hit.setAttribute("fill","none");
      hit.setAttribute("stroke","transparent"); hit.setAttribute("stroke-width","14");
      hit.setAttribute("class","hit");
      hit.addEventListener("pointerenter",e=>infoLien(e,t));
      hit.addEventListener("pointerleave",()=>$("#infoLien").classList.remove("on"));
      svg.appendChild(hit);
    }
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    // ORIENTATION = ligne ONDULÉE (retour Patrick 03/08 : un pointillé et un
    // tireté se confondent d'un coup d'œil). L'ondulation est une différence
    // de FORME, pas d'épaisseur — elle se lit même en petit et même en noir
    // et blanc, contrairement à un simple changement de motif.
    p.setAttribute("d", t.type==="conditionnel" ? ondule(d,svg) : d);
    p.setAttribute("fill","none");
    p.setAttribute("stroke", sel?"#e0632a":st.c);
    p.setAttribute("stroke-width", sel?2:st.w);
    if(st.d && !sel) p.setAttribute("stroke-dasharray",st.d);
    if(t.type!=="attache")
      p.setAttribute("marker-end", sel?"url(#flSel)":(t.type==="principal"?"url(#fl)":"url(#flSec)"));
    svg.appendChild(p);
  });

  // ── NŒUDS
  const voisins=new Set();
  if(selection){ voisins.add(selection.id);
    arcs.forEach(a=>{ if(a.a.id===selection.id) voisins.add(a.b.id);
                      if(a.b.id===selection.id) voisins.add(a.a.id); }); }
  noeuds.forEach(n=>{
    const el=document.createElement("div");
    el.className="nd "+n.kind;
    if(selection&&selection.id===n.id) el.classList.add("sel");
    else if(selection && niveau()===3 && !voisins.has(n.id) && n.kind!=="lieu") el.classList.add("attenue");
    el.style.cssText=`left:${n.x}px;top:${n.y}px`;
    el.innerHTML = n.kind==="lieu" ? carteLieu(n.data) : carteInterne(n);
    el.onclick=e=>{ e.stopPropagation();
      if(n.kind==="lieu") ouvrirLieu(n.id); else selectionner(n.kind,n.id); };
    monde.appendChild(el);
  });

  $("#nivEtiq").textContent=LIB_NIVEAU[niveau()];
  const enLieu = !!lieuOuvert && !audit;
  $("#fil").classList.toggle("on", enLieu);
  $("#entete").style.display = enLieu ? "none" : "";
  if(enLieu){

/* ---------- navigation ---------- */
function ouvrirLieu(id){
  lieuOuvert = (lieuOuvert===id) ? null : id;   // ouvrir un lieu n'ouvre que lui
  selection = lieuOuvert ? {kind:"lieu",id} : null;
  $("#corps").classList.toggle("avec-panneau", !!selection);
  rendu(); renduPanneau();
  apresTransition(()=>{ if(lieuOuvert) cadrerSur(id); else ajusterLieux(); });
}
function selectionner(kind,id){
  if(kind!=="lieu"){
    const s = kind==="poi" ? (poiPar(id)||{}).scene : scenePar(id);
    if(s && s.lieu && lieuOuvert!==s.lieu) lieuOuvert=s.lieu;
  }
  selection={kind,id};
  $("#corps").classList.add("avec-panneau");
  rendu(); renduPanneau();
}
function fermer(){ selection=null; $("#corps").classList.remove("avec-panneau"); rendu(); }
const scenePar=id=>D.scenes.find(s=>s.id===id);
function poiPar(id){ for(const s of D.scenes){const p=s.pointsInteret.find(x=>x.id===id); if(p) return {poi:p,scene:s};} return null; }

function appliquer(){ $("#monde").style.transform=`translate(${zx}px,${zy}px) scale(${zs})`; }
/* ⚠️ #corps a une transition de 180 ms sur ses colonnes : mesurer #centre juste
   après avoir ouvert ou fermé le panneau donne l'ANCIENNE largeur, et le
   cadrage se fait sur un viewport qui n'existe plus (zoom divisé par deux). */
const apresTransition=fn=>setTimeout(fn,210);
function setZoom(ns,cx,cy){
  const av=zs; zs=Math.max(.2,Math.min(2.4,ns));
  const r=$("#centre").getBoundingClientRect();
  cx=cx==null?r.width/2:cx; cy=cy==null?r.height/2:cy;
  zx=cx-(cx-zx)*(zs/av); zy=cy-(cy-zy)*(zs/av); appliquer(); majMinimap();
}
/* Le cadrage initial ne regarde QUE les lieux : inclure les nœuds internes
   écrasait toute la carte en miniature au chargement. */
function ajusterLieux(){
  const L=noeuds.filter(n=>n.kind==="lieu"); if(!L.length) return;
  const x0=Math.min(...L.map(n=>n.x))-70, y0=Math.min(...L.map(n=>n.y))-70;
  const x1=Math.max(...L.map(n=>n.x+n.w))+70, y1=Math.max(...L.map(n=>n.y+n.h))+70;
  const r=$("#centre").getBoundingClientRect();
  zs=Math.max(.34,Math.min(1, Math.min(r.width/(x1-x0), r.height/(y1-y0))));
  zx=(r.width-(x1-x0)*zs)/2-x0*zs; zy=(r.height-(y1-y0)*zs)/2-y0*zs;
  appliquer(); majMinimap();
}
function cadrerSur(lid){
  const b=boiteDeplie(lid); if(!b) return ajusterLieux();
  const r=$("#centre").getBoundingClientRect();
  zs=Math.max(.3,Math.min(1.1, Math.min(r.width/(b.w+140), r.height/(b.h+140))));
  zx=(r.width-b.w*zs)/2-b.x0*zs; zy=(r.height-b.h*zs)/2-b.y0*zs;
  appliquer(); majMinimap();
}

/* ⚠️ Le drag écoute sur WINDOW : avec setPointerCapture sur la toile, seuls
   2 pointermove sur 10 arrivaient (mesuré le 28/07). */
(function(){
  const t=$("#toile"); let on=false,px=0,py=0,bouge=false;
  t.addEventListener("pointerdown",e=>{ if(e.target.closest(".nd"))return;
    on=true;bouge=false;px=e.clientX;py=e.clientY;t.classList.add("drag"); });
  window.addEventListener("pointermove",e=>{ if(!on)return; bouge=true;
    zx+=e.clientX-px; zy+=e.clientY-py; px=e.clientX; py=e.clientY; appliquer(); });
  window.addEventListener("pointerup",()=>{ if(on&&!bouge&&selection) fermer();
    on=false;t.classList.remove("drag"); majMinimap(); });
  t.addEventListener("wheel",e=>{ e.preventDefault(); const r=t.getBoundingClientRect();
    setZoom(zs*(e.deltaY<0?1.12:.89), e.clientX-r.left, e.clientY-r.top); },{passive:false});
})();

function majMinimap(){
  const cv=$("#minimap canvas"), r=cv.parentElement.getBoundingClientRect();
  cv.width=r.width; cv.height=r.height;
  const g=cv.getContext("2d"); g.clearRect(0,0,cv.width,cv.height);
  const L=noeuds.filter(n=>n.kind==="lieu"); if(!L.length) return;
  const x0=Math.min(...L.map(n=>n.x)), x1=Math.max(...L.map(n=>n.x+n.w));
  const y0=Math.min(...L.map(n=>n.y)), y1=Math.max(...L.map(n=>n.y+n.h));
  const k=Math.min(cv.width/(x1-x0||1), cv.height/(y1-y0||1))*.82;
  const ox=(cv.width-(x1-x0)*k)/2, oy=(cv.height-(y1-y0)*k)/2;
  L.forEach(n=>{ g.fillStyle=n.id===lieuOuvert?"#e0632a":"rgba(255,255,255,.4)";
    g.fillRect(ox+(n.x-x0)*k, oy+(n.y-y0)*k, Math.max(4,n.w*k), Math.max(3,n.h*k)); });
  const c=$("#centre").getBoundingClientRect();
  g.strokeStyle="#e0632a"; g.lineWidth=1;
  g.strokeRect(ox+(-zx/zs-x0)*k, oy+(-zy/zs-y0)*k, (c.width/zs)*k, (c.height/zs)*k);
}

/* =====================================================================
   PANNEAU
   ===================================================================== */
let onglet="details";
let editImage=null;   // le fichier dont le motif de remplacement est en cours de saisie
let reuseOuvert=null; // cible dont la reprise d'image est en cours de saisie
let reuseVal='';      // nom tapé, conservé entre deux rendus du panneau
function champEditable(cible,quoi,valeur,ctx){
  const j=journal.find(x=>x.cible===cible), v=j?j.apres:valeur;
  return `<span class="edit${j?" modifie":""}" data-cible="${esc(cible)}" data-quoi="${esc(quoi)}"
    data-ctx="${esc(ctx)}" data-avant="${esc(valeur==null?"":valeur)}">${esc(v)||'<i class="vide-txt">vide</i>'}</span>`;
}
/* L'action « remplacer » sous une image, commune au lieu, à la scène et au
   point d'intérêt : ils portent tous un `image.fichier`. */
/* ⚠️ CETTE ACTION N'EST PAS DERRIÈRE LE MODE ÉDITION (retour Patrick 03/08 :
   « je ne vois pas comment remplacer une image »). Juger une image n'est pas
   modifier une donnée de jeu : c'est le travail principal de Patrick sur ces
   pages, il doit être à un clic, toujours visible. Le mode Édition reste
   réservé à ce qui touche au CONTENU (libellés, textes, issues). */
/* RÉUTILISER UNE IMAGE DÉJÀ FAITE (demande Patrick 6/08).
   « Je ne veux pas refaire l'image entièrement avec Leonardo — je copie le nom
   de fichier d'une image et je le mets sur celle que je veux changer, comme ça
   les deux sont pareilles. »

   C'est une demande DISTINCTE de « Remplacer cette image » : là il n'y a
   AUCUN fichier à produire, seulement un câblage à déplacer. D'où un chemin
   séparé, et une cible qui porte l'ÉLÉMENT (la scène ou le point) et non le
   fichier — c'est le pointeur de l'élément qui change, le fichier ne bouge pas.

   Le champ accepte le collage libre ET propose la liste complète des assets
   publiés : coller « scene_x.png » ou le chemin entier marche pareil. Une
   vignette confirme visuellement AVANT d'enregistrer — sans elle on note un
   nom sans savoir ce qu'il y a derrière, ce qui est exactement le piège. */
function nomAsset(v){ return String(v||"").trim().replace(/^assets\//,"").split("?")[0]; }

/* Les noms d'asset connus. Deux sources plutôt qu'une : le manifeste (fait
   autorité, il liste tout ce qui est publié) ET l'export du Studio (images des
   scènes + réserve). Si le manifeste ne charge pas — page servie ailleurs,
   fetch en échec — le champ continuerait sinon de refuser TOUS les noms, ce
   qui ressemble à un bug alors que c'est une donnée manquante. */
function assetsConnus(){
  const set=new Set(Object.keys(MANIF.fichiers||{}));
  (D&&D.scenes||[]).forEach(sc=>{
    if(sc.image&&sc.image.fichier) set.add(nomAsset(sc.image.fichier));
    (sc.pointsInteret||[]).forEach(pi=>{ if(pi.image&&pi.image.fichier) set.add(nomAsset(pi.image.fichier)); });
  });
  (D&&D.reserve||[]).forEach(r=>set.add(nomAsset(r.fichier)));
  return set;
}

/* La galerie : toutes les images publiées, filtrées par ce qui est tapé.
   Le filtre porte sur le nom ; taper « meute » suffit à ne garder qu'elles.
   Le nom reste écrit sous chaque vignette au survol (title), mais c'est
   l'IMAGE qui décide — c'est tout l'objet du correctif. */
function galerieAssets(choisi){
  const tous = [...assetsConnus()].filter(n=>/\.(png|jpe?g)$/i.test(n)).sort();
  // ⚠️ Un nom COMPLET et valide n'est pas un filtre, c'est une sélection :
  // sinon cliquer une vignette ne laisserait qu'elle et masquerait la galerie,
  // rendant impossible de changer d'avis sans tout réeffacer.
  const saisi = nomAsset(reuseVal || "");
  const q = (saisi && assetsConnus().has(saisi)) ? "" : saisi.toLowerCase();
  const vus = q ? tous.filter(n=>n.toLowerCase().includes(q)) : tous;
  if(!vus.length) return `<div class="galerie-vide">Aucune image ne contient « ${esc(q)} »</div>`;
  return `<div class="galerie-cpt">${vus.length} image${vus.length>1?"s":""}${q?" trouvée"+(vus.length>1?"s":""):" publiées"}</div>
  <div class="galerie">` + vus.map(n =>
    `<div class="g${n===choisi?" actif":""}" data-pick="${esc(n)}" title="${esc(n)}"
       style="background-image:url('${urlImg("assets/"+n)}')"></div>`).join("") + `</div>`;
}

function blocReutiliser(fichier, ctx, el){
  const cible = "reuse:" + el.type + ":" + el.id;
  const j = journal.find(x => x.cible === cible);
  if (!j && reuseOuvert !== cible)
    return `<button data-reutiliser="${esc(cible)}">≡ Utiliser une image déjà faite</button>`;
  const choisi = j ? nomAsset(j.apres) : (reuseVal || "");
  const existe = choisi ? assetsConnus().has(choisi) : false;
  return `<div class="reuse">
    <label>Nom de l'image à reprendre</label>
    <input id="reuseNom" list="tousLesAssets" spellcheck="false"
      placeholder="filtre par nom, ou colle-en un — ex. meute" value="${esc(choisi)}">
    ${galerieAssets(choisi)}
    <div class="avant-apres">
      <div class="aa"><span>Aujourd'hui</span>
        <div class="vig" style="background-image:url('${urlImg("assets/"+fichier)}')"></div></div>
      <div class="aa"><span>Reprendrait</span>
        ${existe ? `<div class="vig neuve" style="background-image:url('${urlImg("assets/"+choisi)}')"></div>`
                 : `<div class="vig rien">${choisi ? "nom inconnu" : "aucun nom"}</div>`}</div>
    </div>
    <p class="pimgcible"><b>Élément</b> ${esc(el.type)} · <code>${esc(el.id)}</code></p>
    <div class="pimgbtns">
      <button class="p" data-noter-reuse="${esc(cible)}" data-ctx="${esc(ctx)}"
        data-actuel="${esc(fichier)}" ${existe ? "" : "disabled"}>${j ? "Mettre à jour" : "Enregistrer"}</button>
      ${j ? `<button data-annuler-reuse="${esc(cible)}">Retirer</button>`
          : `<button data-fermer-reuse="1">Annuler</button>`}
    </div>
  </div>`;
}

function actionImage(fichier, ctx, el){
  if(!fichier) return `<div class="pimgact"><p class="pimgvide">Aucune image sur cet écran — dépose-la ici quand elle existera, ou envoie-la-moi.</p></div>`;
  const cible="image:"+fichier;
  const j=journal.find(x=>x.cible===cible);
  const f=Fichiers.get(cible);
  if(!j && editImage!==cible)
    return `<div class="pimgact">
      <button data-remplacer="${esc(fichier)}" data-ctx="${esc(ctx)}">⟳ Remplacer cette image</button>
      ${blocReutiliser(fichier, ctx, el)}
    </div>`;

  const h=(MANIF.fichiers[fichier]||{}).hash||"—";
  return `<div class="pimgact ouvert">
    <div class="avant-apres">
      <div class="aa"><span>Actuelle</span>
        <div class="vig" style="background-image:url('${urlImg("assets/"+fichier)}')"></div></div>
      <div class="aa"><span>Nouvelle</span>
        ${f?`<div class="vig neuve" style="background-image:url('${f.url}')"></div>`
           :`<div class="vig rien">aucun fichier</div>`}</div>
    </div>
    <div class="pimgbtns">
      <button class="fbtn ${f?"":"p"}" data-pour="${esc(cible)}">${f?"Choisir un autre fichier":"Choisir la nouvelle image…"}
        <input type="file" accept="image/*" data-pour="${esc(cible)}"></button>
      ${f?`<button data-oter-fichier="${esc(cible)}">Retirer le fichier</button>`:""}
    </div>
    <label>Ce qui ne va pas avec cette image</label>
    <textarea id="motifImage" rows="3"
      placeholder="Ex. : le moulin a encore ses ailes, alors que le lieu s'appelle « le Moulin sans Ailes »."
      >${esc(j?j.apres:"")}</textarea>
    <p class="pimgcible">
      <b>Élément</b> ${esc(el.type)} · <code>${esc(el.id)}</code><br>
      <b>Chemin cible</b> <code>aldenhar/public/assets/${esc(fichier)}</code><br>
      <b>Hash publié</b> <code>${esc(h)}</code>${f?`<br><b>Fichier choisi</b> ${esc(f.nom)} · ${(f.taille/1024).toFixed(0)} Ko`:""}
    </p>
    <div class="pimgbtns">
      <button class="p" data-noter="${esc(fichier)}" data-ctx="${esc(ctx)}"
        data-el="${esc(JSON.stringify(el))}">${j?"Mettre à jour":"Enregistrer la demande"}</button>
      ${j?`<button data-annuler="${esc(fichier)}">Retirer</button>`
         :`<button data-fermer-img="1">Annuler</button>`}
    </div>
    ${j?`<p class="pimgok">${f
       ? "✓ Remplacement en attente, fichier joint. Journal → « Exporter le lot pour Claude »."
       : "✓ Noté, sans fichier. Choisis l'image ici, ou envoie-la-moi en pièce jointe."}</p>`:""}
  </div>`;
}

function renduPanneau(){
  const d=$("#droite");
  if(!selection){ d.innerHTML=""; return; }
  if(selection.kind==="lieu") return panneauLieu(d);
  if(selection.kind==="poi")  return panneauPoi(d);
  return panneauScene(d);
}

function corps(s){
  if(onglet==="choix") return blocChoix(s);
  if(onglet==="poi") return blocPois(s);
  if(onglet==="meta") return blocMeta(s);
  // SCÈNE-VARIANTE (refonte du lore 6/08) : sans ce bandeau, on croit avoir
  // deux scènes concurrentes alors qu'on en a une conditionnelle — c'est
  // l'information la plus importante de la fiche, donc elle passe en premier.
  const varBandeau = s.remplace
    ? `<div class="sect" style="border-left:3px solid var(--orange);padding-left:10px">
         <h3>Variante conditionnelle</h3>
         <p class="sysnote">Cette scène se joue <b>à la place de</b>
           <b class="mono">${esc(s.remplace.scene)}</b> quand le compte tient
           <b class="mono" style="color:var(--orange)">${esc(s.remplace.condition)}</b>.
           Elle n'est pas dans le pool de traversée : elle hérite de la place
           de l'originale.</p></div>`
    : "";
  return varBandeau + `<div class="sect"><h3>Narration</h3>
      ${s.narration.length? s.narration.map((p,i)=>`<p class="para">${champEditable(`scene:${s.id}:narration:${i}`,`Narration §${i+1}`,p,s.nom||s.id)}</p>`).join("")
        : '<p class="vide-txt">Aucune narration.</p>'}</div>
    <div class="sect"><h3>Choix <button data-onglet="choix">Voir les ${s.choix.length}</button></h3>
      ${s.choix.slice(0,3).map((c,i)=>ligne(c,i,s,true)).join("")||'<p class="vide-txt">Aucun choix.</p>'}</div>
    ${s.donneDecouverte?`<div class="sect"><h3>Ce que le joueur y comprend</h3>
      <p class="sysnote">Atteindre cet écran pose la découverte
      <b class="mono" style="color:var(--orange)">${esc(s.donneDecouverte)}</b> —
      elle survit à la mort du héros et conditionne d'autres scènes.</p></div>`:""}
    ${blocLiens(s)}${fiche(s.image,"scene:"+s.id)}`;
}

const TAGT={risque:"RISQUÉ",passif:"PASSIF",verrouille:"VERROUILLÉ",orientation:"ORIENTATION",
  suite:"CONTINUITÉ",repos:"REPOS"};
function ligne(c,i,s,court){
  const tags=[];
  if(c.type==="risque") tags.push(`<span class="tag st">${esc(c.stat)} ${c.seuil}</span>`);
  else if(c.type==="verrouille") tags.push(`<span class="tag st">${esc(c.stat)} requis</span>`);
  else tags.push(`<span class="tag">AUCUN TEST</span>`);
  tags.push(`<span class="tag">${TAGT[c.type]||c.type}</span>`);
  if(c.hautEnjeu) tags.push(`<span class="tag st">FORT ENJEU</span>`);
  const cut=t=>esc(court?t.slice(0,110)+(t.length>110?"…":""):t);
  let iss="";
  if(c.type==="risque"&&c.issues) iss=`<div class="iss">
      <div><b>Réussite</b> — ${cut(c.issues.reussite)}</div><div><b>Échec</b> — ${cut(c.issues.echec)}</div>
      ${court?"":`<div><b>Critique</b> — ${esc(c.issues.critique)}</div><div><b>Funeste</b> — ${esc(c.issues.funeste)}</div>`}</div>`;
  else if(c.consequence) iss=`<div class="iss"><div><b>Conséquence</b> — ${cut(c.consequence)}</div></div>`;
  else if(c.dest) iss=`<div class="iss"><div><b>Mène à</b> — ${esc(c.dest)}</div></div>`;
  const fx=[];
  if(c.donneObjet) fx.push("objet : "+c.donneObjet);
  if(c.donneSavoir) fx.push("savoir : "+c.donneSavoir);
  if(c.exigeSavoir) fx.push("exige : "+c.exigeSavoir);
  // DÉCOUVERTE (refonte du lore 6/08) : ce que le JOUEUR retient d'une vie à
  // l'autre. À distinguer du Savoir, qui meurt avec le héros — c'est la
  // différence la plus importante à voir ici.
  if(c.donneDecouverte) fx.push("découverte : "+c.donneDecouverte);
  if(c.exigeDecouverte) fx.push("exige la découverte : "+c.exigeDecouverte);
  if(c.soupcon!=null) fx.push("soupçon "+(c.soupcon>0?"+":"")+c.soupcon);
  if(c.serment) fx.push("serment : "+c.serment);
  if(c.poseFlag) fx.push("flag : "+c.poseFlag);
  // Les systèmes du 5/08 : qui t'a vu, ce que ça ouvre au procès, ce qu'il faut
  // avoir vécu pour que le choix existe.
  if(c.defense) fx.push("défense : "+c.defense);
  if(c.exigeContradiction) fx.push("exige une contradiction (2 vies)");
  if(c.renonce) fx.push("FIN — renoncement, sans mort");
  // États & besoins (5/08) : ce que ce choix fait au CORPS et au statut social.
  const nomEtat=i=>{const e=(D.etats||[]).find(x=>x.id===i);return e?e.nom:i};
  if(c.poseEtat) fx.push("pose "+nomEtat(c.poseEtat));
  if(c.poseEtatSiEchec) fx.push("pose "+nomEtat(c.poseEtatSiEchec)+" si le jet rate");
  if(c.exigeEtat) fx.push("n'existe que si "+nomEtat(c.exigeEtat));
  if(c.repondBesoin) fx.push("répond au besoin : "+c.repondBesoin);
  if((c.tags||[]).includes("fuite")) fx.push("fuite — disparaît si BOITEUX");
  const tem=c.temoin?`<div class="iss temoin"><div><b>${esc(c.temoin.nom)}</b>, ${esc(c.temoin.lieu)} —
    « ${esc(c.temoin.deposition)} »</div></div>`:"";
  return `<div class="ch ${c.type}">${tem?"":""}<div class="l1"><span class="num">${i+1}</span>
    <span class="lab">${champEditable(`choix:${s.id}:${c.id}:label`,"Libellé du choix",c.label,s.nom||s.id)}</span>
    <span class="tags">${tags.join("")}</span></div>${iss}
    ${!court&&c.type==="risque"?`<div class="fx"><span>seuil : ${champEditable(`choix:${s.id}:${c.id}:seuil`,"Difficulté (seuil)",c.seuil,`${s.nom||s.id} → ${c.label}`)}</span></div>`:""}
    ${fx.length?`<div class="fx">${fx.map(f=>`<span>${esc(f)}</span>`).join("")}</div>`:""}
    ${court?"":tem}</div>`;
}
const blocChoix=s=>s.choix.length
  ? `<div class="sect"><h3>${s.choix.length} choix</h3>${s.choix.map((c,i)=>ligne(c,i,s,false)).join("")}</div>${blocLiens(s)}`
  : '<p class="vide-txt">Aucun choix.</p>';
const blocPois=s=>s.pointsInteret.length
  ? `<div class="sect"><h3>${s.pointsInteret.length} points d'intérêt</h3>${s.pointsInteret.map(p=>{
      const img=urlImg(p.image&&p.image.fichier);

        ${p.poseEtat?`<p class="sysnote">pose l'état <b>${esc(((D.etats||[]).find(x=>x.id===p.poseEtat)||{}).nom||p.poseEtat)}</b> — le monde y réagira ensuite</p>`:""}
        ${p.temoin?`<p class="sysnote">vu par <b>${esc(p.temoin.nom)}</b></p>`:""}</div></div>`;}).join("")}</div>`
